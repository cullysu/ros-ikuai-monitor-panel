services:
  routeros-triage:
    build:
      context: .
      dockerfile: Dockerfile
    image: routeros-triage-panel:local
    container_name: routeros-triage-panel
    restart: unless-stopped
    ports:
      - "${ROS_PANEL_PUBLISHED_ADDR:-127.0.0.1}:${ROS_PANEL_PUBLISHED_PORT:-8080}:8080"
    environment:
      ROS_PANEL_BIND: "${ROS_PANEL_BIND:-0.0.0.0}"
      ROS_PANEL_PORT: "${ROS_PANEL_PORT:-8080}"
      ROS_PANEL_TARGET_IP: "${ROS_PANEL_TARGET_IP:-127.0.0.1}"
      ROS_PANEL_PROFILE: "${ROS_PANEL_PROFILE:-routeros_only}"
      ROS_PANEL_IP_ALIAS_WRITE_ENABLED: "${ROS_PANEL_IP_ALIAS_WRITE_ENABLED:-0}"
      ROS_PANEL_EXPOSE_ADMIN_SESSIONS: "${ROS_PANEL_EXPOSE_ADMIN_SESSIONS:-0}"
      ROS_PANEL_ACTION_QUEUE_LIMIT: "${ROS_PANEL_ACTION_QUEUE_LIMIT:-24}"
      ROS_MONITOR_ROUTER_HOST: "${ROS_MONITOR_ROUTER_HOST:-192.168.88.1}"
      ROS_MONITOR_ROUTER_USER: "${ROS_MONITOR_ROUTER_USER:-ros-panel-readonly}"
      ROS_MONITOR_ROUTER_PASSWORD: "${ROS_MONITOR_ROUTER_PASSWORD:-CHANGE_ME}"
      ROS_MONITOR_POLL_SECONDS: "${ROS_MONITOR_POLL_SECONDS:-1}"
      ROS_MONITOR_STATIC_POLL_SECONDS: "${ROS_MONITOR_STATIC_POLL_SECONDS:-300}"
      ROS_MONITOR_STATIC_REST_WORKERS: "${ROS_MONITOR_STATIC_REST_WORKERS:-1}"
      ROS_MONITOR_SLOW_REST_POLL_SECONDS: "${ROS_MONITOR_SLOW_REST_POLL_SECONDS:-60}"
      ROS_MONITOR_SLOW_REST_WORKERS: "${ROS_MONITOR_SLOW_REST_WORKERS:-2}"
      ROS_MONITOR_CONNECTION_DETAIL_POLL_SECONDS: "${ROS_MONITOR_CONNECTION_DETAIL_POLL_SECONDS:-4}"
      ROS_MONITOR_DETAIL_REST_WORKERS: "${ROS_MONITOR_DETAIL_REST_WORKERS:-1}"
      ROS_MONITOR_CONNECTION_PROTOCOL_POLL_SECONDS: "${ROS_MONITOR_CONNECTION_PROTOCOL_POLL_SECONDS:-30}"
    volumes:
      - routeros-triage-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  routeros-triage-data:
