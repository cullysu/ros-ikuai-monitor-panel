services:
  routeros-triage:
    build:
      context: .
      dockerfile: Dockerfile
    image: "${ROS_PANEL_IMAGE:-routeros-triage-panel:local}"
    container_name: "${ROS_PANEL_CONTAINER_NAME:-routeros-triage-panel}"
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${ROS_PANEL_PUBLISHED_PORT:-28646}:${ROS_PANEL_PORT:-28646}"
    environment:
      ROS_PANEL_BIND: "${ROS_PANEL_BIND:-0.0.0.0}"
      ROS_PANEL_PORT: "${ROS_PANEL_PORT:-28646}"
      ROS_PANEL_TARGET_IP: "${ROS_PANEL_TARGET_IP:-127.0.0.1}"
      ROS_PANEL_TRUST_PROXY_HEADERS: "${ROS_PANEL_TRUST_PROXY_HEADERS:-0}"
      ROS_PANEL_ALLOW_DOCKER_HOST_FORWARD: "${ROS_PANEL_ALLOW_DOCKER_HOST_FORWARD:-1}"
      ROS_PANEL_ALLOW_LOCALHOST_HOST_FORWARD: "${ROS_PANEL_ALLOW_LOCALHOST_HOST_FORWARD:-0}"
      ROS_PANEL_LOCALHOST_FORWARD_TOKEN: "${ROS_PANEL_LOCALHOST_FORWARD_TOKEN:-}"
      ROS_PANEL_PROFILE: "${ROS_PANEL_PROFILE:-routeros_only}"
      ROS_PANEL_IP_ALIAS_WRITE_ENABLED: "${ROS_PANEL_IP_ALIAS_WRITE_ENABLED:-0}"
      ROS_PANEL_EXPOSE_ADMIN_SESSIONS: "${ROS_PANEL_EXPOSE_ADMIN_SESSIONS:-0}"
      ROS_PANEL_LOCAL_SETTINGS_WRITE_ENABLED: "${ROS_PANEL_LOCAL_SETTINGS_WRITE_ENABLED:-0}"
      ROS_PANEL_ACTION_QUEUE_LIMIT: "${ROS_PANEL_ACTION_QUEUE_LIMIT:-24}"
      ROS_PANEL_READONLY_DNS_SERVERS: "${ROS_PANEL_READONLY_DNS_SERVERS:-}"
      ROS_PANEL_READONLY_OPENWRT_DNS: "${ROS_PANEL_READONLY_OPENWRT_DNS:-}"
      ROS_PANEL_READONLY_NIKKI_CONTROLLER: "${ROS_PANEL_READONLY_NIKKI_CONTROLLER:-}"
      ROS_MONITOR_ROUTER_HOST: "${ROS_MONITOR_ROUTER_HOST:-192.168.88.1}"
      ROS_MONITOR_ROUTER_USER: "${ROS_MONITOR_ROUTER_USER:-ros-panel-readonly}"
      ROS_MONITOR_ROUTER_PASSWORD: "${ROS_MONITOR_ROUTER_PASSWORD:-CHANGE_ME}"
      ROS_MONITOR_ROUTER_REST_SCHEME: "${ROS_MONITOR_ROUTER_REST_SCHEME:-https}"
      ROS_MONITOR_ROUTER_REST_PORT: "${ROS_MONITOR_ROUTER_REST_PORT:-443}"
      ROS_MONITOR_ROUTER_REST_VERIFY_TLS: "${ROS_MONITOR_ROUTER_REST_VERIFY_TLS:-1}"
      ROS_MONITOR_INSECURE_REST_CONFIRMED: "${ROS_MONITOR_INSECURE_REST_CONFIRMED:-0}"
      ROS_MONITOR_SSH_HOST_KEY_FINGERPRINT: "${ROS_MONITOR_SSH_HOST_KEY_FINGERPRINT:-}"
      ROS_PANEL_SESSION_TTL_SECONDS: "${ROS_PANEL_SESSION_TTL_SECONDS:-28800}"
      ROS_PANEL_SESSION_MAX: "${ROS_PANEL_SESSION_MAX:-128}"
      ROS_PANEL_SESSION_BOOTSTRAP_LIMIT: "${ROS_PANEL_SESSION_BOOTSTRAP_LIMIT:-30}"
      ROS_PANEL_LOGIN_ATTEMPT_LIMIT: "${ROS_PANEL_LOGIN_ATTEMPT_LIMIT:-8}"
      ROS_PANEL_RATE_LIMIT_WINDOW_SECONDS: "${ROS_PANEL_RATE_LIMIT_WINDOW_SECONDS:-60}"
      ROS_MONITOR_POLL_SECONDS: "${ROS_MONITOR_POLL_SECONDS:-1}"
      ROS_MONITOR_STATIC_POLL_SECONDS: "${ROS_MONITOR_STATIC_POLL_SECONDS:-300}"
      ROS_MONITOR_STATIC_REST_WORKERS: "${ROS_MONITOR_STATIC_REST_WORKERS:-1}"
      ROS_MONITOR_SLOW_REST_POLL_SECONDS: "${ROS_MONITOR_SLOW_REST_POLL_SECONDS:-60}"
      ROS_MONITOR_SLOW_REST_WORKERS: "${ROS_MONITOR_SLOW_REST_WORKERS:-2}"
      ROS_MONITOR_CONNECTION_DETAIL_POLL_SECONDS: "${ROS_MONITOR_CONNECTION_DETAIL_POLL_SECONDS:-4}"
      ROS_MONITOR_DETAIL_REST_WORKERS: "${ROS_MONITOR_DETAIL_REST_WORKERS:-1}"
      ROS_MONITOR_CONNECTION_PROTOCOL_POLL_SECONDS: "${ROS_MONITOR_CONNECTION_PROTOCOL_POLL_SECONDS:-30}"
    volumes:
      - routeros-triage-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1536m
    cpus: 1.50
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/api/health' % os.getenv('ROS_PANEL_PORT', '28646'), timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  routeros-triage-data:
