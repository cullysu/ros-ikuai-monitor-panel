<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>&#x8BBE;&#x5907;&#x53EA;&#x8BFB;&#x72B6;&#x6001;&#x9762;&#x677F;</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23165dff'/%3E%3Cpath d='M16 36h32M20 26h24M25 18h14' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='20' cy='46' r='4' fill='%237d8da1'/%3E%3Ccircle cx='32' cy='46' r='4' fill='%23f08c00'/%3E%3Ccircle cx='44' cy='46' r='4' fill='%23ffffff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/assets/framework/style.css" data-overview-framework-asset="style">
  <link rel="stylesheet" href="/assets/legacy/panel-legacy.css">
  <script src="/assets/framework/panel-framework.js" data-overview-framework-asset="script"></script>
</head>
<body
  data-app-shell="ikuai"
  data-deploy-channel="public"
>
  <div class="app ik-shell" data-shell-mode="ikuai-thin">
    <aside class="ik-rail" id="ikRail" aria-label="主导航" data-shell-nav="primary">
      <div class="ik-rail-logo" aria-hidden="true"><span>监</span></div>
      <div class="ik-rail-group" aria-label="主要模块">
        <a class="ik-rail-button is-active" href="#overview" data-section="overview" data-panel-label="首页" title="系统首页" aria-label="首页"><span class="ik-rail-text">首页</span></a>
        <a class="ik-rail-button" href="#balance" data-section="balance" data-panel-label="WAN" title="WAN 与分流状态" aria-label="WAN"><span class="ik-rail-text">WAN</span></a>
        <a class="ik-rail-button" href="#interfaces" data-section="interfaces" data-panel-label="接口" title="接口总览" aria-label="接口"><span class="ik-rail-text">接口</span></a>
        <a class="ik-rail-button" href="#dhcp" data-section="dhcp" data-panel-label="终端" title="终端与 DHCP" aria-label="终端"><span class="ik-rail-text">终端</span></a>
        <a class="ik-rail-button" href="#trafficLoad" data-section="trafficLoad" data-panel-label="资源" title="资源与负载" aria-label="资源"><span class="ik-rail-text">资源</span></a>
        <a class="ik-rail-button" href="#logs" data-section="logs" data-panel-label="日志" title="日志中心" aria-label="日志"><span class="ik-rail-text">日志</span></a>
      </div>
      <div class="ik-rail-group" aria-label="辅助模块">
        <a class="ik-rail-button" href="#dns" data-section="dns" data-panel-label="DNS" title="DNS 服务"><span class="ik-rail-text">DNS</span></a>
        <a class="ik-rail-button" href="#routes" data-section="routes" data-panel-label="路由" title="静态路由"><span class="ik-rail-text">路由</span></a>
      </div>
      <div class="ik-rail-spacer"></div>
      <div class="ik-rail-group">
        <button class="ik-rail-button ik-readonly-btn" type="button" title="只读：不写 RouterOS 配置" data-readonly-info-open aria-label="只读：不写 RouterOS 配置"><span class="ik-rail-text">只读</span></button>
      </div>
    </aside>
    <aside class="sidebar" data-shell-sidebar="legacy">
      <div class="ik-brand">
        <div class="ik-brand-left">
          <div class="ik-brand-title">&#x76D1;&#x63A7;</div>
          <div class="ik-brand-chip">&#x53EA;&#x8BFB;</div>
        </div>
        <div class="ik-brand-user" aria-hidden="true">监控</div>
      </div>
      <nav class="nav-group ik-menu-stack" id="ikMenuPanel" aria-label="状态台菜单">
        <a class="ik-menu-item is-active" href="#overview" data-section="overview"><span>首页</span><em>状态/趋势</em></a>
        <a class="ik-menu-item" href="#balance" data-section="balance"><span>WAN</span><em>出口/路由/分流</em></a>
        <a class="ik-menu-item" href="#interfaces" data-section="interfaces"><span>接口</span><em>WAN/LAN/PPPoE</em></a>
        <a class="ik-menu-item" href="#dhcp" data-section="dhcp"><span>终端</span><em>在线终端 / DHCP / 连接数</em></a>
        <a class="ik-menu-item" href="#trafficLoad" data-section="trafficLoad"><span>资源</span><em>CPU / 内存 / 吞吐 TopN</em></a>
        <a class="ik-menu-item" href="#logs" data-section="logs"><span>日志</span><em>REST / SSH / 失败端点</em></a>
      </nav>
      <button class="ik-search-pill" type="button" data-quick-search-open data-shell-search="quick">搜索 <strong>Ctrl + K</strong></button>
      <div class="ik-sidebar-mini-status" data-overview-sidebar-mini-status="readonly">
        <div><span>只读</span><b>不写 RouterOS 配置</b></div>
        <div><span>快照</span><b>随页面更新</b></div>
        <div><span>通道</span><b>REST / SSH</b></div>
        <div><span>场景</span><b>看状态总线</b></div>
      </div>
    </aside>
    <div class="frame overview-title-only">
      <header class="topbar">
        <div class="topbar-header">
          <div>
            <div class="page-title" id="pageTitle">&#x7CFB;&#x7EDF;&#x9996;&#x9875;</div>
            <div class="page-subtitle is-hidden" id="pageSubtitle"></div>
            <select class="mobile-section-select" id="mobileSectionSelect" aria-label="&#x5207;&#x6362;&#x9875;&#x9762;"></select>
            <button class="mobile-readonly-button" type="button" data-readonly-info-open>&#x53EA;&#x8BFB;&#x8FB9;&#x754C;</button>
          </div>
          <div class="topbar-actions">
            <div class="toolbar-line">
              <div class="deploy-pill">&#x90E8;&#x7F72;&#x5165;&#x53E3; 192.168.3.5</div>
              <div class="update-pill"><span class="dot" id="healthDot"></span><span id="updateText">&#x521D;&#x59CB;&#x5316;&#x4E2D;</span></div>
            </div>
            <div class="refresh-toolbar">
              <button class="action-btn primary" id="manualRefreshBtn" type="button">&#x7ACB;&#x5373;&#x5237;&#x65B0;</button>
              <div class="refresh-meta">
                <span id="refreshModeText">&#x5B9E;&#x65F6;&#x8F6E;&#x8BE2;</span>
                <strong id="nextRefreshText">1 &#x79D2;&#x5237;&#x65B0;</strong>
              </div>
            </div>
          </div>
        </div>
        <div class="status-strip" id="topMetrics"></div>
      </header>
      <main class="content" id="app"></main>
    </div>
  </div>
  <script src="/assets/legacy/panel-legacy.js"></script>
</body>
</html>
