      return { key: selected ? selected.name : 'aggregate', line: selected };
    }

    function renderOverviewWanLineSwitch(pppoe, selectedKey) {
      const rows = Array.isArray(pppoe) ? pppoe : [];
      const lineOptions = rows.map((row) => {
        const selected = row.name === selectedKey ? ' selected' : '';
        const state = row.running ? '在线' : '离线';
        return `<option value="${escapeHtml(row.name)}"${selected}>${escapeHtml(row.name)} · ${state} · ${fmtRate(totalTrafficRate(row))}</option>`;
      }).join('');
      const disabled = rows.length ? '' : ' disabled';
      return `<div class="ik-wan-switch" data-overview-wan-switch>
        <span class="ik-wan-switch-label">切换线路</span>
        <select class="ik-wan-line-select" data-overview-wan-line aria-label="切换 WAN 线路"${disabled}>
          <option value="aggregate"${selectedKey === 'aggregate' ? ' selected' : ''}>聚合全部线路</option>
          ${lineOptions}
        </select>
      </div>`;
    }

    function wanAccessBuckets(wanRows = []) {
      const labels = ['PPPoE', 'DHCP', 'VLAN', 'Static', 'Unknown'];
      const buckets = Object.fromEntries(labels.map((label) => [label, { total: 0, online: 0 }]));
      (wanRows || []).forEach((row) => {
        const key = labels.includes(row?.access) ? row.access : 'Unknown';
        buckets[key].total += 1;
        if (row?.running) buckets[key].online += 1;
      });
      return buckets;
    }

    function wanAccessSummaryText(wanRows = []) {
      const buckets = wanAccessBuckets(wanRows);
      return ['PPPoE', 'DHCP', 'VLAN', 'Static', 'Unknown']
        .filter((key) => buckets[key].total)
        .map((key) => `${key} ${fmtNumber(buckets[key].online)}/${fmtNumber(buckets[key].total)}`)
        .join(' · ') || '未采集';
    }

    function defaultRouteHealth(snapshot = {}, wanRows = []) {
      const defaults = snapshot.routes?.defaultRoutes || [];
      const rowRouteCount = (wanRows || []).reduce((sum, row) => sum + (row.routes || []).filter((route) => route.active).length, 0);
      const activeDefaults = defaults.filter((row) => row.active && !row.disabled).length || rowRouteCount;
      const hasRouteEvidence = defaults.length > 0 || rowRouteCount > 0;
      if (snapshot.status === 'error' || !hasRouteEvidence) {
        return { label: '不可判定', level: 'warn', state: 'unavailable', text: '默认路由不可判定', active: 0, total: defaults.length || rowRouteCount };
      }
      if (activeDefaults > 0) return { label: '正常', level: 'ok', state: 'active', text: `${fmtNumber(activeDefaults)} 条活动默认路由`, active: activeDefaults, total: defaults.length || rowRouteCount };
      return { label: '异常', level: 'danger', state: 'inactive', text: '未发现活动默认路由', active: 0, total: defaults.length || rowRouteCount };
    }

    function wanHealthState(wanRows = [], routeHealth = {}) {
      const total = (wanRows || []).length;
      const online = (wanRows || []).filter((row) => row?.running).length;
      const offline = Math.max(0, total - online);
      if (!total) return { label: '未采集', level: 'warn', online, total, offline, text: '未采集到 WAN 线路' };
      if (online === 0) return { label: '全部离线', level: 'danger', online, total, offline, text: `${fmtNumber(total)} 条 WAN 线路全部离线` };
      if (routeHealth.level === 'danger') return { label: '默认路由异常', level: 'danger', online, total, offline, text: routeHealth.text || '默认路由异常' };
      if (offline > 0) return { label: '部分离线', level: 'warn', online, total, offline, text: `离线 ${fmtNumber(offline)} 条` };
      if (routeHealth.level === 'warn') return { label: '路由待确认', level: 'warn', online, total, offline, text: routeHealth.text || '默认路由待确认' };
      return { label: '全部在线', level: 'ok', online, total, offline, text: `${fmtNumber(total)} 条 WAN 线路在线` };
    }

    function collectionRiskState(snapshot = {}, freshness = snapshotFreshnessState(snapshot), failures = failedEndpointSummary(snapshot)) {
      const trust = overviewCollectionTrust({
        snapshot,
        freshness,
        failures,
        capabilities: snapshot.meta?.capabilities || {}
      });
      return collectionDisplayState({
        snapshot,
        freshness,
        failures,
        capabilities: snapshot.meta?.capabilities || {}
      }, trust);
    }

    function collectionDisplayState(ctx, collection = ctx.verdict?.collection || overviewCollectionTrust(ctx)) {
      const freshness = ctx.freshness || snapshotFreshnessState(ctx.snapshot);
      const labels = historyAwareCapabilityLabels(ctx.capabilities, freshness);
      const restLabel = stripChannelPrefix(collection.restLabel || labels.restLabel, 'REST');
      const sshLabel = stripChannelPrefix(collection.sshLabel || labels.sshLabel, 'SSH');
      return {
        ...collection,
        restLabel,
        sshLabel,
        channelText: `REST ${restLabel} / SSH ${sshLabel}`,
        channelPairText: `${restLabel} / ${sshLabel}`
      };
    }

    function overviewCollectionChannelLabels(ctx, collection = null) {
      const freshness = ctx.freshness || snapshotFreshnessState(ctx.snapshot);
      const labels = historyAwareCapabilityLabels(ctx.capabilities, freshness);
      const source = collection || ctx.verdict?.collection || {};
      return {
        restLabel: stripChannelPrefix(source.restLabel || labels.restLabel, 'REST'),
        sshLabel: stripChannelPrefix(source.sshLabel || labels.sshLabel, 'SSH'),
      };
    }

    function overviewSnapshotTrustLabel(ctx) {
      const verdict = ctx.verdict || buildOverviewVerdict(ctx);
      if (verdict.topKey === 'no-snapshot' || snapshotIsUnavailable(ctx.snapshot)) return '不可判定';
      if (verdict.topKey === 'collection-down' || verdict.topKey === 'collection-degraded' || verdict.collection?.channelDegraded) return '缓存快照';
      if (isHistorySnapshot(ctx.freshness)) return '历史快照';
      return '实时';
    }

    function overviewCompactBox(label, mainHtml, subText = '', level = '', noteText = '', extraAttrs = '') {
      const toneClass = level ? ` is-${escapeHtml(level)}` : '';
      const subHtml = subText ? `<div class="subtle" style="margin-top:2px;line-height:1.05;">${escapeHtml(subText)}</div>` : '';
      const noteHtml = noteText ? `<div class="subtle" style="margin-top:1px;line-height:1.03;">${escapeHtml(noteText)}</div>` : '';
      const attrs = extraAttrs ? ` ${String(extraAttrs).trim()}` : '';
      return `<div class="ik-summary-box${toneClass}" data-overview-field${attrs} style="min-height:36px;padding:4px 5px;">
        <div class="subtle">${escapeHtml(label)}</div>
        <b style="margin-top:3px;line-height:1.03;">${mainHtml}</b>
        ${subHtml}
        ${noteHtml}
      </div>`;
    }

    function overviewCompactActionLink(href, label, section = '') {
      const sectionAttr = section ? ` data-section="${escapeHtml(section)}"` : '';
      const labelText = escapeHtml(label);
      return `<a class="ik-home-action-link" data-overview-field href="${escapeHtml(href)}"${sectionAttr} title="${labelText}" aria-label="${labelText}" style="display:inline-flex;align-items:center;min-height:0;padding:0 1px;border:0;background:transparent;color:#5b738c;font-size:10px;font-weight:700;line-height:1.15;text-decoration:none;text-underline-offset:1px;box-shadow:none;">${labelText}</a>`;
    }

    function overviewFlatTopbar(items = [], level = '') {
      const levelClass = level ? ` is-${escapeHtml(level)}` : '';
      return `<div class="ik-home-flat-topbar${levelClass}" data-overview-flat-topbar data-overview-status-bar>
        ${(items || []).map((item) => {
          const valueHtml = item?.html ?? escapeHtml(String(item?.value ?? '-'));
          const noteHtml = item?.note
            ? `<div class="subtle" style="margin-top:1px;line-height:1.03;">${escapeHtml(item.note)}</div>`
            : '';
          const cellClass = item?.level ? ` is-${escapeHtml(item.level)}` : '';
          const titleAttr = item?.title ? ` title="${escapeHtml(item.title)}"` : '';
          return `<div class="ik-home-flat-cell ik-home-ops-item${cellClass}" data-overview-field${titleAttr}><span>${escapeHtml(item?.label || '')}</span><b>${valueHtml}</b>${noteHtml}</div>`;
        }).join('')}
      </div>`;
    }

    function overviewFlatModule(module, title, subtitle, body, extraAttrs = '', extraClass = '') {
      const attrs = extraAttrs ? ` ${String(extraAttrs).trim()}` : '';
      const className = extraClass ? ` ${escapeHtml(extraClass)}` : '';
      return `<div class="ik-overview-flat-module${className}" data-overview-density-module="${escapeHtml(module)}"${attrs}>
        <div class="ik-overview-flat-head"><div class="ik-overview-flat-title">${escapeHtml(title)}</div><div class="ik-overview-flat-sub">${escapeHtml(subtitle || '')}</div></div>
        <div class="ik-overview-flat-body">${body}</div>
      </div>`;
    }

    function overviewSubtable(title, body) {
      return `<div class="ik-overview-subtable"><div class="ik-overview-subtable-title">${escapeHtml(title)}</div>${body}</div>`;
    }

    function overviewEvidenceGrid(items = [], columns = 3, extraClass = '') {
      const safeColumns = Math.max(1, Number(columns) || 3);
      const className = extraClass ? ` ${extraClass}` : '';
      const noSnapshotAttr = /is-no-snapshot-grid/.test(String(extraClass || '')) ? ' data-overview-no-snapshot-grid' : '';
      return `<div class="ik-home-evidence ik-home-evidence-grid${className}" data-overview-evidence-grid${noSnapshotAttr} style="display:grid;grid-template-columns:repeat(${safeColumns},minmax(0,1fr));gap:2px;min-width:0;align-items:stretch;grid-auto-flow:row dense;">
        ${(items || []).map((item) => overviewCompactBox(
          item.label,
          item.mainHtml ?? escapeHtml(item.mainText || '-'),
          item.subText || '',
          item.level || '',
          item.noteText || ''
        )).join('')}
      </div>`;
    }

    function overviewKeyEvidenceTable(ctx, items = [], focus = overviewDesktopFocus(ctx)) {
      const noSnapshotAttr = focus.key === 'no-snapshot' ? ' data-overview-no-snapshot-grid' : '';
      const history = isHistorySnapshot(ctx.freshness);
      const reasonMark = (item) => {
        const text = `${item.label || ''} ${item.mainText || ''} ${item.subText || ''} ${item.noteText || ''}`;
        if (/不可达|当前不可达/.test(text)) return '不可达';
        if (/不可用/.test(text)) return '不可用';
        if (/缺依赖/.test(text)) return '缺依赖';
        if (/未承载/.test(text)) return '未承载';
        if (/缓存|留存/.test(text)) return '缓存';
        if (/陈旧|超龄/.test(text)) return '超龄';
        if (/待判定/.test(text)) return '待判定';
        if (/待确认/.test(text)) return '待确认';
        return item.level === 'danger' ? '异常' : item.level === 'warn' ? '降级' : '';
      };
      const headers = focus.key === 'resource-full'
        ? ['指标', '当前', '阈值 / 持续 / 峰值', '标记']
        : focus.key === 'collection-down'
          ? ['通道', '当前', '最近成功 / 失败端点', '标记']
          : focus.key === 'no-snapshot'
            ? ['采集项', '当前', '边界', '标记']
            : overviewIsWanIncidentKey(focus.key) || focus.key === 'interfaces-down'
              ? ['线路', '状态', 'parent / bridge / vlan / pppoe-out', '标记']
              : ['对象', '当前', '依据', '标记'];
      const rows = (items || []).map((item) => {
        const value = item.mainHtml ?? escapeHtml(item.mainText || '-');
        const noteParts = [item.subText, item.noteText].filter(Boolean).join(' · ');
        const markText = reasonMark(item);
        const state = item.level === 'danger'
          ? tag('异常', 'danger')
          : item.level === 'warn'
            ? tag(markText || '降级', 'warn')
            : '';
        return `<tr data-overview-field>
          <td>${escapeHtml(item.label || '-')}</td>
          <td><b>${value}</b></td>
          <td>${escapeHtml(noteParts || '-')}</td>
          <td>${state}</td>
        </tr>`;
      });
      return overviewFlatModule(
        'key-evidence',
        '关键证据',
        '对象 / 数字 / 依据',
        compactTable(headers, rows, '暂无关键证据', 'ik-home-evidence-table'),
        `data-overview-evidence-grid${noSnapshotAttr}`,
        'ik-home-key-evidence'
      );
    }

    function overviewAnomalyObjectHtml(names = []) {
      const safeNames = (names || []).filter(Boolean);
      if (!safeNames.length) return escapeHtml('未列出');
      return safeNames
        .map((name) => `<span data-overview-anomaly-object="${escapeHtml(name)}">${escapeHtml(name)}</span>`)
        .join(' / ');
    }

    function overviewStateSummaryTable(ctx, focus = overviewDesktopFocus(ctx)) {
      const verdict = ctx.verdict || buildOverviewVerdict(ctx);
      const noSnapshot = verdict.topKey === 'no-snapshot' || snapshotIsUnavailable(ctx.snapshot);
      const history = isHistorySnapshot(ctx.freshness);
      const collection = collectionDisplayState(ctx, verdict.collection || overviewCollectionTrust(ctx));
      const routeDisplay = overviewRouteDisplay(ctx);
      const routeRawSummary = defaultRouteRawSummary(ctx);
      const latestSuccess = latestCollectionSuccessTime(ctx);
      const channelStateText = overviewChannelPair(collection.restLabel, collection.sshLabel);
      const dataStateText = shortTimestampText(collection.dataStateText || collection.dataText || latestSuccess);
      const resourceText = noSnapshot
        ? '不可判定'
        : `CPU ${fmtPercent(ctx.o.cpuLoad)} / MEM ${fmtPercent(ctx.o.memoryUsage)} / DISK ${fmtPercent(ctx.o.diskUsage)}`;
      const trafficText = noSnapshot
        ? '不可判定'
        : `${fmtRate(ctx.wanRates.up)} / ${fmtRate(ctx.wanRates.down)}`;
      const terminalText = noSnapshot
        ? '不可判定'
        : `${fmtNumber(ctx.onlineTerminals || 0)} 在线 / ${fmtCompact(ctx.connectionTotal)} 连接`;
      const stateTag = (level) => {
        if (!level) return '';
        if (level === 'danger') return tag('异常', 'danger');
        if (level === 'warn') return tag('降级', 'warn');
        return '';
      };
      const row = (label, value, note, level = '') => `<tr data-overview-field>
        <td>${escapeHtml(label)}</td>
        <td><b>${escapeHtml(String(value ?? '-'))}</b></td>
        <td>${escapeHtml(String(note ?? '-'))}</td>
        <td>${stateTag(level)}</td>
      </tr>`;
      const collectionRows = [
        row('通道状态', channelStateText, collection.summaryText || collection.label || '通道状态', collection.level === 'danger' ? 'danger' : collection.channelDegraded ? 'warn' : history ? 'trust' : 'ok'),
        row('数据层状态', dataStateText, `最后成功 ${shortTimestamp(latestSuccess)}`, collection.dataStale || collection.channelDegraded ? 'warn' : history ? 'trust' : 'ok')
      ];
      const rows = [
        row('WAN 线路', noSnapshot ? '缺快照' : `${fmtNumber(ctx.wanHealth.online)}/${fmtNumber(ctx.wanHealth.total)}`, noSnapshot ? '只读边界，业务数据不展示' : overviewWanAccessImpact(ctx), noSnapshot ? 'warn' : ctx.wanHealth.level),
        row('默认路由', noSnapshot ? '待判定' : (routeDisplay.label || '-'), noSnapshot ? '路由快照缺失' : (routeRawSummary || routeDisplay.text || focus.routeSummary || '-'), noSnapshot ? 'warn' : routeDisplay.level),
        ...collectionRows,
        row(noSnapshot ? '业务快照' : '业务快照年龄', noSnapshot ? '无' : snapshotBusinessAgeText(ctx.snapshot, ctx.freshness), noSnapshot ? noSnapshotBusinessStateText() : shortTimestampText(snapshotBusinessTimeText(ctx.snapshot, ctx.freshness)), noSnapshot || ctx.freshness?.stale ? 'warn' : history ? 'trust' : 'ok'),
        row('资源', resourceText, noSnapshot ? '只读边界，资源阈值不展示' : (ctx.resourceEvidence?.summary || `${fmtNumber(ctx.sampleCount)} 点`), noSnapshot ? 'warn' : ctx.resourceLevel),
        row('流量', trafficText, noSnapshot ? '只读边界，速率账本不生成' : `${fmtNumber(ctx.sampleCount)} 点 · ${ctx.pollText}`, noSnapshot ? 'warn' : 'trust'),
        row('终端 / 连接', terminalText, noSnapshot ? '只读边界，终端排行不展示' : `PPP ${fmtNumber(ctx.activeSessions || 0)} / 最近成功 ${shortTimestamp(latestCollectionSuccessTime(ctx))}`, noSnapshot ? 'warn' : 'trust')
      ];
      return overviewFlatModule(
        'status-summary',
        '状态摘要',
        '全局结果 / 可信度',
        compactTable(['链路', '状态', '依据', '标记'], rows, '暂无状态摘要', 'ik-home-evidence-table'),
        'data-overview-state-summary',
        'ik-home-state-summary'
      );
    }

    function overviewMatrixCell(label, value, note = '', level = '', valueHtml = null) {
      const toneClass = level ? ` is-${escapeHtml(level)}` : '';
      const renderedValue = valueHtml !== null && valueHtml !== undefined
        ? valueHtml
        : escapeHtml(String(value ?? '-'));
      const noteHtml = note ? `<div class="ik-home-mini-note">${escapeHtml(note)}</div>` : '';
      const routeAttr = label === '默认路由' ? ' data-overview-default-route-row' : '';
      const wanAttr = label === 'WAN' ? ' data-overview-wan-detail-row' : '';
      return `<div class="ik-home-mini-cell${toneClass}"${routeAttr}${wanAttr}><span>${escapeHtml(label || '')}</span><b>${renderedValue}</b>${noteHtml}</div>`;
    }

    function overviewEvidenceMatrix(rows = [], columns = 4, extraClass = '') {
      const safeColumns = Math.max(1, Number(columns) || 4);
      const className = extraClass ? ` ${extraClass}` : '';
      return `<div class="ik-home-evidence ik-home-evidence-list ik-home-evidence-matrix${className}" data-overview-evidence-matrix>
        ${(rows || []).map((row) => {
          const safeRow = Array.isArray(row) ? row : [];
          const rowColumns = Math.max(safeColumns, safeRow.length || safeColumns);
          return `<div class="ik-home-evidence-row" data-overview-field style="grid-template-columns:repeat(${rowColumns},minmax(0,1fr));">
            ${safeRow.map((cell) => overviewMatrixCell(
              cell.label,
              cell.value,
              cell.note || '',
              cell.level || '',
              cell.html ?? null
            )).join('')}
          </div>`;
        }).join('')}
      </div>`;
    }

    function latestCollectionSuccessTime(ctx) {
      const meta = ctx.snapshot?.meta || {};
      return meta.realtimeUpdatedAt ||
        meta.slowRestUpdatedAt ||
        meta.staticUpdatedAt ||
        meta.connectionDetailUpdatedAt ||
        meta.connectionProtocolUpdatedAt ||
        ctx.snapshot?.updatedAt ||
        ctx.freshness?.source ||
        '未采集';
    }

    function overviewDesktopFocus(ctx) {
      const history = isHistorySnapshot(ctx.freshness);
      const collection = collectionDisplayState(ctx, ctx.verdict?.collection || overviewCollectionTrust(ctx));
      const channelLabels = overviewCollectionChannelLabels(ctx, collection);
      const restLabel = channelLabels.restLabel;
      const sshLabel = channelLabels.sshLabel;
      const throughput = ctx.verdict?.topKey === 'no-snapshot'
        ? '不可判定'
        : fmtRate(Number(ctx.wanRates.up || 0) + Number(ctx.wanRates.down || 0));
      const routeSummary = overviewRouteSummary(ctx);
      const routeText = history || ctx.freshness?.stale
        ? routeSummary
        : (ctx.routeHealth.text || ctx.routeHealth.label || '-');
      const wanRouteText = ctx.wanHealth.total > 0 && ctx.wanHealth.online === 0
        ? '不可用'
        : routeText;
      const freshnessText = ctx.freshness.source ? (ctx.freshness.text || '-') : '未采集';
      const verdictKey = ctx.verdict?.topKey || 'ok';
      const key = overviewFocusKeyForVerdict(verdictKey);
      const verdictLabel = ctx.verdict?.topLabel || '';
      const historyTitle = history && verdictLabel.startsWith('历史快照') ? verdictLabel : '';
      const tone = key === 'resource-full'
        ? (ctx.resourceLevel === 'danger' ? 'danger' : 'warn')
        : key === 'collection-down'
          ? (ctx.snapshot.status !== 'ok' || ctx.routerState.level === 'danger' ? 'danger' : 'warn')
          : overviewIsWanIncidentKey(key)
            ? (ctx.wanHealth.level === 'danger' ? 'danger' : 'warn')
            : key === 'interfaces-down' || key === 'route-danger'
              ? 'danger'
            : key === 'no-snapshot' || key === 'stale-yellow'
              ? 'warn'
              : (history ? 'trust' : 'ok');
      const offlineRows = (ctx.offlineWanRows || []).slice(0, 3).map((row) => row.name || row.interface || '').filter(Boolean);
      const latestSuccess = latestCollectionSuccessTime(ctx);
      const resourceWorst = ctx.resourceEvidence?.worst || null;
      const resourceEvidence = ctx.resourceEvidence || {};
      const resourcePeakCpu = Math.max(Number(ctx.o.cpuLoad || 0), ...(ctx.history.cpu || []).map((value) => Number(value || 0)));
      const resourcePeakMemory = Math.max(Number(ctx.o.memoryUsage || 0), ...(ctx.history.memory || []).map((value) => Number(value || 0)));
      const resourceWorstLabel = resourceWorst ? `${resourceWorst.key} ${fmtPercent(resourceWorst.value)}` : `CPU ${fmtPercent(ctx.o.cpuLoad)}`;
      const resourceWorstNote = resourceWorst
        ? `当前 ${fmtPercent(resourceWorst.value)} · 阈值 ${resourceWorst.stats.thresholdText || '-'} · 持续 ${resourceWorst.stats.durationText || '-'} · 均值 ${resourceWorst.stats.averageWindowText || '-'} · 峰值 ${resourceWorst.stats.peak === null ? '-' : fmtPercent(resourceWorst.stats.peak)}`
        : `当前 ${fmtPercent(ctx.o.cpuLoad)} · 阈值 ${ctx.resourceEvidence?.worst?.stats?.thresholdText || '阈值'} · 持续 ${ctx.resourceEvidence?.worst?.stats?.durationText || '0s'} · 均值 ${ctx.resourceEvidence?.worst?.stats?.averageWindowText || '-'} · 峰值 ${fmtPercent(resourcePeakCpu)}`;
      const collectionChannelState = collection.channelStateText || `REST ${restLabel} / SSH ${sshLabel}`;
      const collectionDataState = shortTimestampText(collection.dataStateText || collection.dataText || latestSuccess);
      let headline = historyTitle;
      if (!headline) {
        if (key === 'resource-full') {
          headline = '资源满载';
        } else if (key === 'collection-down') {
          headline = '通道异常';
        } else if (key === 'no-snapshot') {
          headline = '快照缺失';
        } else if (key === 'wan-offline-all') {
          headline = 'WAN 全离线';
        } else if (key === 'wan-offline') {
          headline = 'WAN 部分离线';
        } else if (key === 'interfaces-down') {
          headline = '接口转发面异常';
        } else if (key === 'route-danger') {
          headline = '默认路由异常';
        } else if (key === 'stale-yellow') {
          headline = history ? historyCurrentUnknownTitle() : '数据陈旧';
        } else {
          headline = history ? historyCurrentUnknownTitle() : '当前正常';
        }
      }

      const subline = key === 'resource-full'
        ? resourceWorstNote
        : key === 'collection-down'
          ? `通道 ${collectionChannelState} · 数据层 ${collectionDataState}`
          : key === 'no-snapshot'
            ? noSnapshotStatusLine(ctx.snapshot, ctx.freshness)
            : overviewIsWanIncidentKey(key)
              ? `${fmtNumber(ctx.wanHealth.offline)}/${fmtNumber(ctx.wanHealth.total)} WAN 离线 · 默认路由 ${wanRouteText}`
              : key === 'interfaces-down'
                ? `接口状态 ${ctx.snapshot.error || '异常'} · ${mobileChannelPair(restLabel, sshLabel)}`
              : key === 'route-danger'
                ? routeText
              : key === 'stale-yellow'
                ? (history
                  ? `历史快照 · 业务快照年龄 ${freshnessText}`
                  : `WAN 线路 ${fmtNumber(ctx.wanHealth.online)}/${fmtNumber(ctx.wanHealth.total)} / 业务快照 ${freshnessText}`)
                : `${routeText} / ${throughput}`;
      const summaryEvidence = key === 'resource-full'
        ? (resourceEvidence.summary || resourceWorstLabel)
        : key === 'collection-down'
          ? `${collectionChannelState} / ${collectionDataState}`
        : key === 'no-snapshot'
            ? '采集链路 / 默认路由待判定'
            : overviewIsWanIncidentKey(key)
              ? '离线数量 / 默认路由 / 离线对象'
              : key === 'interfaces-down'
                ? '接口状态 / 采集通道'
              : key === 'route-danger'
                ? '默认路由 / 路由表快照'
              : key === 'stale-yellow'
                ? (history
                  ? `缓存快照 · 业务快照年龄 ${freshnessText}`
                  : `数据年龄 ${freshnessText} / ${routeSummary}`)
                : `${routeSummary} / ${throughput}`;
      const summaryNote = key === 'resource-full'
        ? resourceWorstNote
        : key === 'collection-down'
          ? `最后成功采集 ${shortTimestamp(latestSuccess)}`
        : key === 'no-snapshot'
            ? `状态更新时间 ${noSnapshotUpdateAgeText(ctx.snapshot, ctx.freshness)} / 失败端点未记录 / 只读边界`
            : overviewIsWanIncidentKey(key)
              ? (offlineRows.length ? `离线对象 ${offlineRows.join(' / ')}` : '离线线路未列出')
              : key === 'interfaces-down' || key === 'route-danger'
                ? routeSummary
              : key === 'stale-yellow'
                ? (history ? `业务快照年龄 ${freshnessText}` : `${restLabel} / ${sshLabel}`)
                : `REST ${restLabel} / SSH ${sshLabel}`;
      const detailTitle = key === 'resource-full'
        ? (historyTitle || '资源阈值')
        : key === 'collection-down'
          ? '采集通道'
        : key === 'no-snapshot'
            ? '采集证据'
            : overviewIsWanIncidentKey(key)
              ? 'WAN线路'
              : key === 'interfaces-down'
                ? '接口转发面'
              : key === 'route-danger'
                ? '路由快照'
              : key === 'stale-yellow' && history
                ? '历史快照'
              : '路由摘要';
      const detailSub = key === 'resource-full'
        ? resourceWorstNote
        : key === 'collection-down'
          ? (collection.summaryText || collection.text)
        : key === 'no-snapshot'
            ? '默认路由待判定 / 只读边界 / 失败端点未记录'
            : overviewIsWanIncidentKey(key)
              ? (offlineRows.length ? `离线对象 ${offlineRows.join(' / ')}` : routeSummary)
              : key === 'interfaces-down' || key === 'route-danger'
                ? routeSummary
              : key === 'stale-yellow' && history
                ? `业务快照年龄 ${freshnessText}`
              : `默认路由 / ${throughput}`;
      return {
        key,
        tone,
        headline,
        subline,
        summaryEvidence,
        summaryNote,
        detailTitle,
        detailSub,
        restLabel,
        sshLabel,
        throughput,
        routeSummary,
        routeText,
        freshnessText,
        offlineRows,
        latestSuccess,
        resourceWorst,
        resourcePeakCpu,
        resourcePeakMemory
      };
    }

    function overviewNoSnapshotEvidenceItems(ctx, focus = overviewDesktopFocus(ctx)) {
      const collection = collectionDisplayState(ctx, ctx.verdict?.collection || overviewCollectionTrust(ctx));
      const labels = overviewCollectionChannelLabels(ctx, collection);
      const latestSuccess = latestCollectionSuccessTime(ctx);
      const latestSuccessShort = shortTimestamp(latestSuccess);
      const nextCollection = ctx.pollText || '未采集';
      const statusUpdateText = noSnapshotUpdateAgeText(ctx.snapshot, ctx.freshness);
      const channelStateText = overviewChannelPair(labels.restLabel, labels.sshLabel);
      const failures = ctx.failures || {};
      const failureEntries = endpointFailureEntries(ctx.snapshot.meta || {});
      const firstFailure = failureEntries[0] || null;
      const restFailure = failureEntries.find((row) => /rest|api|http|实时|慢速|静态|明细/i.test(`${row.group} ${row.name}`)) || firstFailure;
      const sshFailure = failureEntries.find((row) => /ssh/i.test(`${row.group} ${row.name} ${row.message}`)) || null;
      const routerUnavailableText = ctx.routerState?.label === '等待登录' ? '等待登录' : '当前不可达';
      const routerLevel = ctx.routerState?.level || 'danger';
      const channelLevel = (label) => (/可用|正常|已验证|上次可用/.test(String(label || '')) ? 'trust' : 'warn');
      const failureCount = failures.count ? fmtNumber(failures.count) : '未记录';
      const failureText = failures.count ? failures.text : '未记录';
      return [
        { label: '设备通达性', mainText: routerUnavailableText, subText: `状态更新时间 ${statusUpdateText}`, level: routerLevel },
        { label: 'REST', mainText: labels.restLabel || 'REST 待确认', subText: restFailure?.message || '未记录 REST 端点失败', level: restFailure ? 'warn' : channelLevel(labels.restLabel) },
        { label: 'SSH', mainText: 'SSH 缺依赖', subText: sshFailure?.message || 'SSH 通道缺依赖', level: sshFailure ? 'warn' : channelLevel(labels.sshLabel) },
        { label: '默认路由', mainText: overviewRouteDisplay(ctx).label || '不可判定', subText: overviewRouteDisplay(ctx).text || focus.routeSummary || '默认路由不可判定', level: overviewRouteDisplay(ctx).level || 'warn' },
        { label: '最后成功采集', mainHtml: `<span title="${escapeHtml(latestSuccess)}">${escapeHtml(latestSuccessShort)}</span>`, subText: '上次成功采集', level: 'trust' },
        { label: '失败端点', mainText: failureCount, subText: failureText, level: failures.count ? 'warn' : 'trust' },
        { label: '业务边界', mainText: '只读展示', subText: 'WAN / 路由 / 资源 / 终端不展示业务数值', level: 'warn' },
        { label: '业务快照', mainText: '无', subText: '无业务快照，业务数据不展示', level: 'warn' },
        { label: '下次尝试', mainText: nextCollection, subText: '轮询中，不承诺可达', level: 'trust' }
      ];
    }

    function renderOverviewNoSnapshotBoundaryDegradePanel(ctx) {
      const routerValue = ctx.routerState?.label === '等待登录' ? '等待登录' : '当前不可达';
      const failureValue = ctx.failures.count ? fmtNumber(ctx.failures.count) : '未记录';
      const disabledModules = 'WAN / 路由 / 资源 / 终端 / 速率 / 连接';
      const rows = [
        `<tr data-overview-field><td>只读</td><td><b>不写配置</b></td><td>不推断、不修复、不下发</td></tr>`,
        `<tr data-overview-field><td>展示范围</td><td><b>采集链路</b></td><td>RouterOS / REST / SSH / 最近成功</td></tr>`,
        `<tr data-overview-field><td>可信等级</td><td><b>链路可参考</b></td><td>业务状态不可参考</td></tr>`,
        `<tr data-overview-field><td>业务数据</td><td><b>不展示</b></td><td>无业务快照，业务数据不展示</td></tr>`,
        `<tr data-overview-field><td>禁用模块</td><td><b>${escapeHtml(disabledModules)}</b></td><td>禁止用零速率或空表占位</td></tr>`,
        `<tr data-overview-field><td>默认路由</td><td><b>不可判定</b></td><td>缺少当前路由快照</td></tr>`,
        `<tr data-overview-field><td>失败端点</td><td><b>${escapeHtml(failureValue)}</b></td><td>${escapeHtml(ctx.failures.count ? ctx.failures.text : '未记录')}</td></tr>`,
        `<tr data-overview-field><td>当前状态</td><td><b>${escapeHtml(routerValue)}</b></td><td>RouterOS 当前不可达</td></tr>`,
        `<tr data-overview-field><td>最后成功</td><td><b>${escapeHtml(shortTimestamp(latestCollectionSuccessTime(ctx)))}</b></td><td>上次成功采集</td></tr>`,
        `<tr data-overview-field><td>快照来源</td><td><b>采集元数据</b></td><td>最近成功快照摘要</td></tr>`,
        `<tr data-overview-field><td>可展示范围</td><td><b>采集链路</b></td><td>端点 / 时间 / 只读边界</td></tr>`,
        `<tr data-overview-field><td>已禁用</td><td><b>业务模块</b></td><td>WAN / 路由 / 资源 / 终端 / 速率 / 连接</td></tr>`,
        `<tr data-overview-field><td>下次尝试</td><td><b>${escapeHtml(ctx.pollText || '未采集')}</b></td><td>轮询中，不承诺可达</td></tr>`
      ];
      return overviewFlatModule(
        'no-snapshot-boundary-degrade',
        '只读边界 + 降级模块',
        '权限边界 / 降级模块 / 下次尝试',
        compactTable(['条目', '当前', '说明'], rows, '缺少业务快照', 'ik-home-evidence-table')
      );
    }

    function overviewWanOfflineEvidenceItems(ctx, focus = overviewDesktopFocus(ctx)) {
      const collection = ctx.verdict?.collection || overviewCollectionTrust(ctx);
      const labels = overviewCollectionChannelLabels(ctx, collection);
      const channelStateText = collection.channelStateText || `REST ${labels.restLabel} / SSH ${labels.sshLabel}`;
      const offlineNames = (ctx.offlineWanRows || [])
        .slice(0, 3)
        .map((row) => row.name || row.interface || '')
        .filter(Boolean);
      const latestSuccess = latestCollectionSuccessTime(ctx);
      const routeDisplay = overviewRouteDisplay(ctx);
      const routeAvailable = ctx.wanHealth.total > 0 && ctx.wanHealth.online === 0
        ? '不可用'
        : (routeDisplay.label || routeDisplay.text || '未判定');
      const routerLabel = ctx.routerState?.label || (ctx.snapshot.status === 'ok' ? 'REST 已验证' : '未确认');
      const routerLevel = ctx.routerState?.level || (ctx.snapshot.status === 'ok' ? 'ok' : 'warn');
      return [
        { label: '离线数量', mainText: `${fmtNumber(ctx.wanHealth.offline)}/${fmtNumber(ctx.wanHealth.total)}`, subText: ctx.wanHealth.text || 'WAN 全离线', level: ctx.wanHealth.level === 'danger' ? 'danger' : 'warn' },
        { label: '默认路由', mainText: routeAvailable, subText: routeAvailable === '不可用' ? 'WAN 全离线' : focus.routeSummary, level: routeAvailable === '不可用' ? 'danger' : routeDisplay.level },
        { label: 'WAN 线路对象', mainHtml: overviewAnomalyObjectHtml(offlineNames), subText: offlineNames.length ? '优先检查这些对象' : '暂无对象名称', level: 'warn' },
        { label: 'RouterOS', mainText: routerLabel, subText: channelStateText, level: routerLevel },
        { label: 'REST', mainText: labels.restLabel, subText: channelStateText, level: 'warn' },
        { label: 'SSH', mainText: labels.sshLabel, subText: channelStateText, level: 'warn' },
        { label: '最近成功', mainHtml: `<span title="${escapeHtml(latestSuccess)}">${escapeHtml(shortTimestamp(latestSuccess))}</span>`, subText: '上次成功采集', level: 'trust' },
        { label: '下次尝试', mainText: ctx.pollText || '未采集', subText: '轮询中', level: 'trust' }
      ];
    }

    function overviewInterfaceForwardingEvidenceItems(ctx, focus = overviewDesktopFocus(ctx)) {
      const interfaces = Array.isArray(ctx.snapshot.interfaces) ? ctx.snapshot.interfaces : [];
      const downRows = interfaces.filter((row) => row && row.running === false);
      const involved = downRows.slice(0, 4).map((row) => row.name).filter(Boolean);
      const collection = ctx.verdict?.collection || overviewCollectionTrust(ctx);
      const labels = overviewCollectionChannelLabels(ctx, collection);
      const routeDisplay = overviewRouteDisplay(ctx);
      const impact = overviewInterfaceImpactParts(ctx, downRows);
      return [
        { label: '接口转发面', mainText: `down ${fmtNumber(downRows.length || ctx.wanHealth.offline || 0)}`, subText: involved.length ? `涉及接口 ${involved.join(' / ')}` : '涉及接口未列出', level: 'danger' },
        { label: 'parent', mainText: impact.parent, subText: '父接口影响面', level: 'warn' },
        { label: 'bridge', mainText: impact.bridge, subText: '二层承载关系', level: 'warn' },
        { label: 'vlan', mainText: impact.vlan, subText: 'VLAN 影响面', level: 'warn' },
        { label: 'pppoe-out', mainText: impact.pppoeOut, subText: 'PPPoE 出口关系', level: 'warn' },
        { label: '默认路由影响', mainText: routeDisplay.label || '不可判定', subText: routeDisplay.text || focus.routeSummary || '接口 Down，默认路由影响待判定', level: 'warn' },
        { label: 'REST SSH 可达性', mainText: mobileChannelPair(labels.restLabel, labels.sshLabel), subText: '采集通道能力，不替代转发面判断', level: 'warn' },
        { label: '业务快照', mainText: snapshotBusinessAgeText(ctx.snapshot, ctx.freshness), subText: shortTimestampText(snapshotBusinessTimeText(ctx.snapshot, ctx.freshness)), level: ctx.freshness?.stale ? 'warn' : 'trust' }
      ];
    }

    function overviewResourceFullEvidenceItems(ctx, focus = overviewDesktopFocus(ctx)) {
      const resource = ctx.resourceEvidence || {};
      const cpu = resource.cpu || {};
      const memory = resource.memory || {};
      const disk = resource.disk || {};
      const peakCpu = Math.max(Number(ctx.o.cpuLoad || 0), ...(ctx.history.cpu || []).map((value) => Number(value || 0)));
      const peakMemory = Math.max(Number(ctx.o.memoryUsage || 0), ...(ctx.history.memory || []).map((value) => Number(value || 0)));
      const peakDisk = Math.max(Number(ctx.o.diskUsage || 0), ...(ctx.history.disk || []).map((value) => Number(value || 0)));
      const resourceNote = (currentValue = '-', stats = {}, peakValue = '-') => `当前 ${currentValue} · 阈值 ${stats.thresholdText || '-'} · 持续 ${stats.durationText || '-'} · 均值 ${stats.averageWindowText || '-'} · 峰值 ${peakValue}`;
      const routeDisplay = overviewRouteDisplay(ctx);
      return [
        { label: 'CPU', mainText: fmtPercent(ctx.o.cpuLoad), subText: resourceNote(fmtPercent(ctx.o.cpuLoad), cpu, fmtPercent(peakCpu)), level: ctx.resourceLevel },
        { label: 'MEM', mainText: fmtPercent(ctx.o.memoryUsage), subText: resourceNote(fmtPercent(ctx.o.memoryUsage), memory, fmtPercent(peakMemory)), level: ctx.resourceLevel },
        { label: 'DISK', mainText: fmtPercent(ctx.o.diskUsage), subText: resourceNote(fmtPercent(ctx.o.diskUsage), disk, fmtPercent(peakDisk)), level: ctx.resourceLevel },
        { label: '连接', mainText: fmtCompact(ctx.connectionTotal), subText: `活动 ${fmtNumber(ctx.activeSessions)}`, noteText: `采样 ${fmtNumber(ctx.sampleCount)}`, level: 'warn' },
        { label: '会话', mainText: fmtNumber(ctx.activeSessions), subText: `WAN ${fmtNumber(ctx.wanHealth.online)}/${fmtNumber(ctx.wanHealth.total)}`, noteText: routeDisplay.label || routeDisplay.text || '-', level: 'warn' },
        { label: '采样点', mainText: fmtNumber(ctx.sampleCount), subText: ctx.pollText || '未采集', noteText: resource.summary || '', level: 'trust' }
      ];
    }

    function overviewResourceEvidenceItems(ctx, focus = overviewDesktopFocus(ctx)) {
      return overviewResourceFullEvidenceItems(ctx, focus);
    }

    function overviewCollectionDownEvidenceItems(ctx, focus = overviewDesktopFocus(ctx)) {
      const collection = collectionDisplayState(ctx, ctx.verdict?.collection || overviewCollectionTrust(ctx));
      const routeDisplay = overviewRouteDisplay(ctx);
      const latestSuccess = latestCollectionSuccessTime(ctx);
      const offlineNames = (ctx.offlineWanRows || [])
        .slice(0, 3)
        .map((row) => row.name || row.interface || '')
        .filter(Boolean);
      return [
        { label: '通道状态', mainText: collection.channelText || `REST ${collection.restLabel} / SSH ${collection.sshLabel}`, subText: collection.summaryText || collection.label || '通道降级', level: collection.level },
        { label: '数据层状态', mainText: shortTimestampText(collection.dataStateText || collection.dataText || (collection.dataStale ? '陈旧' : '可用')), subText: shortTimestamp(latestSuccess), level: collection.dataStale || collection.channelDegraded ? 'warn' : 'trust' },
        ...(offlineNames.length ? [{ label: '离线对象', mainHtml: overviewAnomalyObjectHtml(offlineNames), subText: 'WAN / 接口转发面证据', level: 'warn' }] : []),
        { label: '失败端点', mainText: ctx.failures.count ? fmtNumber(ctx.failures.count) : '未记录', subText: ctx.failures.count ? ctx.failures.text : (collection.channelDegraded ? '未记录端点失败 · 通道不可用' : '未记录端点失败'), level: ctx.failures.count || collection.channelDegraded ? 'warn' : 'trust' },
        { label: '最近成功', mainHtml: `<span title="${escapeHtml(latestSuccess)}">${escapeHtml(shortTimestamp(latestSuccess))}</span>`, subText: '留存时间', level: 'trust' },
        { label: '下次尝试', mainText: ctx.pollText || '未采集', subText: '轮询中', level: 'trust' },
        { label: '默认路由', mainText: routeDisplay.label || routeDisplay.text || '-', subText: focus.routeSummary, level: routeDisplay.level }
      ];
    }

    function overviewCollectionEvidenceItems(ctx, focus = overviewDesktopFocus(ctx)) {
      return overviewCollectionDownEvidenceItems(ctx, focus);
    }

    function overviewInterfaceImpactParts(ctx, downRows = null) {
      const interfaces = Array.isArray(ctx.snapshot.interfaces) ? ctx.snapshot.interfaces : [];
      const rows = downRows || interfaces.filter((row) => row && row.running === false);
      const downNames = new Set(rows.map((row) => row.name).filter(Boolean));
      const parents = rows.map((row) => row.parent || row.master || row.name || '').filter(Boolean);
      const bridges = interfaces
        .filter((row) => /bridge/i.test(`${row.type || ''} ${row.name || ''} ${row.bridge || ''}`) || downNames.has(row.bridge))
        .map((row) => row.bridge || row.name)
        .filter(Boolean);
      const vlans = interfaces
        .filter((row) => /vlan/i.test(`${row.type || ''} ${row.name || ''}`) || row.vlanId || row.vlan)
        .map((row) => row.name || row.vlan || row.vlanId)
        .filter(Boolean);
      const pppoeOut = (ctx.pppoe || [])
        .filter((row) => !row.running || downNames.has(row.parent) || downNames.has(row.name))
        .map((row) => row.name || row.interface)
        .filter(Boolean);
      return {
        parent: compactListText([...new Set(parents)], 4) || '未采集',
        bridge: compactListText([...new Set(bridges)], 4) || '未采集',
        vlan: compactListText([...new Set(vlans)], 4) || '未采集',
        pppoeOut: compactListText([...new Set(pppoeOut)], 4) || '未采集'
      };
    }

    function overviewNormalEvidenceItems(ctx, focus = overviewDesktopFocus(ctx)) {
      const collection = collectionDisplayState(ctx, ctx.verdict?.collection || overviewCollectionTrust(ctx));
      const routeDisplay = overviewRouteDisplay(ctx);
      const dataAge = snapshotBusinessAgeText(ctx.snapshot, ctx.freshness);
      const history = isHistorySnapshot(ctx.freshness);
      const channelText = collection.channelText || `REST ${collection.restLabel} / SSH ${collection.sshLabel}`;
      const dataText = shortTimestampText(collection.dataStateText || collection.dataText || latestCollectionSuccessTime(ctx));
      if (history) {
        const offlineNames = (ctx.offlineWanRows || [])
          .slice(0, 3)
          .map((row) => row.name || row.interface || '')
          .filter(Boolean);
        return [
          { label: 'WAN', mainText: `${fmtNumber(ctx.wanHealth.online)}/${fmtNumber(ctx.wanHealth.total)}`, subText: ctx.wanHealth.label || '在线/总数', level: ctx.wanHealth.level },
          { label: '默认路由', mainText: routeDisplay.label || routeDisplay.text || '-', subText: focus.routeSummary, level: routeDisplay.level },
          ...(offlineNames.length ? [{ label: '离线对象', mainHtml: overviewAnomalyObjectHtml(offlineNames), subText: '历史快照 WAN 曾离线', level: 'warn' }] : []),
          { label: '状态', mainText: historyCurrentUnknownTitle(), subText: `业务快照年龄 ${dataAge}`, level: 'trust' },
          { label: '通道状态', mainText: channelText, subText: collection.summaryText || '历史留存', level: 'trust' },
          { label: '数据层状态', mainText: dataText, subText: shortTimestamp(ctx.freshness.source || '未采集'), level: 'trust' },
          { label: '最近成功', mainText: shortTimestamp(latestCollectionSuccessTime(ctx)), subText: '上次成功采集', level: 'ok' },
          { label: '下次尝试', mainText: ctx.pollText || '未采集', subText: '轮询中', level: 'ok' }
        ];
      }
      return [
        { label: 'WAN', mainText: `${fmtNumber(ctx.wanHealth.online)}/${fmtNumber(ctx.wanHealth.total)}`, subText: ctx.wanHealth.label || '在线/总数', level: ctx.wanHealth.level },
        { label: '默认路由', mainText: routeDisplay.label || routeDisplay.text || '-', subText: focus.routeSummary, level: routeDisplay.level },
        { label: '通道状态', mainText: channelText, subText: collection.summaryText || '采集可用', level: collection.channelDegraded ? 'warn' : 'trust' },
        { label: '数据层状态', mainText: dataText, subText: dataAge, level: collection.dataStale ? 'warn' : 'trust' },
        { label: '下次尝试', mainText: ctx.pollText || '未采集', subText: '轮询中', level: 'ok' }
      ];
    }

    function renderOfflineWanEvidence(ctx) {
      const history = isHistorySnapshot(ctx.freshness);
      const rows = (ctx.offlineWanRows || []).slice(0, 3);
      if (!rows.length) {
        return `<div class="ik-home-evidence-empty" data-overview-anomaly-evidence data-overview-field>WAN 离线清单：${history ? historySnapshotTitle('WAN', '未见离线线路') : '当前未见离线线路'}</div>`;
      }
      return `<div class="ik-home-evidence-list" data-overview-anomaly-evidence>
        <div class="ik-home-evidence-row is-head" data-overview-field style="grid-template-columns:minmax(88px,1fr) 58px 76px 76px minmax(96px,1fr) 68px; padding:3px 4px; line-height:1.05;"><span>对象</span><span>状态</span><span>采样</span><span>父</span><span>默认</span><span>速率</span></div>
        ${rows.map((row) => {
          const activeRoute = (row.routes || []).find((route) => route.active && !route.disabled) || null;
          const routeText = activeRoute
            ? `${activeRoute.gateway || activeRoute.gatewayStatus || '-'} d${activeRoute.distance ?? '-'}`
            : '未承载默认路由';
          const rateText = fmtRate(totalTrafficRate(row));
          return `<div class="ik-home-evidence-row is-offline" data-overview-anomaly-object="${escapeHtml(row.name || '')}" data-overview-field style="grid-template-columns:minmax(88px,1fr) 58px 76px 76px minmax(96px,1fr) 68px; padding:3px 4px; line-height:1.05;">
          <b>${escapeHtml(row.name || row.interface || 'unknown')}</b>
          <span>${history ? historySnapshotTitle('WAN', '离线') : '离线'}</span>
          <span>${escapeHtml(ctx.freshness.source || '-')}</span>
          <span>${escapeHtml(row.parent || row.interface || '-')}</span>
          <span>${escapeHtml(routeText)}</span>
          <span>${escapeHtml(rateText)}</span>
        </div>`;
        }).join('')}
      </div>`;
    }

    function renderDefaultRouteSnapshot(ctx) {
      const history = isHistorySnapshot(ctx.freshness);
      const routeHealth = ctx.routeHealth || {};
      const routes = (ctx.snapshot.routes?.defaultRoutes || [])
        .slice()
        .sort((a, b) => Number(a.distance || 0) - Number(b.distance || 0))
        .slice(0, 4);
      if (!routes.length) {
        if (routeHealth.state === 'unavailable' || snapshotIsUnavailable(ctx.snapshot)) {
          return `<div class="ik-home-evidence-empty" data-overview-default-routes data-overview-field>默认路由不可判定</div>`;
        }
        if (routeHealth.state === 'inactive') {
          return `<div class="ik-home-evidence-empty" data-overview-default-routes data-overview-field>未发现活动默认路由</div>`;
        }
        return `<div class="ik-home-evidence-empty" data-overview-default-routes data-overview-field>默认路由：未采集到路由表快照</div>`;
      }
      const rows = routes.map((route) => {
        const active = route.active && !route.disabled;
        return `<div class="ik-home-evidence-row${active ? ' is-ok' : ' is-warn'}" data-overview-field data-overview-default-route-row style="grid-template-columns:minmax(72px,.82fr) minmax(96px,1.16fr) 58px 58px 64px; padding:3px 4px; line-height:1.05;">
          <b>${escapeHtml(route.table || route.routingTable || 'main')}</b>
          <span>${escapeHtml(route.gateway || route.gatewayStatus || '-')}</span>
          <span>${escapeHtml(String(route.distance ?? '-'))}</span>
          <span>${escapeHtml(route.active ? 'true' : 'false')}</span>
          <span>${escapeHtml(route.disabled ? 'true' : 'false')}</span>
        </div>`;
      }).join('');
      return `<div class="ik-home-evidence-list" data-overview-default-routes>
        <div class="ik-home-evidence-row is-head" data-overview-field style="grid-template-columns:minmax(72px,.82fr) minmax(96px,1.16fr) 58px 58px 64px; padding:3px 4px; line-height:1.05;"><span>table</span><span>gateway</span><span>distance</span><span>active</span><span>disabled</span></div>
        ${rows}
      </div>`;
    }

    function defaultRouteRawSummary(ctx) {
      const routes = (ctx.snapshot.routes?.defaultRoutes || [])
        .slice()
        .sort((a, b) => Number(a.distance || 0) - Number(b.distance || 0));
      const primary = routes.find((route) => route.active && !route.disabled) || routes[0] || null;
      if (!primary) return '';
      return `table ${primary.table || primary.routingTable || 'main'} / gateway ${primary.gateway || primary.gatewayStatus || '-'} / distance ${primary.distance ?? '-'} / active ${primary.active ? 'true' : 'false'} / disabled ${primary.disabled ? 'true' : 'false'}`;
    }

    function renderWanMiniTable(ctx) {
      const history = isHistorySnapshot(ctx.freshness);
      const sortedRows = (ctx.pppoe || [])
        .slice()
        .sort((a, b) => {
          if (Boolean(a.running) !== Boolean(b.running)) return a.running ? 1 : -1;
          return totalTrafficRate(b) - totalTrafficRate(a);
        });
      const hiddenCount = Math.max(0, sortedRows.length - 8);
      const rows = sortedRows
        .slice(0, 8)
        .map((row) => {
          const activeRoute = (row.routes || []).find((route) => route.active && !route.disabled) || null;
          const routeText = activeRoute
            ? `${history ? '历史留存 ' : ''}${activeRoute.gateway || activeRoute.gatewayStatus || '-'} / ${activeRoute.distance ?? '-'}`
            : (row.running ? '未关联' : '离线');
          return `<div class="ik-home-evidence-row${row.running ? '' : ' is-offline'}" data-overview-field data-overview-wan-detail-row style="grid-template-columns:minmax(88px,1fr) 56px 72px 62px minmax(102px,1.15fr) 62px 62px 78px; padding:3px 4px; line-height:1.05;">
          <b data-overview-anomaly-object="${row.running ? '' : escapeHtml(row.name || row.interface || '')}">${escapeHtml(row.name || row.interface || '-')}</b>
          <span>${escapeHtml(row.access || row.kind || 'Unknown')}</span>
          <span>${escapeHtml(row.parent || '-')}</span>
          <span>${row.running ? (history ? '上次在线' : '在线') : tag(history ? historySnapshotTitle('WAN', '离线') : '离线', 'danger')}</span>
          <span>${escapeHtml(routeText)}</span>
          <span>${fmtRate(Number(row.upRate || 0))}</span>
          <span>${fmtRate(Number(row.downRate || 0))}</span>
          <span>${escapeHtml(ctx.freshness.source || '-')}</span>
        </div>`;
        }).join('');
      return `<div class="ik-home-evidence-list" data-overview-wan-mini-table>
        <div class="ik-home-evidence-row is-head" data-overview-field style="grid-template-columns:minmax(88px,1fr) 56px 72px 62px minmax(102px,1.15fr) 62px 62px 78px; padding:3px 4px; line-height:1.05;"><span>线路</span><span>接入</span><span>父</span><span>状态</span><span>默认路由</span><span>上</span><span>下</span><span>采样</span></div>
        ${rows || `<div class="ik-home-evidence-row" data-overview-field style="grid-template-columns:1fr; padding:3px 4px; line-height:1.05;"><span>未采集到 WAN 线路</span></div>`}
        ${hiddenCount ? `<div class="ik-home-evidence-row is-head" data-overview-field style="grid-template-columns:1fr; padding:3px 4px; line-height:1.05;"><span>更多 ${fmtNumber(hiddenCount)} 条 WAN 线路在接口页查看</span></div>` : ''}
      </div>`;
    }

    function renderOverviewFreshnessCompact(ctx) {
      const collection = ctx.verdict?.collection || overviewCollectionTrust(ctx);
      const labels = overviewCollectionChannelLabels(ctx, collection);
      if (ctx.verdict?.topKey === 'no-snapshot') {
        const items = overviewNoSnapshotEvidenceItems(ctx, {});
        return `<div class="ik-home-evidence-grid is-no-snapshot-grid" data-overview-no-snapshot-grid style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;min-width:0;align-items:stretch;">${items.map((item) => overviewCompactBox(
          item.label,
          item.mainHtml ?? escapeHtml(item.mainText || '-'),
          item.subText || '',
          item.level || '',
          item.noteText || ''
        )).join('')}</div>`;
      }
      const trustLabel = isHistorySnapshot(ctx.freshness) ? '快照模式' : ctx.freshness.label;
      const items = [
        ['可信等级', trustLabel],
        ['业务快照时间', shortTimestampText(snapshotBusinessTimeText(ctx.snapshot, ctx.freshness))],
        ['业务快照年龄', snapshotBusinessAgeText(ctx.snapshot, ctx.freshness)],
        ['REST 状态', `REST ${labels.restLabel}`],
        ['SSH 状态', `SSH ${labels.sshLabel}`],
        ['轮询间隔', ctx.pollText],
        ['失败端点', ctx.failures.count ? ctx.failures.text : '未记录端点失败']
      ];
      return `<div class="freshness-strip">${items.map(([label, value]) => `
        <div class="freshness-item" data-overview-field><span>${escapeHtml(label)}</span><b>${escapeHtml(value)}</b></div>`).join('')}</div>`;
    }

    function renderOverviewSessionSnapshot(ctx) {
      const noSnapshot = ctx.verdict?.topKey === 'no-snapshot' || snapshotIsUnavailable(ctx.snapshot);
      if (noSnapshot) {
        const boxes = [
          ['在线终端', '不可判定'],
          ['有流量终端', '不可判定'],
          ['待机终端', '不可判定'],
          ['离线终端', '不可判定'],
          ['PPP 活动会话', '不可判定'],
          ['连接跟踪', '不可判定'],
          ['最忙终端', '未采集'],
          ['终端速率', '未采集']
        ];
        return `<div class="card ik-home-density-card" data-overview-density-module="session-snapshot">
          <div class="card-head"><div class="card-title">会话 / 终端概览</div><div class="subtle">快照缺失 · 数据可信度不可判定</div></div>
          <div class="card-body">
            <div class="ik-home-session-grid">
              ${boxes.map(([label, value]) => `<div class="ik-summary-box" data-overview-field><div class="subtle">${escapeHtml(label)}</div><b>${escapeHtml(value)}</b></div>`).join('')}
            </div>
          </div>
        </div>`;
      }
      const terminals = ctx.terminals || [];
      const connections = ctx.connections || {};
      const trafficTerminals = terminals.filter((row) => totalTrafficRate(row) > 0);
      const topTerminal = trafficTerminals
        .slice()
        .sort((a, b) => totalTrafficRate(b) - totalTrafficRate(a))[0] || null;
      const terminalOnline = Number(ctx.onlineTerminals || 0) || terminals.filter((row) => !['failed', 'incomplete'].includes(row.status)).length;
      const terminalStandby = terminals.filter((row) => ['stale', 'waiting'].includes(row.status)).length;
      const terminalOffline = terminals.filter((row) => ['failed', 'incomplete'].includes(row.status)).length;
      const activeSessions = Number(ctx.activeSessions || 0);
      const topName = topTerminal ? (topTerminal.displayName || topTerminal.hostname || topTerminal.ip || '-') : '-';
      const prefix = samplePrefix(ctx.freshness);
      const boxes = [
        ['在线终端', fmtNumber(terminalOnline)],
        ['有流量终端', fmtNumber(trafficTerminals.length)],
        ['待机终端', fmtNumber(terminalStandby)],
        ['离线终端', fmtNumber(terminalOffline)],
        ['PPP 活动会话', fmtNumber(activeSessions)],
        ['连接跟踪', fmtCompact(ctx.connectionTotal)],
        ['最忙终端', escapeHtml(topName)],
        ['终端速率', topTerminal ? fmtRate(totalTrafficRate(topTerminal)) : '-']
      ];
      return `<div class="card ik-home-density-card" data-overview-density-module="session-snapshot">
        <div class="card-head"><div class="card-title">会话 / 终端概览</div><div class="subtle">${escapeHtml(prefix)} · TCP ${fmtNumber(connections.tcp || 0)} / UDP ${fmtNumber(connections.udp || 0)}</div></div>
        <div class="card-body">
          <div class="ik-home-session-grid">
            ${boxes.map(([label, value]) => `<div class="ik-summary-box" data-overview-field><div class="subtle">${escapeHtml(label)}</div><b>${value}</b></div>`).join('')}
          </div>
        </div>
      </div>`;
    }

    function renderOverviewSignalCoverage(ctx) {
      const collection = ctx.verdict?.collection || overviewCollectionTrust(ctx);
      const noSnapshot = ctx.verdict?.topKey === 'no-snapshot' || snapshotIsUnavailable(ctx.snapshot);
      const fallbackLabels = historyAwareCapabilityLabels(ctx.capabilities, ctx.freshness);
      const labels = {
        restLabel: `REST ${stripChannelPrefix(collection.restLabel || fallbackLabels.restLabel, 'REST')}`,
        sshLabel: `SSH ${stripChannelPrefix(collection.sshLabel || fallbackLabels.sshLabel, 'SSH')}`
      };
      const interfaceCount = Array.isArray(ctx.snapshot.interfaces) ? ctx.snapshot.interfaces.length : 0;
      const terminalCount = Array.isArray(ctx.terminals) ? ctx.terminals.length : 0;
      const wanTypeCount = ['PPPoE', 'DHCP', 'VLAN', 'Static', 'Unknown']
        .filter((key) => ctx.accessBuckets[key]?.total)
        .length;
      const writeClosed = ctx.capabilities.routerosWrite || ctx.capabilities.localAliasWrite || ctx.capabilities.ipAliasWrite
        ? '开启'
        : '关闭';
      const rows = [
        ['REST', labels.restLabel, noSnapshot ? '待确认' : '通道'],
        ['SSH', labels.sshLabel, noSnapshot ? '待确认' : '通道'],
        ['默认路由', overviewRouteDisplay(ctx).label, noSnapshot ? '不可判定' : '状态'],
        ['失败端点', ctx.failures.count ? fmtNumber(ctx.failures.count) : '未记录', ctx.failures.count ? '异常' : '未记录'],
        ['WAN 类型', noSnapshot ? '不可判定' : (wanTypeCount ? fmtNumber(wanTypeCount) : '0'), noSnapshot ? '不可判定' : '接入类数'],
        ['接口数', noSnapshot ? '不可判定' : fmtNumber(interfaceCount), '对象'],
        ['终端数', noSnapshot ? '不可判定' : fmtNumber(terminalCount), '对象'],
        ['写入能力', writeClosed, '只读边界']
      ];
      return `<div class="card ik-home-density-card ik-home-signal-card" data-overview-density-module="signal-coverage">
        <div class="card-head"><div class="card-title">采集通道</div><div class="subtle">${escapeHtml(samplePrefix(ctx.freshness))} · ${fmtNumber(ctx.sampleCount)} 点 · ${escapeHtml(ctx.pollText)}</div></div>
        <div class="card-body">${compactTable(['项', '当前', '说明'], rows.map(([label, value, note]) => `<tr data-overview-field><td>${escapeHtml(label)}</td><td><b>${escapeHtml(String(value))}</b></td><td>${escapeHtml(String(note))}</td></tr>`), '无采集状态')}</div>
      </div>`;
    }

    function overviewStatusBarWanAccessText(ctx) {
      const accessTypeCount = ['PPPoE', 'DHCP', 'VLAN', 'Static', 'Unknown']
        .filter((key) => ctx.accessBuckets?.[key]?.total)
        .length;
      return accessTypeCount ? `${fmtNumber(accessTypeCount)} 类接入` : '不可判定';
    }

    function renderOverviewStatusBar(ctx) {
      const verdict = ctx.verdict || buildOverviewVerdict(ctx);
      const history = isHistorySnapshot(ctx.freshness);
      const noSnapshot = verdict.topKey === 'no-snapshot';
      const focus = overviewDesktopFocus(ctx);
      const conclusion = overviewIncidentName(ctx, verdict);
      const collection = verdict.collection || overviewCollectionTrust(ctx);
      const routeDisplay = overviewRouteDisplay(ctx);
      const labels = overviewCollectionChannelLabels(ctx, collection);
      const snapshotTrust = overviewSnapshotTrustLabel(ctx);
      const deviceName = ctx.o.identity || ctx.snapshot.meta?.routerHost || ctx.snapshot.meta?.target || '未采集设备';
      if (noSnapshot) {
        const latestSuccess = latestCollectionSuccessTime(ctx);
        const routerValue = ctx.routerState?.label === '等待登录' ? '等待登录' : '当前不可达';
        const restValue = stripChannelPrefix(labels.restLabel || 'REST 待确认', 'REST');
        const sshValue = stripChannelPrefix(labels.sshLabel || 'SSH 缺依赖', 'SSH');
        return overviewFlatTopbar([
          { label: '设备', value: deviceName, note: ctx.o.version || ctx.snapshot.meta?.routerVersion || '只读状态' },
          { label: '结论', value: conclusion, note: '默认路由待判定 / 失败端点未记录', title: verdict.topLabel || '', level: verdict.level },
          { label: 'RouterOS', value: routerValue, note: '只读边界' },
          { label: 'REST', value: restValue || '待确认', note: '采集端点' },
          { label: 'SSH', value: sshValue || '缺依赖', note: '采集端点' },
          { label: '最近成功', value: shortTimestamp(latestSuccess), note: '上次成功采集' }
        ], verdict.level || 'warn');
      }
      const deviceNote = noSnapshot
        ? `${ctx.routerState?.label === '等待登录' ? '等待登录' : 'RouterOS 当前不可达'} / 无业务快照，业务数据不展示`
        : [ctx.o.version, ctx.o.uptime ? `运行 ${ctx.o.uptime}` : ''].filter(Boolean).join(' / ');
      const objectText = noSnapshot
        ? 'RouterOS'
        : focus.key === 'resource-full'
          ? 'CPU/MEM/DISK'
          : focus.key === 'collection-down'
            ? '采集通道'
            : focus.key === 'interfaces-down'
              ? '接口转发面'
              : overviewIsWanIncidentKey(focus.key)
                ? `WAN ${fmtNumber(ctx.wanHealth.online)}/${fmtNumber(ctx.wanHealth.total)}`
                : '默认路由';
      const impactTitle = history || ctx.freshness?.stale
        ? '影响待判定'
        : '';
      const impactText = noSnapshot
        ? '业务数据不展示'
        : history || ctx.freshness?.stale
          ? historyCurrentUnknownTitle()
          : focus.key === 'resource-full'
            ? '资源阈值越线'
            : focus.key === 'collection-down'
              ? (collection.label || '通道降级')
              : focus.key === 'interfaces-down'
                ? (routeDisplay.label || '默认路由待判定')
                : overviewIsWanIncidentKey(focus.key)
                  ? overviewOfflineImpact(ctx)
                  : overviewRouteMainText(routeDisplay);
      const collectionStateText = collection.label || '采集状态';
      const collectionText = mobileChannelPair(labels.restLabel, labels.sshLabel);
      const businessAgeText = noSnapshot
        ? '无业务快照，业务数据不展示'
        : snapshotBusinessAgeText(ctx.snapshot, ctx.freshness);
      const businessTimeText = noSnapshot
        ? '业务数据不展示'
        : snapshotBusinessTimeText(ctx.snapshot, ctx.freshness);
      const businessTimeVisibleText = shortTimestampText(businessTimeText);
      const timeText = businessAgeText;
      const conclusionNote = verdict.level === 'ok'
        ? '只读'
        : String(verdict.topLabel || '').length <= 8
          ? verdict.topLabel
          : '';
      const items = [
        { label: '设备', value: deviceName, note: deviceNote },
        { label: '结论', value: conclusion, note: conclusionNote, title: verdict.topLabel || '', level: verdict.level },
        { label: '对象', value: objectText },
        { label: '影响', value: impactText, title: impactTitle, level: verdict.level === 'danger' ? 'danger' : verdict.level === 'warn' ? 'warn' : '' },
        { label: '采集', value: collectionStateText, note: collectionText, title: collectionText },
        { label: '时间', value: timeText, note: `${snapshotTrust} · ${businessTimeVisibleText}`, title: businessTimeText }
      ];
      return overviewFlatTopbar(items, verdict.level || (history ? 'trust' : 'ok'));
    }

    function renderOverviewIncidentLine(ctx) {
      const focus = overviewDesktopFocus(ctx);
      const routeDisplay = overviewRouteDisplay(ctx);
      const verdict = ctx.verdict || buildOverviewVerdict(ctx);
      const collection = verdict.collection || overviewCollectionTrust(ctx);
      const history = isHistorySnapshot(ctx.freshness);
      const level = focus.tone;
      const offlineRows = (ctx.offlineWanRows || [])
        .slice(0, 3)
        .map((row) => row.name || row.interface || '')
        .filter(Boolean);
      const routeHit = overviewRouteHitSummary(ctx.offlineWanRows || []);
      const items = overviewIsWanIncidentKey(focus.key)
        ? [
          ['状态', focus.headline],
          ['WAN', `${fmtNumber(ctx.wanHealth.offline)}/${fmtNumber(ctx.wanHealth.total)}`],
          ['默认路由', routeDisplay.label || routeDisplay.text || '未判定'],
          ['对象', offlineRows.length ? offlineRows.join(' / ') : '未列出'],
          ['命中', routeHit.hitText],
          ['影响', overviewOfflineImpact(ctx)]
        ]
        : focus.key === 'no-snapshot'
          ? [
            ['状态', '快照缺失'],
            ['状态更新时间', noSnapshotUpdateAgeText(ctx.snapshot, ctx.freshness)],
            ['业务快照时间', '快照缺失'],
            ['数据可信度', '不可判定'],
            ['业务快照', '无'],
            ['通道', `REST ${focus.restLabel} / SSH ${focus.sshLabel}`]
          ]
          : focus.key === 'resource-full'
            ? [
              ['状态', focus.headline],
              ['CPU', fmtPercent(ctx.o.cpuLoad)],
              ['MEM', fmtPercent(ctx.o.memoryUsage)],
              ['DISK', fmtPercent(ctx.o.diskUsage)],
              ['阈值', ctx.resourceEvidence?.worst?.stats?.thresholdText || '待确认'],
              ['持续', ctx.resourceEvidence?.worst?.stats?.durationText || '0s']
            ]
            : focus.key === 'collection-down'
              ? [
                ['状态', focus.headline],
                ['通道', `REST ${focus.restLabel} / SSH ${focus.sshLabel}`],
                ['数据层', '当前使用缓存'],
                ['失败端点', ctx.failures.count ? fmtNumber(ctx.failures.count) : '未记录'],
                ['默认路由', routeDisplay.label || routeDisplay.text || '未判定'],
                ['下次尝试', ctx.pollText || '轮询中']
              ]
              : [
                ['状态', focus.headline],
                ['默认路由', routeDisplay.label || routeDisplay.text || '未判定'],
                ['WAN', `${fmtNumber(ctx.wanHealth.online)}/${fmtNumber(ctx.wanHealth.total)}`],
                ['通道', `REST ${focus.restLabel} / SSH ${focus.sshLabel}`],
                ['数据', focus.freshnessText],
                ['吞吐', focus.throughput]
              ];
      return `<div class="ik-home-ops ik-home-ops-bar${history ? '' : ' is-live'} is-${escapeHtml(level)}" data-overview-incident-line data-overview-desktop-primary data-overview-primary-conclusion>
        ${items.map(([label, value], index) => `<div class="ik-home-ops-item"${index === 0 ? ' data-overview-field' : ''}><span>${escapeHtml(label)}</span> <b>${escapeHtml(value)}</b></div>`).join('')}
      </div>`;
    }

    function stripChannelPrefix(label, channel) {
      const value = String(label || '-').trim();
      return value.replace(new RegExp(`^(?:${channel}\\s*)+`, 'i'), '') || '-';
    }

    function mobileChannelPair(restLabel, sshLabel) {
      return `REST ${stripChannelPrefix(restLabel, 'REST')} / SSH ${stripChannelPrefix(sshLabel, 'SSH')}`;
    }

    function overviewChannelPair(restLabel, sshLabel) {
      return `REST${stripChannelPrefix(restLabel, 'REST')} / SSH${stripChannelPrefix(sshLabel, 'SSH')}`;
    }

    function overviewRouteMainText(routeDisplay = {}) {
      const label = String(routeDisplay.label || routeDisplay.text || '不可判定').trim();
      if (!label) return '不可判定';
      if (/^活动默认路由$/.test(label) || /活动默认路由/.test(label)) return '活动默认路由';
      if (/^未发现活动默认路由$/.test(label) || /无活动路由|默认路由异常/.test(label)) return '未发现活动默认路由';
      if (/^缓存$/.test(label) || /缓存快照|历史快照|当前影响待判定|影响待判定/.test(label)) return '缓存快照';
      if (/^不可判定$/.test(label) || /缺少当前路由快照|默认路由不可判定/.test(label)) return '不可判定';
      if (/^默认路由待确认$/.test(label)) return label;
      return label.length > 12 ? label.slice(0, 12) : label;
    }

    function overviewIncidentName(ctx, verdict = ctx?.verdict || {}) {
      const history = isHistorySnapshot(ctx?.freshness);
      if (verdict.topKey === 'no-snapshot' || snapshotIsUnavailable(ctx?.snapshot || {})) return '快照缺失';
      if (verdict.topKey === 'resource-full' || verdict.topKey === 'resource-load') return verdict.topKey === 'resource-full' ? '资源满载' : '资源高负载';
      if (verdict.topKey === 'wan-offline-all' || (overviewIsWanIncidentKey(verdict.topKey) && ctx?.wanHealth?.total > 0 && ctx.wanHealth.online === 0)) return 'WAN全离线';
      if (overviewIsWanIncidentKey(verdict.topKey)) return 'WAN异常';
      if (verdict.topKey === 'interfaces-down') return '接口全 Down';
      if (overviewIsRouteIncidentKey(verdict.topKey)) return '路由异常';
      if (verdict.topKey === 'collection-degraded' || verdict.topKey === 'collection-down') return '采集异常';
      if (history || verdict.topKey === 'data-stale') return '缓存快照';
      return verdict.level === 'warn' ? '状态降级' : '正常';
    }

    function overviewRouteDisplay(ctx) {
      const routeHealth = ctx.routeHealth || {};
      if (snapshotIsUnavailable(ctx.snapshot) || ctx.snapshot.status === 'error' || routeHealth.state === 'unavailable') {
        return { label: '不可判定', text: '缺少当前路由快照', level: 'warn' };
      }
      if (isHistorySnapshot(ctx.freshness) || ctx.freshness?.stale) {
        return { label: historyCurrentUnknownTitle(), text: '默认路由待判定', level: 'warn' };
      }
      if (routeHealth.state === 'active') {
        return {
          label: '活动默认路由',
          text: routeHealth.text || `${fmtNumber(routeHealth.active || 0)} 条活动默认路由`,
          level: routeHealth.level || 'ok'
        };
      }
      if (routeHealth.state === 'inactive') {
        return {
          label: '未发现活动默认路由',
          text: routeHealth.text || '未发现活动默认路由',
          level: routeHealth.level || 'danger'
        };
      }
      return {
        label: routeHealth.label || '默认路由待确认',
        text: routeHealth.text || '默认路由事实未采集',
        level: routeHealth.level || 'warn'
      };
    }

    function renderOverviewFocusCard(ctx, focus, variant = 'summary') {
      const history = isHistorySnapshot(ctx.freshness);
      const cardTitle = focus.detailTitle;
      const cardSub = variant === 'detail' ? (focus.detailSub || focus.summaryNote || '') : '';
      const section = (title, body) => overviewSubtable(title, body);
      const detailCard = (module, title, subtitle, body, extraAttrs = '') => overviewFlatModule(module, title, subtitle, body, extraAttrs);
      switch (focus.key) {
        case 'resource-full': {
          return renderOverviewResourceThresholdPanelDense(ctx);
        }
        case 'collection-down': {
          const trustLabel = overviewSnapshotTrustLabel(ctx);
          const failures = endpointFailureEntries(ctx.snapshot.meta || {});
          const collection = collectionDisplayState(ctx, ctx.verdict?.collection || overviewCollectionTrust(ctx));
          const labels = overviewCollectionChannelLabels(ctx, collection);
          const latestSuccess = latestCollectionSuccessTime(ctx);
          const failureText = failures.length
            ? failures.slice(0, 2).map((row) => `${row.group}:${row.message}`).join(' / ')
            : (ctx.failures.count ? ctx.failures.text : '未记录具体端点，按通道状态降级');
          const rows = [
            `<tr data-overview-field><td>REST</td><td><b>${escapeHtml(labels.restLabel || 'REST 待确认')}</b></td><td>${tag('待确认', 'warn')}</td><td>${escapeHtml(failureText)}</td></tr>`,
            `<tr data-overview-field><td>SSH</td><td><b>${escapeHtml(labels.sshLabel || 'SSH 缺依赖')}</b></td><td>${tag(/不可达/.test(labels.sshLabel || '') ? '不可达' : '缺依赖', 'warn')}</td><td>${escapeHtml(collection.failedEndpointText || 'SSH 通道缺依赖')}</td></tr>`,
            `<tr data-overview-field><td>最后成功</td><td><b title="${escapeHtml(latestSuccess)}">${escapeHtml(shortTimestamp(latestSuccess))}</b></td><td>留存</td><td>上次成功采集</td></tr>`,
            `<tr data-overview-field><td>当前使用缓存</td><td><b>缓存快照</b></td><td>${tag('缓存', 'warn')}</td><td>当前展示最后成功快照</td></tr>`
          ];
          return detailCard('collection-focus', `采集通道 · ${trustLabel}`, cardSub || '通道 / 数据层 / 失败端点', `
            ${section(`采集通道 · ${trustLabel}`, compactTable(['通道', '当前', '状态', '依据'], rows, '采集通道异常'))}
          `);
        }
        case 'no-snapshot': {
          const failures = endpointFailureEntries(ctx.snapshot.meta || {});
          const failureRows = failures.map((row) => `<tr><td>${escapeHtml(row.group)}</td><td>${escapeHtml(row.name)}</td><td>${escapeHtml(row.message)}</td></tr>`);
          const completeness = dataCompleteness(ctx.snapshot);
          const completenessRows = [
            `<tr><td><b>${escapeHtml(completeness.label)}</b></td><td>${fmtNumber(completeness.read)}</td><td>${fmtNumber(completeness.total - completeness.read)}</td><td>${escapeHtml(completeness.missing.length ? compactListText(completeness.missing, 4) : '全部关键数据已读取')}</td></tr>`
          ];
          return detailCard('no-snapshot-focus', '快照证据', cardSub || '快照缺失 / 采集层 / 数据完整度', `
            <div class="ik-home-detail-grid is-single">
              ${section('失败端点', compactTable(['采集层', '端点', '状态'], failureRows, '未记录端点失败明细'))}
              ${section('数据完整度', compactTable(['完整度', '已读取', '未读取', '说明'], completenessRows, '当前未读取到完整度'))}
            </div>
          `);
        }
        case 'wan-offline-all':
        case 'wan-offline': {
          return detailCard('wan-focus', 'WAN线路', `${cardTitle} · ${cardSub || 'WAN / 默认路由 / 离线数量'}`, `
              <div class="ik-home-detail-grid is-single">
                ${section('离线线路', renderWanMiniTable(ctx))}
                ${section('默认路由', renderDefaultRouteSnapshot(ctx))}
              </div>
          `);
        }
        case 'interfaces-down': {
          const interfaces = Array.isArray(ctx.snapshot.interfaces) ? ctx.snapshot.interfaces : [];
          const downRows = interfaces.filter((row) => row && row.running === false);
          const involved = downRows.slice(0, 4).map((row) => row.name).filter(Boolean);
          const collection = ctx.verdict?.collection || overviewCollectionTrust(ctx);
          const labels = overviewCollectionChannelLabels(ctx, collection);
          const routeDisplay = overviewRouteDisplay(ctx);
          const impact = overviewInterfaceImpactParts(ctx, downRows);
          const rows = [
            `<tr data-overview-field><td>down 数</td><td><b>${fmtNumber(downRows.length || ctx.wanHealth.offline || 0)}</b></td><td>${escapeHtml(`${fmtNumber(interfaces.length || ctx.wanHealth.total || 0)} 接口样本`)}</td></tr>`,
            `<tr data-overview-field><td>涉及接口</td><td><b>${escapeHtml(involved.length ? involved.join(' / ') : '未列出')}</b></td><td>转发面不可用</td></tr>`,
            `<tr data-overview-field><td>parent</td><td><b>${escapeHtml(impact.parent)}</b></td><td>父接口影响面</td></tr>`,
            `<tr data-overview-field><td>bridge / vlan</td><td><b>${escapeHtml(`${impact.bridge} / ${impact.vlan}`)}</b></td><td>二层与 VLAN 影响面</td></tr>`,
            `<tr data-overview-field><td>pppoe-out</td><td><b>${escapeHtml(impact.pppoeOut)}</b></td><td>PPPoE 出口关系</td></tr>`,
            `<tr data-overview-field><td>默认路由影响</td><td><b>${escapeHtml(routeDisplay.label || '不可判定')}</b></td><td>${escapeHtml(routeDisplay.text || '接口 Down，默认路由影响待判定')}</td></tr>`,
            `<tr data-overview-field><td>转发面判断</td><td><b>接口关系优先</b></td><td>parent / bridge / vlan / pppoe-out 先于采集通道</td></tr>`,
            `<tr data-overview-field><td>REST SSH 可达性</td><td><b>${escapeHtml(mobileChannelPair(labels.restLabel, labels.sshLabel))}</b></td><td>采集通道能力，不替代转发面判断</td></tr>`
          ];
          return detailCard('interface-forwarding', '接口转发面', `${cardTitle} · down 数 / 默认路由影响 / REST SSH 可达性`, `
              ${section('接口转发面', compactTable(['对象', '当前', '依据'], rows, '接口转发面不可判定', 'ik-home-evidence-table'))}
          `);
        }
        case 'route-danger': {
          return detailCard('wan-focus', 'WAN线路', `${cardTitle} · WAN / 默认路由 / 通道状态`, `
              <div class="ik-home-detail-grid is-single">
                ${section('WAN 线路', renderWanMiniTable(ctx))}
                ${section('默认路由', renderDefaultRouteSnapshot(ctx))}
              </div>
          `);
        }
        case 'stale-yellow':
        case 'normal':
        default: {
          const rankData = buildOverviewRankData(ctx.snapshot, ctx.freshness);
          return detailCard('route-focus', '路由快照', `${cardTitle} · ${cardSub || '默认路由 / 数据年龄 / 吞吐'}`, `
              <div class="ik-home-detail-grid is-single">
                ${section('默认路由', renderDefaultRouteSnapshot(ctx))}
              </div>
              <div class="ik-home-detail-grid" style="margin-top:2px;">
                ${section('终端排行', compactTable(['名称 / IP', '速率', '状态'], rankData.terminalRows, '当前未采集到终端流量排行', 'ik-home-rank-table'))}
                ${section('接口排行', compactTable(['名称', '速率', '状态'], rankData.interfaceRows, '当前未采集到接口吞吐排行', 'ik-home-rank-table'))}
              </div>
          `);
        }
      }
    }

    function overviewRouteSummary(ctx) {
      const routeHealth = ctx.routeHealth || {};
      const history = isHistorySnapshot(ctx.freshness);
      if (history) {
        if (routeHealth.state === 'unavailable' || ctx.snapshot.status === 'error') {
          return '默认路由不可判定';
        }
        return historyCurrentUnknownTitle();
      }
      if (routeHealth.state === 'unavailable' || ctx.snapshot.status === 'error') {
        return `默认路由：${routeHealth.text || '默认路由不可判定'}`;
      }
      if (routeHealth.state === 'inactive') {
        return `默认路由：${routeHealth.text || '未发现活动默认路由'}`;
      }
      const defaults = ctx.snapshot.routes?.defaultRoutes || [];
      const active = defaults.filter((row) => row.active && !row.disabled);
      const primary = active.slice().sort((a, b) => Number(a.distance || 0) - Number(b.distance || 0))[0];
      if (primary) {
        const gateway = primary.gateway || primary.gatewayStatus || '-';
        return `默认路由：active ${fmtNumber(active.length)}，首选 ${gateway} d${primary.distance ?? '-'}`;
      }
      if (routeHealth.active) return `默认路由：active ${fmtNumber(routeHealth.active)}`;
      return `默认路由：${routeHealth.text || routeHealth.label || '默认路由不可判定'}`;
    }

    function overviewOfflineImpact(ctx) {
      if (ctx.snapshot.status === 'error') return '业务快照缺失';
      const offlineRows = ctx.offlineWanRows || [];
      const history = isHistorySnapshot(ctx.freshness);
      const allWanOffline = ctx.wanHealth?.total > 0 && ctx.wanHealth.online === 0;
      if (allWanOffline) return 'WAN 全离线，默认路由不可用';
      const activeRouteOffline = offlineRows.some((row) => (row.routes || []).some((route) => route.active && !route.disabled));
      const offlineRate = offlineRows.reduce((sum, row) => sum + totalTrafficRate(row), 0);
      if (activeRouteOffline) return '默认路由命中离线线路';
      if (offlineRate > 0) return `离线线路仍有 ${fmtRate(offlineRate)} 流量`;
      if (offlineRows.length) return `离线 ${fmtNumber(offlineRows.length)} / ${fmtNumber(ctx.wanHealth.total)}`;
      if (ctx.routeHealth.level === 'danger') return ctx.routeHealth.text || '默认路由异常';
      if (ctx.resourceLevel !== 'ok') return ctx.resourceLevel === 'danger' ? '资源满载' : '资源高负载';
      if (ctx.failures.count > 0) return history ? historyCurrentUnknownTitle() : '通道异常 · 快照可用';
      if (ctx.freshness?.stale || isHistorySnapshot(ctx.freshness)) {
        return history ? historyCurrentUnknownTitle() : `采样${ctx.freshness.level === 'danger' ? '陈旧' : '偏旧'} ${ctx.freshness.text || '-'}`;
      }
      return '未见线路影响';
    }

    function overviewWanAccessImpact(ctx) {
      if (ctx.snapshot.status === 'error') return 'WAN 分组不可判定';
      return ['PPPoE', 'DHCP', 'VLAN', 'Static', 'Unknown']
        .filter((key) => ctx.accessBuckets[key]?.total)
        .map((key) => {
          const bucket = ctx.accessBuckets[key];
          const offline = Math.max(0, bucket.total - bucket.online);
          return `${key} ${offline ? `离线 ${fmtNumber(offline)}` : '正常'} / ${fmtNumber(bucket.online)}/${fmtNumber(bucket.total)}`;
        })
        .join(' · ') || 'WAN 类型未采集';
    }

    function overviewCollectionTrust(ctx) {
      const meta = ctx.snapshot.meta || {};
      const noSnapshot = ctx.verdict?.topKey === 'no-snapshot' || snapshotIsUnavailable(ctx.snapshot);
      const history = isHistorySnapshot(ctx.freshness);
      const labels = historyAwareCapabilityLabels(ctx.capabilities, ctx.freshness);
      const normalizeLabel = (value, channel) => {
        const text = stripChannelPrefix(value, channel);
        if (text === '上次可用') return '上次可用';
        if (text === '当前不可用') return '不可达';
        if (text === '当前缺依赖' || text === '依赖缺失') return '缺依赖';
        if (text === '采集不可用') return '不可达';
        if (text === '待确认') return '待确认';
        return text || '-';
      };
      const snapshotError = Boolean(ctx.snapshot.status && ctx.snapshot.status !== 'ok');
      const snapshotErrorText = String(ctx.snapshot.error || '');
      const interfacesDown = /接口全 Down|全部接口离线|转发面不可用|接口不可达/.test(snapshotErrorText);
      const channelErrors = [
        meta.realtimeError,
        meta.slowRestError,
        meta.staticError,
        meta.connectionDetailError,
        meta.connectionProtocolError
      ].filter(Boolean);
      let restLabel = normalizeLabel(labels.restLabel, 'REST');
      let sshLabel = normalizeLabel(labels.sshLabel, 'SSH');
      if (noSnapshot) {
        restLabel = '待确认';
        sshLabel = '缺依赖';
      } else if (interfacesDown) {
        restLabel = '不可达';
        sshLabel = '不可达';
      } else if (snapshotError || channelErrors.length) {
        if (!/待确认|不可达/.test(restLabel)) {
          restLabel = '待确认';
        }
        if (!/不可达|缺依赖/.test(sshLabel)) {
          sshLabel = '不可达';
        }
      }
      const channelText = `REST ${restLabel} / SSH ${sshLabel}`;
      const dataStale = Boolean(ctx.freshness?.stale || isHistorySnapshot(ctx.freshness));
      const channelDegraded = Boolean(
        noSnapshot ||
        interfacesDown ||
        snapshotError ||
        channelErrors.length ||
        ctx.failures.count > 0 ||
        /缺依赖|不可用|失败|待确认|未配置|不可达/.test(`${restLabel} ${sshLabel}`)
      );
      const freshnessText = noSnapshot
