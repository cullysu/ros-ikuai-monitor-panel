  <style>
    :root {
      --primary: #4794eb;

    a { color: inherit; text-decoration: none; }
    .app { position: relative; z-index: 1; display: grid; grid-template-columns: 224px 1fr; min-height: 100vh; align-items: start; }

    }

    .frame.page-compact-topbar .topbar,
    .frame.arp-compact .topbar,

      max-height: 0;
      min-height: 0;
      padding-top: 0;
      padding-bottom: 0;
      border-bottom-width: 0;
      opacity: 0;
      overflow: hidden;
      pointer-events: none;
      background: transparent;
      backdrop-filter: none;
      box-shadow: none;
    }
    .frame.page-compact-topbar .topbar-header,
    .frame.arp-compact .topbar-header,

      top: auto;
    }

    .frame.scroll-snap-free .arp-summary-sticky {

      display: none !important;
      pointer-events: none;
    }
    .topmetrics-fixed-host {
      position: fixed;
      top: 0;
      left: var(--top-metrics-fixed-left, 0px);
      width: var(--top-metrics-fixed-width, auto);

      padding: 0;

    .section-summary-fixed-host {
      position: fixed;
      top: 0;
      left: var(--section-summary-fixed-left, 0px);
      width: var(--section-summary-fixed-width, auto);
      margin-top: 0;
      z-index: 80;
      display: none;
      pointer-events: none;
    }
    .section-summary-fixed-host > .section-summary-sticky,
    .section-summary-fixed-host > .arp-summary-sticky {
      position: static !important;
      top: auto !important;
      z-index: auto;
      margin: 0 !important;
      pointer-events: none;
      border-bottom: 0 !important;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      background: rgba(246, 248, 251, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);

      transition: padding .16s ease, max-height .16s ease, opacity .16s ease, border-width .16s ease;
    }
    .topbar-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; }
    .topbar-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; min-width: 0; width: auto; }
    .toolbar-line { display: flex; align-items: center; justify-content: flex-end; gap: 10px; flex-wrap: wrap; width: auto; }

    .page-subtitle,
    .topbar .page-subtitle,

      display: none !important;
      visibility: hidden !important;
      height: 0 !important;
      margin: 0 !important;

      font-size: 12px;
    }
    .page-subtitle.is-hidden { display: none; }
    .frame.overview-title-only .topbar { padding: 6px 18px 0 !important; border-bottom-width: 0; }
    .frame.overview-title-only .topbar-header { position: relative; display: block; min-height: auto; }
    .frame.overview-title-only .topbar-actions { display: none; position: absolute; top: 0; right: 0; min-width: 0; width: auto; gap: 8px; }
    .frame.overview-title-only .toolbar-line { width: auto; }
    .frame.overview-title-only .refresh-toolbar { width: auto; padding: 0; border: 0; background: transparent; box-shadow: none; }
    .frame.overview-title-only .page-title { line-height: 1; }
    .frame.overview-title-only .status-strip { display: none !important; margin-top: 0; }
    .frame.overview-title-only #topMetrics { display: none !important; }
    .frame:not(.overview-title-only):not(.page-compact-topbar):not(.arp-compact):not(.section-summary-fixed):not(.section-summary-pinned):not(.scroll-snap-free) #topMetrics {
      display: grid !important;
    }
    .frame.overview-title-only .content { padding-top: 4px; }
    .frame.overview-title-only .section#overview { margin-top: 0; }
    .frame.overview-title-only .section#overview .section-head { margin-top: 0; }
    .deploy-pill,
    .update-pill {

      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--border);
      color: var(--text-soft);
      font-size: 12px;
      box-shadow: var(--shadow-soft);
    }
    .refresh-toolbar {

      justify-content: flex-end;

      flex-wrap: wrap;
      width: auto;
      padding: 12px 14px;
      border-radius: 8px;
      background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-soft);
    }
    .topbar-actions .deploy-pill,
    .topbar-actions #manualRefreshBtn,
    .topbar-actions .refresh-meta {

    .action-btn {

      padding: 0 16px;
      border-radius: 8px;
      border: 1px solid rgba(71, 148, 235, 0.18);
      background: #fff;
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color .16s ease, border-color .16s ease, color .16s ease, transform .16s ease;
    }
    .action-btn:hover { background: var(--primary-soft-2); border-color: rgba(71, 148, 235, 0.32); }

    .action-btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .action-btn.primary:hover { background: #3f88da; border-color: #3f88da; }

      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      width: 100%;
    }
    .alias-main {
      display: inline-flex;

      min-width: 0;
      flex: 1 1 auto;
    }
    .alias-name {

      color: #223548;
      font-weight: 700;
      word-break: break-all;
    }
    .alias-badge {

      background: rgba(22, 93, 255, 0.08);

      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    .alias-action-btn {

      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .alias-action-btn:hover { background: var(--primary-soft-2); border-color: rgba(71, 148, 235, 0.32); }
    .refresh-control {
      display: inline-flex;

      gap: 8px;
      height: 34px;
      padding: 0 10px;
      border-radius: 8px;

      color: var(--text-soft);
      font-size: 12px;
      white-space: nowrap;
    }
    .refresh-control select,

    }
    .refresh-control input { width: 72px; }
    .refresh-meta {

    .refresh-meta strong { color: var(--text-soft); font-weight: 700; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 5px rgba(36,194,113,0.12); }
    .dot.warn { background: var(--warn); box-shadow: 0 0 0 5px rgba(255,152,0,0.16); }
    .dot.danger { background: var(--danger); box-shadow: 0 0 0 5px rgba(255,77,79,0.16); }
    .status-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-top: 16px; }
    .status-strip:empty { display: none; margin-top: 0; }
    .status-strip.topmetrics-fixed-host { margin-top: 0; }
    .status-pill { background: linear-gradient(180deg, #fff 0%, var(--card-alt) 100%); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; box-shadow: var(--shadow-soft); min-width: 0; }
    .status-k { color: var(--text-dim); font-size: 12px; }
    .status-v { margin-top: 6px; font: 700 18px/1 "Bahnschrift","Microsoft YaHei",sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .content { padding: 18px 24px 30px; }
    .section { margin-bottom: 20px; }

    .section-title::before {

    .section-tip { color: var(--text-dim); font-size: 12px; }
    .grid-6, .grid-4, .grid-3, .grid-2 { display: grid; gap: 10px; }
    .grid-6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .arp-summary-sticky,

      padding: 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98) 0%, rgba(255, 255, 255, 0.96) 78%, rgba(255, 255, 255, 0.92) 100%);
      border-bottom: 0;
      backdrop-filter: blur(10px);
    }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }

    .metric-foot { margin-top: 8px; color: var(--text-soft); font-size: 12px; display: flex; justify-content: space-between; gap: 8px; }
    .chart-box { background: linear-gradient(180deg, #fbfdff 0%, #f7fbff 100%); border: 1px solid #e9f1fb; border-radius: 8px; padding: 8px; }
    .chart-label { display: flex; justify-content: space-between; align-items: center; color: var(--text-soft); font-size: 11px; margin-bottom: 5px; }
    .axis-line-chart { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 8px; align-items: stretch; width: 100%; min-width: 0; }
    .axis-line-chart-y { display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; padding: 10px 0 12px; color: #334155; font-size: 11px; font-weight: 600; line-height: 1; white-space: nowrap; font-variant-numeric: tabular-nums; }

        <div class="router-login-saved-list" id="routerLoginSavedList" aria-label="已保存的 RouterOS 登录"></div>
      </div>
      <form class="router-login-form" id="routerLoginForm" autocomplete="on">
        <input id="routerLoginSavedId" name="savedId" type="hidden">
        <div class="router-login-grid">
          <div class="router-login-field">
            <label for="routerLoginHost">RouterOS 地址</label>
            <input id="routerLoginHost" name="host" type="text" inputmode="url" autocomplete="hostname" placeholder="192.168.88.1" required>
          </div>
          <div class="router-login-field">
            <label for="routerLoginPort">SSH 端口</label>
            <input id="routerLoginPort" name="sshPort" type="number" inputmode="numeric" min="1" max="65535" value="22" required>
          </div>
        </div>
        <div class="router-login-field">
          <label for="routerLoginUser">账号</label>
          <input id="routerLoginUser" name="user" type="text" autocomplete="username" placeholder="ros-panel-readonly" required>
        </div>
        <div class="router-login-field">
          <label for="routerLoginPassword">密码</label>
          <input id="routerLoginPassword" name="password" type="password" autocomplete="current-password" required>
        </div>
        <div class="router-login-options">
          <label class="router-login-check" for="routerLoginRememberPassword">
            <input id="routerLoginRememberPassword" name="rememberPassword" type="checkbox" checked>
            <span><strong>保存密码并记住这台主机</strong>密码会保存在本机面板的 data 目录，不会通过状态接口回显。</span>
          </label>
        </div>
        <div class="router-login-actions">
          <div class="router-login-status" id="routerLoginStatus">正在检查连接配置...</div>
          <button class="action-btn primary" id="routerLoginSubmit" type="submit">连接并进入</button>
        </div>
      </form>
      <div class="router-login-foot">建议使用只读账号。密码只提交给本机面板服务端用于采集，不会在状态接口里回显。</div>
    </div>
  </section>
  <div class="app ik-shell app-shell" data-shell-root="true" data-shell-layout="fixed-wide">
    <aside class="ik-rail" id="ikRail" data-shell-region="rail" data-shell-nav="primary">
      <a class="ik-rail-logo is-active" href="#overview" data-section="overview" title="系统首页">首</a>
      <button class="ik-rail-button ik-rail-search-btn" type="button" title="搜索页面 Ctrl+K" data-quick-search-open aria-label="搜索页面">⌕</button>
      <div class="ik-rail-group">
        <a class="ik-rail-button is-active" href="#overview" data-section="overview" title="系统首页"><span class="ik-rail-glyph ik-home"></span></a>
        <a class="ik-rail-button" href="#interfaces" data-section="interfaces" title="接口总览"><span class="ik-rail-glyph ik-line"></span></a>
        <a class="ik-rail-button" href="#balance" data-section="balance" title="分流监控"><span class="ik-rail-glyph ik-balance"></span></a>
        <a class="ik-rail-button" href="#security" data-section="security" title="ACL 规则"><span class="ik-rail-glyph ik-security"></span></a>

        <a class="ik-rail-button" href="#trafficLoad" data-section="trafficLoad" title="流量负载"><span class="ik-rail-glyph ik-load"></span></a>

        <button class="ik-rail-button ik-readonly-btn" type="button" title="只读状态" data-readonly-info-open aria-label="只读状态">只</button>
        <button class="ik-rail-button ik-readonly-btn" type="button" title="面板地址" data-panel-network-open aria-label="面板地址">IP</button>

    <aside class="sidebar shell-nav" data-shell-region="navigation" data-shell-nav="secondary">
      <div class="ik-brand">
        <div class="ik-brand-left">
          <div class="ik-brand-title">ROS</div>
          <div class="ik-brand-chip">只读版</div>
        </div>
        <div class="ik-brand-user" aria-hidden="true"></div>
      </div>
      <button class="ik-search-pill" type="button" data-quick-search-open>搜索 <strong>Ctrl + K</strong></button>
      <div class="nav-group ik-menu-stack is-empty" id="ikMenuPanel" data-shell-region="nav-panel" data-shell-nav-panel="menu"></div>
    </aside>
    <div class="frame overview-title-only shell-frame" data-shell-region="frame">
      <header class="topbar" data-shell-region="topbar">
        <div class="topbar-header">
          <div>
            <div class="page-title" id="pageTitle">RouterOS 排障</div>
            <div class="page-subtitle is-hidden" id="pageSubtitle"></div>
          </div>
          <div class="topbar-actions">
            <div class="toolbar-line">
              <button class="action-btn" id="panelNetworkBtn" type="button" data-panel-network-open>面板地址</button>
              <div class="deploy-pill">只读面板</div>
              <div class="update-pill"><span class="dot" id="healthDot"></span><span id="updateText">初始化中</span></div>
            </div>
            <div class="refresh-toolbar">
              <button class="action-btn primary" id="manualRefreshBtn" type="button">立即刷新</button>
              <button class="action-btn" id="routerReconnectBtn" type="button">更换连接</button>
              <div class="refresh-meta">
                <span id="refreshModeText">实时轮询中</span>
                <strong id="nextRefreshText">1 秒刷新</strong>
              </div>
            </div>

        <div class="status-strip" id="topMetrics"></div>

      <main class="content shell-content" id="app" data-shell-region="content" data-shell-main="true" role="main" aria-live="polite"></main>
    </div>

  <script>
    const appEl = document.getElementById('app');
    const topMetricsEl = document.getElementById('topMetrics');
    const topbarEl = document.querySelector('.topbar');
    const frameEl = document.querySelector('.frame');
    const appShellEl = document.querySelector('.app');
    const pageTitleEl = document.getElementById('pageTitle');
    const updateTextEl = document.getElementById('updateText');
    const healthDotEl = document.getElementById('healthDot');
    const pageSubtitleEl = document.getElementById('pageSubtitle');
    const manualRefreshBtn = document.getElementById('manualRefreshBtn');
    const routerReconnectBtn = document.getElementById('routerReconnectBtn');
    const refreshModeTextEl = document.getElementById('refreshModeText');
    const nextRefreshTextEl = document.getElementById('nextRefreshText');
    const toolbarLineEl = document.querySelector('.toolbar-line');
    const refreshToolbarEl = document.querySelector('.refresh-toolbar');
    const deployPillEl = document.querySelector('.deploy-pill');
    const ikRailEl = document.getElementById('ikRail');
    const ikMenuPanelEl = document.getElementById('ikMenuPanel');
    const routerLoginPageEl = document.getElementById('routerLoginPage');
    const routerLoginFormEl = document.getElementById('routerLoginForm');
    const routerLoginHostEl = document.getElementById('routerLoginHost');
    const routerLoginPortEl = document.getElementById('routerLoginPort');
    const routerLoginUserEl = document.getElementById('routerLoginUser');
    const routerLoginPasswordEl = document.getElementById('routerLoginPassword');
    const routerLoginSavedIdEl = document.getElementById('routerLoginSavedId');
    const routerLoginRememberPasswordEl = document.getElementById('routerLoginRememberPassword');
    const routerLoginSavedWrapEl = document.getElementById('routerLoginSavedWrap');
    const routerLoginSavedListEl = document.getElementById('routerLoginSavedList');
    const routerLoginSavedCountEl = document.getElementById('routerLoginSavedCount');
    const routerLoginSubmitEl = document.getElementById('routerLoginSubmit');
    const routerLoginStatusEl = document.getElementById('routerLoginStatus');
    const TEST_SNAPSHOT = window.__PANEL_TEST_SNAPSHOT__ || null;
    const IS_TEST_MODE = Boolean(TEST_SNAPSHOT);
    const REALTIME_REFRESH_SECONDS = 1;
    const DNS_RULE_PAGE_SIZE = 100;
    let latestSnapshot = null;
    let displayedSnapshot = null;
    let pendingSnapshot = null;
    let pendingTriggerMode = 'auto';
    let pollTimer = null;
    let countdownTimer = null;
    let interactionResumeTimer = null;
    let interactionPauseUntil = 0;
    let lastRefreshMode = 'init';
    let nextRefreshAt = null;
    let currentSection = 'overview';
    let currentNavGroup = 'home';
    let currentOverviewWanLine = 'aggregate';
    let currentInterfaceView = 'monitor';
    let currentInterfaceTopology = 'wan';
    let interfaceReadonlyOpen = false;
    let currentTerminalView = 'ipv4';
    let dashboardBooted = false;
    let savedRouterLogins = [];
    let selectedRouterLoginId = '';
    let topMetricsPinnedHost = null;
    let compactSummaryPinnedHost = null;
    let compactSummaryPinnedSourceState = null;
    let sectionTopbarStateRaf = 0;
    const compactSummaryPinStartBySection = new Map();

    const PUBLIC_PROFILE_ALIASES = new Set(['public', 'routeros_public', 'routeros_only', 'public_routeros', 'routeros_public_preview']);
    let panelProfileMode = 'public';
    let deployChannelMode = 'public-routeros';

    function isPublicPanelSnapshot(snapshot) {
      const meta = snapshot?.meta || {};
      const capabilities = meta.capabilities || {};
      const rawProfile = String(meta.profile || '').trim().toLowerCase();
      if (meta.publicRouterosProfile === true || meta.publicRouterosProfile === 'true') return true;
      if (capabilities.publicRouterosProfile === true || capabilities.publicRouterosProfile === 'true') return true;
      if (PUBLIC_PROFILE_ALIASES.has(rawProfile)) return true;
      return false;
    }

    function syncPanelProfileState(snapshot) {
      const nextProfileMode = isPublicPanelSnapshot(snapshot) ? 'public' : 'private';
      const nextDeployChannel = nextProfileMode === 'public' ? 'public-routeros' : '.3.5';
      const changed = nextProfileMode !== panelProfileMode || nextDeployChannel !== deployChannelMode;
      panelProfileMode = nextProfileMode;
      deployChannelMode = nextDeployChannel;
      document.body.dataset.panelProfile = panelProfileMode;
      document.body.dataset.publicProfile = panelProfileMode === 'public' ? 'true' : 'false';
      document.body.dataset.profileResolved = 'true';
      document.body.setAttribute('data-deploy-channel', deployChannelMode);
      document.dispatchEvent(new CustomEvent('panel-profile-sync', {
        detail: { panelProfile: panelProfileMode, deployChannel: deployChannelMode }
      }));
      return changed;
    }

    function IS_PUBLIC_PANEL() {
      return panelProfileMode === 'public';
    }

    syncPanelProfileState(TEST_SNAPSHOT);

    if (deployPillEl) {
      const entryLabel = IS_PUBLIC_PANEL() ? '公开只读视图' : '只读面板';
      deployPillEl.textContent = entryLabel;
    }

    try {
      // Public panel: emphasize read-only status in the shell and keep copy neutral/stable.
      const chipEl = document.querySelector('.ik-brand-chip');
      if (chipEl && IS_PUBLIC_PANEL()) {
        chipEl.textContent = '公开只读';
      }
    } catch (error) {
      // Best-effort only.
    }

    function normalizeTopbarActionLayout() {
      if (!toolbarLineEl || !manualRefreshBtn || !deployPillEl) {
        return;
      }
      toolbarLineEl.insertBefore(manualRefreshBtn, deployPillEl);
      if (routerReconnectBtn) {
        toolbarLineEl.insertBefore(routerReconnectBtn, deployPillEl);
      }
      const refreshMetaEl = refreshModeTextEl?.parentElement;
      if (refreshMetaEl?.classList?.contains('refresh-meta')) {
        toolbarLineEl.appendChild(refreshMetaEl);
      }
      refreshToolbarEl?.remove();
    }

    normalizeTopbarActionLayout();

    function setRouterLoginStatus(message, tone = '') {
      if (!routerLoginStatusEl) return;
      routerLoginStatusEl.textContent = message || '';
      routerLoginStatusEl.classList.toggle('is-error', tone === 'error');
      routerLoginStatusEl.classList.toggle('is-ok', tone === 'ok');
      routerLoginStatusEl.classList.toggle('is-warn', tone === 'warn');
    }

    function setSelectedRouterLoginId(savedId = '') {
      selectedRouterLoginId = String(savedId || '');
      if (routerLoginSavedIdEl) routerLoginSavedIdEl.value = selectedRouterLoginId;
      updateRouterPasswordRequirement();
      renderSavedRouterLogins();
    }

    function savedLoginLabel(entry) {
      const host = entry?.host || 'RouterOS';
      const port = entry?.sshPort || 22;
      return `${host}:${port}`;
    }

    function savedLoginMeta(entry) {
      const parts = [];
      if (entry?.user) parts.push(entry.user);
      parts.push(entry?.passwordSaved ? '已保存密码' : '未保存密码');
      if (entry?.lastUsedAt) parts.push(entry.lastUsedAt);
      return parts.join(' · ');
    }

    function findSavedRouterLogin(savedId) {
      return savedRouterLogins.find((entry) => entry.id === savedId) || null;
    }

    function updateRouterPasswordRequirement() {
      const selected = findSavedRouterLogin(selectedRouterLoginId);
      const canUseSavedPassword = Boolean(selected?.passwordSaved && !routerLoginPasswordEl?.value);
      if (routerLoginPasswordEl) {
        routerLoginPasswordEl.required = !canUseSavedPassword;
        routerLoginPasswordEl.placeholder = canUseSavedPassword ? '已保存密码，留空直接连接' : '';
      }
    }

    function renderSavedRouterLogins() {
      if (!routerLoginSavedWrapEl || !routerLoginSavedListEl) return;
      const entries = Array.isArray(savedRouterLogins) ? savedRouterLogins : [];
      routerLoginSavedWrapEl.hidden = entries.length === 0;
      if (routerLoginSavedCountEl) {
        routerLoginSavedCountEl.textContent = entries.length ? `${entries.length} 台` : '';
      }
      routerLoginSavedListEl.replaceChildren();
      entries.forEach((entry) => {
        const row = document.createElement('div');
        row.className = `router-login-saved-item${entry.id === selectedRouterLoginId ? ' is-active' : ''}`;

        const selectBtn = document.createElement('button');
        selectBtn.className = 'router-login-saved-main';
        selectBtn.type = 'button';
        selectBtn.dataset.routerLoginSelect = entry.id;

        const nameEl = document.createElement('span');
        nameEl.className = 'router-login-saved-name';
        nameEl.textContent = savedLoginLabel(entry);
        const metaEl = document.createElement('span');
        metaEl.className = 'router-login-saved-meta';
        metaEl.textContent = savedLoginMeta(entry);
        selectBtn.append(nameEl, metaEl);

        const removeBtn = document.createElement('button');
        removeBtn.className = 'router-login-saved-remove';
        removeBtn.type = 'button';
        removeBtn.dataset.routerLoginDelete = entry.id;
        removeBtn.setAttribute('aria-label', `删除 ${savedLoginLabel(entry)}`);
        removeBtn.textContent = '删除';

        row.append(selectBtn, removeBtn);
        routerLoginSavedListEl.appendChild(row);
      });
    }

    function applySavedRouterLogin(entry) {
      if (!entry) return;
      if (routerLoginHostEl) routerLoginHostEl.value = entry.host || '';
      if (routerLoginUserEl) routerLoginUserEl.value = entry.user || '';
      if (routerLoginPortEl) routerLoginPortEl.value = entry.sshPort || 22;
      if (routerLoginPasswordEl) routerLoginPasswordEl.value = '';
      setSelectedRouterLoginId(entry.id);
      setRouterLoginStatus(entry.passwordSaved ? '已选择保存的主机，留空密码可直接连接。' : '这台主机没有保存密码，请输入密码。');
      setTimeout(() => (entry.passwordSaved ? routerLoginSubmitEl : routerLoginPasswordEl)?.focus(), 0);
    }

    function setSavedRouterLogins(entries) {
      if (Array.isArray(entries)) {
        savedRouterLogins = entries;
      }
      if (selectedRouterLoginId && !findSavedRouterLogin(selectedRouterLoginId)) {
        selectedRouterLoginId = '';
        if (routerLoginSavedIdEl) routerLoginSavedIdEl.value = '';
      }
      renderSavedRouterLogins();
      updateRouterPasswordRequirement();
    }

    function prefillRouterLogin(routerLogin) {
      if (!routerLogin) return;
      if (routerLoginHostEl && routerLogin.host) routerLoginHostEl.value = routerLogin.host;
      if (routerLoginUserEl && routerLogin.user) routerLoginUserEl.value = routerLogin.user;
      if (routerLoginPortEl && routerLogin.sshPort) routerLoginPortEl.value = routerLogin.sshPort;
      if (routerLogin.savedId) {
        setSelectedRouterLoginId(routerLogin.savedId);
      }
    }

    function showRouterLogin(routerLogin, message = '请输入 RouterOS SSH 连接信息', savedLogins = null) {
      setSavedRouterLogins(savedLogins);
      prefillRouterLogin(routerLogin);
      document.body.classList.remove('router-login-booting', 'router-login-ready');
      document.body.classList.add('router-login-required');
      if (routerLoginPageEl) routerLoginPageEl.hidden = false;
      setRouterLoginStatus(message);
      setTimeout(() => routerLoginHostEl?.focus(), 0);
    }

    function showDashboardShell() {
      document.body.classList.remove('router-login-booting', 'router-login-required');
      document.body.classList.add('router-login-ready');
      if (routerLoginPageEl) routerLoginPageEl.hidden = true;
    }

    function bootDashboard() {
      showDashboardShell();
      if (dashboardBooted) {
        loadSnapshot('manual');
        return;
      }
      dashboardBooted = true;
      lockPageSubtitleHidden();
      renderNavigation();
      setActiveSection(resolveBootstrapSection(), false);
      loadSnapshot('init');
    }

    async function fetchRouterLoginState() {
      const response = await fetch('/api/router-login', { cache: 'no-store' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    }

    async function bootstrapRouterConnection() {
      if (IS_TEST_MODE) {
        bootDashboard();
        return;
      }
      try {
        const payload = await fetchRouterLoginState();
        const routerLogin = payload.routerLogin || {};
        setSavedRouterLogins(payload.savedLogins || []);
        if (routerLogin.configured) {
          bootDashboard();
        } else {
          showRouterLogin(routerLogin, '请输入 RouterOS SSH 连接信息', payload.savedLogins || []);
        }
      } catch (error) {
        showRouterLogin(null, `无法读取本机面板状态：${error.message}`);
      }
    }

    async function disconnectRouterAndShowLogin(message = '请重新填写 RouterOS SSH 信息') {
      clearTimeout(pollTimer);
      clearInterval(countdownTimer);
      nextRefreshAt = null;
      latestSnapshot = null;
      displayedSnapshot = null;
      pendingSnapshot = null;
      try {
        const response = await fetch('/api/router-logout', { method: 'POST', cache: 'no-store' });
        const payload = await response.json().catch(() => ({}));
        showRouterLogin(payload.routerLogin || null, message, payload.savedLogins || []);
      } catch (error) {
        showRouterLogin(null, `已停止刷新，但断开连接接口失败：${error.message}`);
      }
    }

    routerLoginSavedListEl?.addEventListener('click', async (event) => {
      const deleteBtn = event.target.closest('[data-router-login-delete]');
      if (deleteBtn) {
        const savedId = deleteBtn.dataset.routerLoginDelete;
        deleteBtn.disabled = true;
        try {
          const response = await fetch('/api/router-login-forget', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            cache: 'no-store',
            body: JSON.stringify({ id: savedId })
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok || !payload.ok) {
            throw new Error(payload.error || `HTTP ${response.status}`);
          }
          setSavedRouterLogins(payload.savedLogins || []);
          if (selectedRouterLoginId === savedId) {
            setSelectedRouterLoginId('');
          }
          setRouterLoginStatus(payload.removed ? '已删除保存的主机。' : '没有找到这条保存记录。', payload.removed ? 'ok' : 'warn');
        } catch (error) {
          setRouterLoginStatus(`删除失败：${error.message}`, 'error');
          deleteBtn.disabled = false;
        }
        return;
      }
      const selectBtn = event.target.closest('[data-router-login-select]');
      if (selectBtn) {
        applySavedRouterLogin(findSavedRouterLogin(selectBtn.dataset.routerLoginSelect));
      }
    });

    [routerLoginHostEl, routerLoginUserEl, routerLoginPortEl].forEach((inputEl) => {
      inputEl?.addEventListener('input', () => {
        if (selectedRouterLoginId) {
          setSelectedRouterLoginId('');
        }
      });
    });

    routerLoginPasswordEl?.addEventListener('input', updateRouterPasswordRequirement);

    routerLoginFormEl?.addEventListener('submit', async (event) => {
      event.preventDefault();
      const host = routerLoginHostEl?.value?.trim() || '';
      const user = routerLoginUserEl?.value?.trim() || '';
      const password = routerLoginPasswordEl?.value || '';
      const sshPort = Number(routerLoginPortEl?.value || 22);
      const savedId = routerLoginSavedIdEl?.value || '';
      const rememberPassword = routerLoginRememberPasswordEl ? routerLoginRememberPasswordEl.checked : true;
      routerLoginSubmitEl.disabled = true;
      routerLoginSubmitEl.textContent = '连接中...';
      setRouterLoginStatus('正在用 SSH 验证 RouterOS 凭据...');
      try {
        const response = await fetch('/api/router-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ host, user, password, sshPort, savedId, rememberPassword })
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok || !payload.ok) {
          throw new Error(payload.error || `HTTP ${response.status}`);
        }
        const identity = payload.test?.ssh?.identity ? `：${payload.test.ssh.identity}` : '';
        if (payload.warning) {
          setRouterLoginStatus(`${payload.warning} 已进入面板${identity}`, 'warn');
        } else {
          setRouterLoginStatus(`连接成功${identity}`, 'ok');
        }
        setSavedRouterLogins(payload.savedLogins || savedRouterLogins);
        routerLoginPasswordEl.value = '';
        setSelectedRouterLoginId(payload.routerLogin?.savedId || '');
        setTimeout(() => bootDashboard(), 350);
      } catch (error) {
        setRouterLoginStatus(`连接失败：${error.message}`, 'error');
      } finally {
        routerLoginSubmitEl.disabled = false;
        routerLoginSubmitEl.textContent = '连接并进入';
      }
    });

    let dnsRuleBrowser = {
      offset: 0,
      limit: DNS_RULE_PAGE_SIZE,
      totalCount: 0,
      visibleRuleCount: 0,
      rows: [],
      loading: false,
      loaded: false,
      error: ''
    };

    const pageMeta = {
      overview: { title: '首页', subtitle: '首页按 RouterOS 语义汇总链路闭环、风险与下一步检查' },
      interfaces: { title: '接口总览', subtitle: '接口状态、WAN 线路、聚合速率与拓扑关系集中查看' },
      dhcp: { title: 'DHCP 服务', subtitle: 'DHCP 服务器、地址池与租约按 RouterOS 实读数据展示' },
      dns: { title: 'DNS 服务', subtitle: 'DNS 运行状态、上游参数与静态规则只读展示' },
      routes: { title: '静态路由', subtitle: '真实路由表、默认路由与静态路由集中只读展示' },
      balance: { title: '分流监控', subtitle: '默认路由、分流规则与策略路由统一展示' },
      trafficLoad: { title: '流量负载', subtitle: '宽带吞吐、接口实时流量与终端流量排行集中查看' },
      lineStatus: { title: '线路状态', subtitle: '按拨号、地址、默认路由与接口异常实时检测线路状态' },
      security: { title: 'ACL 规则', subtitle: '访问控制、地址名单与异常告警集中查看' },
      arp: { title: 'ARP 监控', subtitle: 'ARP 列表、终端关联与冲突告警集中查看' },
      trafficAudit: { title: '流量审计', subtitle: '单 IP 活跃连接、实时流量与会话审计集中查看' },
      logs: { title: '日志中心', subtitle: '系统、Firewall、DHCP、DNS 日志分类查看' },

    function chartValue(value) {
      if (value === null || value === undefined || value === '') return null;

    function smoothNumericSeries(values = [], passes = 2) {
      const original = (values || []).map((value) => Number(value || 0)).filter((value) => Number.isFinite(value));
      if (original.length < 4) return original;
      let smoothed = original.slice();
      const runCount = Math.max(1, Number(passes || 1));
      for (let pass = 0; pass < runCount; pass += 1) {
        smoothed = smoothed.map((value, index, arr) => {
          if (index === 0) return (value * 2 + arr[index + 1]) / 3;
          if (index === arr.length - 1) return (arr[index - 1] + value * 2) / 3;
          const prev = arr[index - 1];
          const next = arr[index + 1];
          return (prev + value * 2 + next) / 4;
        });
      }
      return smoothed;
    }

    function chartSegmentElements(values, mapper, color, options = {}) {
      const strokeWidth = options.strokeWidth || 2.4;
      const pointRadius = options.pointRadius || 2.4;
      const className = options.className ? ` class="${options.className}"` : '';
      const segments = [];
      let current = [];
      (Array.isArray(values) ? values : []).forEach((value, index) => {
        const numeric = chartValue(value);
        if (numeric === null) {
          if (current.length) segments.push(current);
          current = [];
          return;
        }
        current.push(mapper(numeric, index));
      });
      if (current.length) segments.push(current);
      return segments.map((points) => {
        if (points.length === 1) {
          const [cx, cy] = points[0].split(',');
          return `<circle${className} cx="${cx}" cy="${cy}" r="${pointRadius}" fill="${color}"/>`;
        }
        return `<polyline${className} fill="none" stroke="${color}" stroke-width="${strokeWidth}" stroke-linecap="round" stroke-linejoin="round" points="${points.join(' ')}"/>`;
      }).join('');
    }

    function chartAxisLabel(value, options = {}) {
      const numeric = chartValue(value);
      if (numeric === null) return '-';
      if (typeof options.formatY === 'function') return options.formatY(numeric);
      if (options.axis === 'rate') return fmtRate(numeric);
      if (options.axis === 'percent') return fmtPercent(numeric);
      return fmtCompact(numeric);
    }

    function lineChart(series, options = {}) {
      const width = options.width || 620;
      const height = options.height || 140;
      const padX = 8;
      const padTop = 10;
      const padBottom = 12;
      const plotHeight = height - padTop - padBottom;
      const seriesList = Array.isArray(series[0]) ? series : [series];
      const all = seriesList.flat().map(chartValue).filter((item) => item !== null);
      const max = Math.max(...all, 1);
      const min = 0;
      const marks = [max, max / 2, 0];
      const grid = marks.map((mark) => {
        const y = padTop + ((max - mark) / (max - min || 1)) * plotHeight;
        return `<line x1="${padX}" y1="${y}" x2="${width - padX}" y2="${y}" stroke="rgba(22,93,255,0.10)" stroke-width="1"/>`;
      });
      const axis = `<line x1="${padX}" y1="${padTop}" x2="${padX}" y2="${height - padBottom}" stroke="rgba(113,128,150,0.28)" stroke-width="1"/>`;
      const colors = options.colors || ['#165dff', '#16c67a', '#ffb020'];
      const paths = seriesList.map((arr, idx) => {
        const values = Array.isArray(arr) ? arr : [];
        const step = values.length > 1 ? (width - padX * 2) / (values.length - 1) : 0;
        return chartSegmentElements(values, (value, index) => {
          const x = padX + step * index;
          const y = padTop + ((max - Math.max(0, value)) / (max - min || 1)) * plotHeight;
          return `${x},${y}`;
        }, colors[idx % colors.length]);
      }).join('');
      const labels = marks.map((mark) => {
        const tickLabel = chartAxisLabel(mark, options);
        return `<span class="axis-tick-label" title="${escapeHtml(tickLabel)}">${escapeHtml(tickLabel)}</span>`;
      }).join('');
      return `<div class="axis-line-chart">
        <div class="axis-line-chart-y" aria-hidden="true">${labels}</div>
        <svg class="mini-chart" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">${grid.join('')}${axis}${paths}</svg>
      </div>`;
    }

    function rateAxisLineChart(values = [], color = '#165dff', options = {}) {
      const width = options.width || 360;
      const height = options.height || 82;
      const padX = 8;
      const padY = 8;
      const rawValues = Array.isArray(values) ? values : [];
      const points = rawValues.map(chartValue);
      const finitePoints = points.filter((value) => value !== null);
      const current = chartValue(options.current);
      const max = Math.max(...finitePoints, current !== null ? current : 0, 1);
      const plotHeight = height - padY * 2;
      const marks = [max, max / 2, 0];
      const grid = marks.map((mark) => {
        const y = padY + ((max - mark) / max) * plotHeight;
        return `<line x1="${padX}" y1="${y}" x2="${width - padX}" y2="${y}" stroke="rgba(22,93,255,0.10)" stroke-width="1"/>`;
      }).join('');
      const step = points.length > 1 ? (width - padX * 2) / (points.length - 1) : 0;
      const polyline = finitePoints.length
        ? chartSegmentElements(rawValues, (value, index) => {
            const x = padX + step * index;
            const y = padY + ((max - Math.max(0, value)) / max) * plotHeight;
            return `${x},${y}`;
          }, color)
        : '';
      return {
        svg: `<svg class="ik-wan-rate-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">${grid}${polyline}</svg>`,
        max,
        mid: max / 2,
        count: finitePoints.length
      };
    }

    function wanRateSplitCard(label, current, values = [], color = '#165dff', pollText = '') {
      const chart = rateAxisLineChart(values, color, { current });
      return `<div class="ik-wan-rate-card" style="--wan-rate-color:${color}">

            <span>0 B/s</span>

    function resourcePercentChart(values = [], color = '#165dff') {
      const width = 360;
      const height = 96;
      const padX = 8;
      const padY = 8;
      const rawValues = Array.isArray(values) ? values : [];
      const points = rawValues.map(chartValue);
      const finitePoints = points.filter((value) => value !== null);
      const chartHeight = height - padY * 2;
      const grid = [100, 50, 0].map((mark) => {
        const y = padY + ((100 - mark) / 100) * chartHeight;
        return `<line x1="${padX}" y1="${y}" x2="${width - padX}" y2="${y}" stroke="rgba(22,93,255,0.09)" stroke-width="1"/>`;
      }).join('');
      if (!finitePoints.length) return `<svg class="ops-resource-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">${grid}</svg>`;
      const step = points.length > 1 ? (width - padX * 2) / (points.length - 1) : 0;
      const polyline = chartSegmentElements(rawValues, (value, index) => {
        const clamped = Math.max(0, Math.min(100, value));
        const x = padX + step * index;
        const y = padY + ((100 - clamped) / 100) * chartHeight;
        return `${x},${y}`;
      }, color);
      return `<svg class="ops-resource-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">${grid}${polyline}</svg>`;
    }

    function getPppoeDisplayOrder(name) {
      const normalized = String(name || '').trim().toLowerCase();
      const pppoeMatch = normalized.match(/pppoe[-_\s]*out(\d+)$/i);
      if (pppoeMatch) return Number(pppoeMatch[1]);
      const genericSuffix = normalized.match(/(\d+)$/);
      return genericSuffix ? Number(genericSuffix[1]) : Number.POSITIVE_INFINITY;
    }

    function sortPppoeNamedRows(rows) {
      return (rows || []).slice().sort((a, b) => {
        const orderA = getPppoeDisplayOrder(a?.name);
        const orderB = getPppoeDisplayOrder(b?.name);
        if (orderA !== orderB) return orderA - orderB;
        return String(a?.name || '').localeCompare(String(b?.name || ''), 'zh-CN', { numeric: true, sensitivity: 'base' });
      });
    }

    function getFallbackWanLines(snapshot) {
      const interfaces = (snapshot?.interfaces || []).filter((row) => row?.role === 'WAN');
      return interfaces.map((row) => ({
        name: row.name,
        status: row.running && !row.disabled ? '在线' : '离线',
        running: row.running && !row.disabled,
        parent: row.type || '-',
        addresses: row.ips || [],
        upRate: Number(row.txRate || 0),
        downRate: Number(row.rxRate || 0),
        rxBytes: Number(row.rxBytes || 0),
        txBytes: Number(row.txBytes || 0),
        history: { up: [], down: [] },
        routes: [],
        kind: 'interface',
        access: row.type || '-'
      }));
    }

    function getLogicalWanLines(snapshot) {
      const pppoeRows = sortPppoeNamedRows(snapshot?.pppoe || []);
      if (pppoeRows.length) return pppoeRows;
      const wanRows = sortPppoeNamedRows(snapshot?.wan || []);
      if (wanRows.length) return wanRows;
      return sortPppoeNamedRows(getFallbackWanLines(snapshot));
    }

      const explicitTier = snapshot?.meta?.lineLayoutTier;

      if (count === 1) return 'single';
      if (count <= 3) return 'few';
      if (count <= 6) return 'multi';

      const emptyText = options.emptyText || '当前未读取到可展示的线路趋势';
      if (!rows.length) return emptyBlock(emptyText);
      const columnCount = Number(options.columns || (rows.length === 4 ? 2 : rows.length >= 7 ? 4 : Math.min(3, Math.max(1, rows.length))));
      return `<div class="line-trend-grid" style="grid-template-columns:repeat(${columnCount}, minmax(0, 1fr))">${rows.map((item) => `
        <div class="chart-box">
          <div class="chart-label"><span>${escapeHtml(item.name)}</span><span>TX / RX</span></div>

    function recordItem(label, value) {

    function table(headers, rows, emptyText) {
      const body = Array.isArray(rows) ? rows.join('') : String(rows || '');
      if (!body.trim()) return emptyBlock(emptyText);
      const parser = new DOMParser();
      const doc = parser.parseFromString(`<table><tbody>${body}</tbody></table>`, 'text/html');
      const trList = Array.from(doc.querySelectorAll('tbody > tr'));
      if (!trList.length) return emptyBlock(emptyText);
      const cards = trList.map((tr, rowIndex) => {
        const cells = Array.from(tr.children).map((cell, cellIndex) => ({
          label: headers[cellIndex] || `字段 ${cellIndex + 1}`,
          value: cell.innerHTML && cell.innerHTML.trim() ? cell.innerHTML.trim() : '-'
        }));
        if (!cells.length) return '';
        const [primary, ...rest] = cells;
        return `
          <article class="record-card">
            <div class="record-head">
              <span class="record-index">${fmtNumber(rowIndex + 1)}</span>
              <div class="record-title">
                <div class="record-label">${escapeHtml(primary.label)}</div>
                <div class="record-value">${primary.value}</div>
              </div>
            </div>
            ${rest.length ? `<div class="record-grid">${rest.map((item) => recordItem(item.label, item.value)).join('')}</div>` : ''}
          </article>`;
      }).join('');
      return cards ? `<div class="record-list">${cards}</div>` : emptyBlock(emptyText);
    }

      const body = Array.isArray(rows) ? rows.join('') : String(rows || '');
      if (!body.trim()) return emptyBlock(emptyText);
      const extraClasses = String(className || '')
        .split(/\s+/)
        .filter((name) => /^[a-z0-9_-]+$/i.test(name))
        .join(' ');
      const headerHtml = headers.map((header) => `<th>${escapeHtml(header)}</th>`).join('');
      return `<div class="ops-table-wrap"><table class="ops-table ${extraClasses}"><thead><tr>${headerHtml}</tr></thead><tbody>${body}</tbody></table></div>`;
    }

      const nextPixels = Number(pixels);
      const nextValue = Number.isFinite(nextPixels) && nextPixels > 0 ? `${Math.ceil(nextPixels)}px` : '';
      if (appEl.style.paddingTop !== nextValue) {
        appEl.style.paddingTop = nextValue;
      }
    }

    function restoreCompactSummaryPinnedSourceState() {
      if (!compactSummaryPinnedSourceState?.el) {
        compactSummaryPinnedSourceState = null;
        return;
      }
      compactSummaryPinnedSourceState.el.style.visibility = compactSummaryPinnedSourceState.visibility;
      compactSummaryPinnedSourceState.el.style.pointerEvents = compactSummaryPinnedSourceState.pointerEvents;
      compactSummaryPinnedSourceState.el.style.marginBottom = compactSummaryPinnedSourceState.marginBottom;
      compactSummaryPinnedSourceState = null;
    }

    function clearTopMetricsPinnedState() {
      if (!frameEl) return;
      const hadPinnedTopMetrics = frameEl.classList.contains('topmetrics-fixed');
      frameEl.classList.remove('topmetrics-fixed');
      frameEl.style.removeProperty('--top-metrics-fixed-left');
      frameEl.style.removeProperty('--top-metrics-fixed-width');
      frameEl.style.removeProperty('--top-metrics-height');
      const pinnedHost = ensureTopMetricsPinnedHost();
      pinnedHost.style.display = 'none';
      pinnedHost.style.left = '';
      pinnedHost.style.width = '';
      pinnedHost.style.pointerEvents = '';
      pinnedHost.innerHTML = '';
      if (hadPinnedTopMetrics && !frameEl.classList.contains('section-summary-pinned')) {
        setAppTopPadding(0);
      }
    }

    function clearCompactSummaryPinnedState() {
      if (!frameEl) return;
      restoreCompactSummaryPinnedSourceState();
      frameEl.classList.remove('section-summary-fixed', 'section-summary-pinned');
      frameEl.style.removeProperty('--section-summary-fixed-left');
      frameEl.style.removeProperty('--section-summary-fixed-width');
      frameEl.style.removeProperty('--section-summary-height');
      const pinnedHost = ensureCompactSummaryPinnedHost();
      pinnedHost.style.display = 'none';
      pinnedHost.style.left = '';
      pinnedHost.style.width = '';
      pinnedHost.innerHTML = '';
    }

    function syncTopMetricsPinned() {
      clearTopMetricsPinnedState();
      if (!frameEl || !topMetricsEl || !topbarEl || !appEl) {
        syncTopbarOffset();
        return;
      }
      const isTerminalSection = normalizeSection(currentSection) === 'terminals';
      const hasMetrics = topMetricsEl.children.length > 0 && topMetricsEl.style.display !== 'none';
      frameEl.classList.toggle('topmetrics-pin-ready', isTerminalSection && hasMetrics);
      if (!isTerminalSection || !hasMetrics) {
        syncTopbarOffset();
        return;
      }
      const naturalRect = topMetricsEl.getBoundingClientRect();
      const naturalHeight = Math.ceil(naturalRect.height || topMetricsEl.offsetHeight || 0);
      if (!naturalHeight) {
        syncTopbarOffset();
        return;
      }
      const shouldPin = (window.scrollY || window.pageYOffset || 0) > 0;
      if (shouldPin) {
        const pinnedHost = ensureTopMetricsPinnedHost();
        frameEl.classList.add('topmetrics-fixed');
        frameEl.style.setProperty('--top-metrics-fixed-left', `${Math.round(naturalRect.left)}px`);
        frameEl.style.setProperty('--top-metrics-fixed-width', `${Math.round(naturalRect.width)}px`);
        frameEl.style.setProperty('--top-metrics-height', `${naturalHeight}px`);
        pinnedHost.innerHTML = topMetricsEl.innerHTML;
        pinnedHost.style.left = `${Math.round(naturalRect.left)}px`;
        pinnedHost.style.width = `${Math.round(naturalRect.width)}px`;
        pinnedHost.style.display = 'grid';
        setAppTopPadding(naturalHeight);
      }
      syncTopbarOffset();
    }

    function syncCompactSummaryPinned() {
      const sectionName = normalizeSection(currentSection);
      if (!frameEl || !appEl || sectionName === 'overview') {
        clearCompactSummaryPinnedState();
        syncTopbarOffset();
        return;
      }
      const sectionEl = appEl.querySelector(`.section#${currentSection}`);
      if (!sectionEl) {
        clearCompactSummaryPinnedState();
        syncTopbarOffset();
        return;
      }
      const summaryEl = sectionEl.querySelector(':scope > .section-summary-sticky, :scope > .arp-summary-sticky, :scope > .readonly-diagnostics-root > .section-summary-sticky, :scope > .card > .card-body > .section-summary-sticky');
      if (!summaryEl || !frameEl.classList.contains('scroll-snap-free')) {
        clearCompactSummaryPinnedState();
        syncTopbarOffset();
        return;
      }
      const naturalRect = summaryEl.getBoundingClientRect();
      const naturalHeight = Math.ceil(naturalRect.height || summaryEl.offsetHeight || 0);
      const scrollTop = window.scrollY || window.pageYOffset || 0;
      const summaryDocumentTop = Math.round(scrollTop + naturalRect.top);
      const storedPinStart = compactSummaryPinStartBySection.get(currentSection);
      const pinStart = Number.isFinite(storedPinStart) ? storedPinStart : summaryDocumentTop;
      const shouldPin = naturalHeight > 0 && scrollTop >= Math.max(24, pinStart);
      if (!shouldPin) {
        compactSummaryPinStartBySection.set(currentSection, summaryDocumentTop);
        clearCompactSummaryPinnedState();
        syncTopbarOffset();
        return;
      }
      const pinnedHost = ensureCompactSummaryPinnedHost();
      frameEl.classList.add('section-summary-pinned');
      frameEl.style.setProperty('--section-summary-fixed-left', `${Math.round(naturalRect.left)}px`);
      frameEl.style.setProperty('--section-summary-fixed-width', `${Math.round(naturalRect.width)}px`);
      frameEl.style.setProperty('--section-summary-height', `${naturalHeight}px`);
      pinnedHost.style.left = `${Math.round(naturalRect.left)}px`;
      pinnedHost.style.width = `${Math.round(naturalRect.width)}px`;
      pinnedHost.style.display = 'block';
      const needsCloneRefresh = compactSummaryPinnedSourceState?.el !== summaryEl || pinnedHost.childElementCount === 0;
      if (needsCloneRefresh) {
        restoreCompactSummaryPinnedSourceState();
        const summaryClone = summaryEl.cloneNode(true);
        summaryClone.style.position = 'static';
        summaryClone.style.top = 'auto';
        summaryClone.style.zIndex = 'auto';
        summaryClone.style.margin = '0';
        const readonlyFeatureSticky = summaryEl.classList.contains('readonly-feature-sticky');
        summaryClone.style.pointerEvents = readonlyFeatureSticky ? 'auto' : 'none';
        pinnedHost.style.pointerEvents = readonlyFeatureSticky ? 'auto' : '';
        pinnedHost.innerHTML = '';
        pinnedHost.appendChild(summaryClone);
        compactSummaryPinnedSourceState = {
          el: summaryEl,
          visibility: summaryEl.style.visibility,
          pointerEvents: summaryEl.style.pointerEvents,
          marginBottom: summaryEl.style.marginBottom
        };
      }
      summaryEl.style.visibility = 'hidden';
      summaryEl.style.pointerEvents = 'none';
      summaryEl.style.marginBottom = '0px';
      syncTopbarOffset();
    }

    function syncTopbarOffset() {
      if (!topbarEl) return;
      const compactStickySummary = frameEl
        && (frameEl.classList.contains('page-compact-topbar') || frameEl.classList.contains('arp-compact'))
        && hasCompactStickySummary();
      const topbarHeight = (frameEl?.classList.contains('topmetrics-fixed') || compactStickySummary) ? 0 : topbarEl.offsetHeight;
      document.documentElement.style.setProperty('--topbar-height', `${topbarHeight}px`);
    }

    function applySectionTopbarState() {
      if (!frameEl) return;
      const scrollSnapFree = hasCompactStickySummary();
      frameEl.classList.toggle('scroll-snap-free', scrollSnapFree);
      const compact = false;
      frameEl.classList.toggle('page-compact-topbar', compact);
      frameEl.classList.toggle('arp-compact', compact && currentSection === 'arp');
      syncTopMetricsVisibility();
      syncTopMetricsPinned();
      syncCompactSummaryPinned();
    }

    function syncSectionTopbarState() {
      if (sectionTopbarStateRaf) {
        cancelAnimationFrame(sectionTopbarStateRaf);
        sectionTopbarStateRaf = 0;
      }
      applySectionTopbarState();
    }

    function scheduleSectionTopbarState() {
      if (!frameEl || sectionTopbarStateRaf) return;
      sectionTopbarStateRaf = requestAnimationFrame(() => {
        sectionTopbarStateRaf = 0;
        applySectionTopbarState();
      });
    }

    function buildTopMetrics(snapshot) {
      const o = snapshot.overview || {};
      const interfaces = snapshot.interfaces || [];
      const pppoe = getLogicalWanLines(snapshot);
      const terminals = snapshot.terminals || [];
      const arp = snapshot.arp || { items: [] };
      const dhcp = snapshot.dhcp || { leases: [], pools: [] };
      const connections = snapshot.connections || {};
      const dns = snapshot.dns || {};
      const security = snapshot.security || {};
      const lb = snapshot.loadBalance || {};
      const routes = snapshot.routes || {};
      const logs = snapshot.logs || {};
      const activePppoe = pppoe.filter((row) => row.running).length;
      const activeInterfaces = interfaces.filter((row) => row.running).length;
      const busiestLine = pppoe.slice().sort((a, b) => ((b.upRate + b.downRate) - (a.upRate + a.downRate)))[0];

      switch (currentSection) {
        case 'interfaces':
          return [
            ['在线接口', `${fmtNumber(activeInterfaces)} / ${fmtNumber(interfaces.length)}`],
            ['在线 WAN', `${fmtNumber(activePppoe)} / ${fmtNumber(pppoe.length)}`],
            ['当前最忙线路', busiestLine ? `${escapeHtml(busiestLine.name)} · ${fmtRate((busiestLine.upRate || 0) + (busiestLine.downRate || 0))}` : '-'],
            ['总上行速率', fmtRate(o.uplinkBps)],
            ['总下行速率', fmtRate(o.downlinkBps)]
          ];
        case 'dhcp':
          return [
            ['DHCP 服务器', fmtNumber((dhcp.servers || []).length)],
            ['地址池', fmtNumber((dhcp.pools || []).length)],
            ['绑定租约', fmtNumber((dhcp.leases || []).filter((row) => row.status === 'bound').length)],
            ['静态分配', fmtNumber((dhcp.leases || []).filter((row) => row.static).length)]
          ];
        case 'terminals':
          return [
            ['在线终端', fmtNumber(terminals.length)],
            ['ARP 条目', fmtNumber((arp.items || []).length)],
            ['DHCP 地址池', fmtNumber((dhcp.pools || []).length)],
            ['DHCP 租约', fmtNumber((dhcp.leases || []).length)]
          ];
        case 'connections':
          {
            const hasProtocolTopMetrics = [connections.tcp, connections.udp].every((value) => Number.isFinite(Number(value)));
            return [
              ['连接总数', fmtCompact(connections.total)],
              ['活跃会话', fmtNumber((connections.active || []).length)],
              ['单 IP 排行', fmtNumber((connections.topIps || []).length)],
              ['明细刷新', connections.detailUpdatedAt ? escapeHtml(connections.detailUpdatedAt) : '等待采集'],
              ['协议拆分', hasProtocolTopMetrics ? `${fmtCompact(connections.tcp)} / ${fmtCompact(connections.udp)}` : '当前未采集']
            ];
          }
        case 'trafficLoad':
          {
            const activeTrafficTerminals = (terminals || []).filter((row) => Number(row.upRate || 0) + Number(row.downRate || 0) > 0).length;
            return [
              ['在线 WAN', `${fmtNumber(activePppoe)} / ${fmtNumber(pppoe.length)}`],
              ['总上行速率', fmtRate(o.uplinkBps)],
              ['总下行速率', fmtRate(o.downlinkBps)],
              ['当前最忙线路', busiestLine ? `${escapeHtml(busiestLine.name)} · ${fmtRate((busiestLine.upRate || 0) + (busiestLine.downRate || 0))}` : '-'],
              ['有流量终端', fmtNumber(activeTrafficTerminals)]
            ];
          }
        case 'loadAudit':
          return [
            ['CPU 使用率', fmtPercent(o.cpuLoad)],
            ['内存占用率', fmtPercent(o.memoryUsage)],
            ['磁盘占用率', fmtPercent(o.diskUsage)],
            ['系统状态', tag(o.systemLoadLevel === 'danger' ? '高压' : o.systemLoadLevel === 'warning' ? '预警' : '正常', o.systemLoadLevel)],
            ['连接总数', fmtCompact(connections.total)]
          ];
        case 'lineStatus':
          return [
            ['在线 WAN', `${fmtNumber(activePppoe)} / ${fmtNumber(pppoe.length)}`],
            ['在线接口', `${fmtNumber(activeInterfaces)} / ${fmtNumber(interfaces.length)}`],
            ['异常线路', fmtNumber(pppoe.filter((row) => !row.running || !(row.addresses || []).length).length)],
            ['IPv6 接口', fmtNumber(interfaces.filter((row) => (row.ips || []).some((ip) => String(ip).includes(':'))).length)]
          ];
        case 'dns':
          return [
            ['DNS 状态', dns.running ? '启用' : '未启用'],
            ['上游 DNS', fmtNumber((dns.servers || []).length)],
            ['缓存已用', dns.cacheUsed ? fmtBytes(dns.cacheUsed) : '未提供'],
            ['静态规则', fmtNumber((dns.forwardRules || []).length)]
          ];
        case 'routes':
          return [
            ['静态路由', fmtNumber(routes.staticCount)],
            ['活动静态路由', fmtNumber(routes.activeStaticCount)],
            ['默认路由', fmtNumber(routes.defaultCount)],
            ['路由表', fmtNumber(routes.tableCount)]
          ];
        case 'security':
          return [
            ['Filter 规则', fmtNumber((security.filters || []).length)],
            ['地址名单', fmtNumber((security.addressLists || []).length)],
            ['异常告警', fmtNumber((security.alerts || []).length)],
            ['ACL 状态', (security.filters || []).length ? '已读取' : '未读取']
          ];
        case 'arp':
          return [
            ['ARP 条目', fmtNumber((arp.items || []).length)],
            ['ARP 告警', fmtNumber((arp.alerts || []).length)],
            ['在线终端', fmtNumber(terminals.length)],
            ['实时流量终端', fmtNumber((terminals || []).filter((row) => Number(row.upRate || 0) + Number(row.downRate || 0) > 0).length)]
          ];
        case 'trafficAudit':
          return [
            ['连接总数', fmtCompact(connections.total)],
            ['活跃会话', fmtNumber((connections.active || []).length)],
            ['单 IP 排行', fmtNumber((connections.topIps || []).length)],
            ['审计刷新', connections.detailUpdatedAt ? escapeHtml(connections.detailUpdatedAt) : '等待采集']
          ];
        case 'balance':
          return [
            ['活动线路', fmtNumber(lb.activeLines)],
            ['默认路由', fmtNumber((lb.defaultRoutes || []).length)],
            ['Mangle 规则', fmtNumber((lb.mangleRules || []).length)],
            ['策略路由', fmtNumber((lb.routingRules || []).length)]
          ];
        case 'logs':
        case 'serviceLogs':
          return [
            ['全部日志', fmtNumber((logs.all || []).length)],
            ['系统日志', fmtNumber((logs.system || []).length)],
            ['Firewall', fmtNumber((logs.firewall || []).length)],
            ['DHCP / DNS', `${fmtNumber((logs.dhcp || []).length)} / ${fmtNumber((logs.dns || []).length)}`]
          ];
        case 'overview':
        default:
          return [];
      }
    }

    function updateRefreshMeta() {
      if (!refreshModeTextEl || !nextRefreshTextEl) return;
      if (IS_TEST_MODE) {
        refreshModeTextEl.textContent = '测试快照';
        nextRefreshTextEl.textContent = '浏览器静态验收';
        return;
      }
      if (pendingSnapshot && hasInteractionLock()) {
        refreshModeTextEl.textContent = '新数据已获取';
        nextRefreshTextEl.textContent = '当前正在查看内容，暂缓覆盖页面';
        return;
      }
      refreshModeTextEl.textContent = refreshTriggerText(lastRefreshMode);
      if (!nextRefreshAt) {
        nextRefreshTextEl.textContent = '后台秒级采集';
        return;
      }
      const remainMs = Math.max(0, nextRefreshAt - Date.now());
      nextRefreshTextEl.textContent = remainMs < 1000 ? '即将采集新数据' : `${Math.ceil(remainMs / 1000)} 秒后采集`;
    }

    function renderTopMetrics(snapshot) {
      syncPanelProfileState(snapshot);
      const metrics = buildTopMetrics(snapshot);
      const meta = pageMeta[currentSection];
      try {
        const tier = getSnapshotLineLayoutTier(snapshot);
        const lineCount = getLogicalWanLines(snapshot).length;
        document.body.dataset.wanTier = tier;
        document.body.dataset.wanLines = String(Math.max(0, Number(lineCount || 0)));
      } catch (error) {
        // Best effort: UI density hints should never block rendering.
      }
      topMetricsEl.innerHTML = metrics.length ? metrics.map(([k, v]) => `<div class="status-pill"><div class="status-k">${k}</div><div class="status-v">${v}</div></div>`).join('') : '';
      pageTitleEl.textContent = meta.title;
      setPageSubtitle('');
      updateTextEl.textContent = snapshot.status === 'ok' ? `最后更新 ${snapshot.updatedAt}` : `采集异常 ${snapshot.updatedAt || ''}`;
      healthDotEl.className = `dot ${snapshot.status === 'ok' ? '' : 'danger'}`;
      updateRefreshMeta();
      syncSectionTopbarState();
    }

    function overviewRankPollText(snapshot) {
      const seconds = Number(snapshot?.meta?.pollSeconds || REALTIME_REFRESH_SECONDS || 1);
      return `每 ${escapeHtml(String(seconds))}s 自动刷新`;

    function buildOverviewRankData(snapshot) {
      const connections = snapshot?.connections || {};
      const terminals = snapshot?.terminals || [];
      const interfaces = snapshot?.interfaces || [];
      const terminalSource = terminals.length ? terminals : (connections.topIps || []);
      const rankedTerminals = terminalSource
        .slice()
        .sort((a, b) => totalTrafficRate(b) - totalTrafficRate(a));
      const terminalRows = rankedTerminals.map((row) => {
        const name = displayNameFor(row, row.ip || '-').displayName;
        return `<tr>
          <td><b>${escapeHtml(name)}</b><div class="subtle">${escapeHtml(row.ip || '-')}</div></td>
          <td>${fmtRate(row.upRate)}</td>
          <td>${fmtRate(row.downRate)}</td>
          <td>${fmtNumber(row.connections || 0)}</td>
        </tr>`;
      }).join('');
      const rankedInterfaces = interfaces
        .slice()
        .sort((a, b) => totalTrafficRate(b, 'txRate', 'rxRate') - totalTrafficRate(a, 'txRate', 'rxRate'));
      const interfaceRows = rankedInterfaces.map((row) => `<tr>
        <td><b>${escapeHtml(row.name)}</b><div class="subtle">${escapeHtml(row.type || '-')}</div></td>
        <td>${tag(row.role || '-', row.role === 'WAN' ? 'info' : 'ok')}</td>
        <td>${row.disabled ? tag('停用', 'warn') : row.running ? tag('在线', 'ok') : tag('离线', 'danger')}</td>
        <td>${fmtRate(row.txRate)}</td>
        <td>${fmtRate(row.rxRate)}</td>
      </tr>`).join('');
      return { rankedTerminals, rankedInterfaces, terminalRows, interfaceRows };
    }

    function renderOverviewRankGrid(snapshot) {

    function refreshOverviewRankGrid(snapshot) {
      if (!appEl || !snapshot) return false;
      const overviewEl = appEl.querySelector('#overview');
      const currentGrid = overviewEl?.querySelector('[data-overview-rank-grid]');
      if (!currentGrid) return false;
      const scrollState = {};
      currentGrid.querySelectorAll('[data-overview-rank-card]').forEach((card) => {
        const key = card.getAttribute('data-overview-rank-card');
        const scroller = card.querySelector('.ops-table-wrap');
        if (key && scroller) scrollState[key] = scroller.scrollTop;
      });
      currentGrid.outerHTML = renderOverviewRankGrid(snapshot);
      const nextGrid = overviewEl.querySelector('[data-overview-rank-grid]');
      Object.entries(scrollState).forEach(([key, top]) => {
        const scroller = nextGrid?.querySelector(`[data-overview-rank-card="${key}"] .ops-table-wrap`);
        if (scroller) scroller.scrollTop = top;
      });
      return Boolean(nextGrid);
    }

    function getOverviewLineColumns(count) {
      const total = Math.max(0, Number(count || 0));
      if (total <= 1) return 1;
      if (total === 2) return 2;
      if (total === 3) return 3;
      if (total === 4) return 2;
      if (total <= 6) return 3;
      if (total <= 8) return 4;
      if (total === 9) return 3;
      return 5;
    }

    function getOverviewQuickColumns(count) {
      const total = Math.max(0, Number(count || 0));
      if (total <= 0) return 1;
      if (total <= 4) return 2;
      if (total <= 9) return 3;
      return 4;
    }

    function renderOverviewLineRoster(rows) {
      const lines = Array.isArray(rows) ? rows : [];
      if (!lines.length) return emptyBlock('当前未采集到 WAN 线路');
      const totalRate = Math.max(1, lines.reduce((sum, row) => sum + totalTrafficRate(row), 0));
      const columnCount = getOverviewLineColumns(lines.length);
      return `<div class="ops-home-line-roster" style="grid-template-columns:repeat(${columnCount}, minmax(0, 1fr))">${lines.map((row) => {
        const totalBytes = Number(row.txBytes || 0) + Number(row.rxBytes || 0);
        const routeCount = (row.routes || []).filter((route) => route.active).length;
        const addressCount = (row.addresses || []).length;
        const share = Math.max(0, Math.min(100, (totalTrafficRate(row) / totalRate) * 100));
        const stateLabel = !row.running ? '拨号中断' : !addressCount ? '缺地址' : !routeCount ? '无活动默认' : '出口闭环';
        const stateClass = stateLabel === '出口闭环' ? 'is-up' : 'is-down';
        const stateColor = stateLabel === '出口闭环' ? '#245bff' : stateLabel === '拨号中断' ? '#ef5350' : '#ff9800';
        return `
          <div class="ops-home-line-card">
            <div class="ops-home-line-head">
              <div class="ops-home-line-title">
                <strong>${escapeHtml(row.name)}</strong>
                <span>${escapeHtml(row.access || row.parent || 'WAN')} · 活动路由 ${fmtNumber(routeCount)}</span>
              </div>
              <div class="ops-home-line-badge ${stateClass}">${stateLabel}</div>
            </div>
            <div class="ops-home-line-progress">${progress(Math.max(4, share), stateColor)}</div>
            <div class="ops-home-line-stats">
              <div><label>上行</label><b>${fmtRate(row.upRate)}</b></div>
              <div><label>下行</label><b>${fmtRate(row.downRate)}</b></div>
              <div><label>累计</label><b>${fmtBytes(totalBytes)}</b></div>
              <div><label>占比</label><b>${share.toFixed(1)}%</b></div>
            </div>
          </div>`;
      }).join('')}</div>`;
    }

    function resolveOverviewWanSelection(lines) {
      const rows = Array.isArray(lines) ? lines : [];
      const selected = rows.find((row) => row.name === currentOverviewWanLine) || null;
      if (currentOverviewWanLine !== 'aggregate' && !selected) {
        currentOverviewWanLine = 'aggregate';
      }
      return { key: selected ? selected.name : 'aggregate', line: selected };
    }

    function renderOverviewWanLineSwitch(lines, selectedKey) {
      const rows = Array.isArray(lines) ? lines : [];
      if (rows.length <= 1) {
        const onlyLine = rows[0];
        return onlyLine
          ? `<div class="ik-wan-switch" data-overview-wan-switch><span class="ik-wan-switch-label">当前线路</span><div class="ik-wan-switch-static">${escapeHtml(onlyLine.name)} · ${onlyLine.running ? '在线' : '离线'} · ${fmtRate(totalTrafficRate(onlyLine))}</div></div>`
          : '';
      }
      const lineOptions = rows.map((row) => {
        const selected = row.name === selectedKey ? ' selected' : '';
        const state = row.running ? '在线' : '离线';
        return `<option value="${escapeHtml(row.name)}"${selected}>${escapeHtml(row.name)} · ${state} · ${fmtRate(totalTrafficRate(row))}</option>`;
      }).join('');
      const disabled = rows.length ? '' : ' disabled';
      return `<div class="ik-wan-switch" data-overview-wan-switch>
        <span class="ik-wan-switch-label">切换线路</span>
        <select class="ik-wan-line-select" data-overview-wan-line aria-label="切换 WAN 线路"${disabled}>
          <option value="aggregate"${selectedKey === 'aggregate' ? ' selected' : ''}>聚合全部线路</option>
          ${lineOptions}
        </select>
      </div>`;
    }

        if (isDerivedInterface(row)) issueParts.push('逻辑接口降权');
        return {
          name: row.name,
          type: row.type || label,
          level,
          running: isOnline,
          upRate: Number(row.txRate || 0),
          downRate: Number(row.rxRate || 0),

          rxBytes: Number(row.rxBytes || 0),

      const tabs = `

      let body = '';
      if (currentTerminalView === 'ipv6') {
        body = `

          ${metricCard('磁盘占用率', fmtPercent(o.diskUsage), `已用 ${fmtBytes(o.diskUsedBytes)}`, `总量 ${fmtBytes(o.diskTotalBytes)}`)}

          <td>${escapeHtml(item.name)}</td>
          <td>${escapeHtml(item.via)}</td>
          <td>${escapeHtml(item.address)}</td>
          <td>${escapeHtml(item.when)}</td>

        <div class="grid-2" style="margin-top:12px">

            {k:'连接总数', v: fmtCompact(snapshot.connections.total)},

        </div>`;
      return section(sectionTitle, sectionId, sectionTip, `
        ${loadCards}

    function renderDns(snapshot) {
      const dns = snapshot.dns || {};
      const visibleRuleCount = (dns.forwardRules || []).length;
      const totalRuleCount = Number(dns.forwardRuleCount || visibleRuleCount);
      const disabledRuleLabel = dns.forwardRuleSample
        ? `示例中停用 ${fmtNumber(dns.disabledForwardRuleCount || 0)} 条`
        : `停用 ${fmtNumber(dns.disabledForwardRuleCount || 0)} 条`;
      const ruleEmptyText = totalRuleCount
        ? `已检测到 ${fmtNumber(totalRuleCount)} 条规则，当前未读取到可展示的规则明细`
        : '暂无 DNS 静态规则';
      const enabledNdCount = (dns.ipv6Nd || []).filter((row) => row.advertiseDns).length;
      const boundPrefixClients = (dns.ipv6DhcpClients || []).filter((row) => row.status === 'bound').length;
      const listText = (values, fallback = '-') => (values && values.length ? values.map(escapeHtml).join('<br>') : fallback);
      const ndRows = (dns.ipv6Nd || []).map((row) => `
        <tr>
          <td>${escapeHtml(row.interface)}</td>
          <td>${row.advertiseDns ? tag('开启', 'ok') : tag('关闭', 'warn')}</td>
          <td>${listText(row.dnsServers, '未单独指定')}</td>
          <td>${row.managed ? tag('开启', 'info') : tag('关闭', 'ok')}</td>
          <td>${row.otherConfig ? tag('开启', 'info') : tag('关闭', 'ok')}</td>
          <td>${escapeHtml(row.raLifetime || '-')}</td>
        </tr>`);
      const dhcpClientRows = (dns.ipv6DhcpClients || []).map((row) => `
        <tr>
          <td>${escapeHtml(row.interface)}</td>
          <td>${tag(row.status || '-', row.status === 'bound' ? 'ok' : 'warn')}</td>
          <td>${escapeHtml(row.pool || '-')}</td>
          <td>${escapeHtml(row.prefix || '-')}</td>
          <td>${row.usePeerDns ? tag('开启', 'ok') : tag('关闭', 'info')}</td>
          <td>${row.addDefaultRoute ? `开启 · distance ${escapeHtml(row.defaultRouteDistance || '-')}` : '关闭'}</td>
        </tr>`);
      const ruleRows = (dns.forwardRules || []).map((row) => `
        <tr>
          <td>${escapeHtml(row.name)}</td>
          <td>${tag(row.type || '-', row.disabled ? 'warn' : 'info')}</td>
          <td>${escapeHtml(row.value)}</td>
          <td>${escapeHtml(row.ttl || '-')}</td>
          <td>${row.disabled ? tag('停用', 'warn') : tag('启用', 'ok')}</td>
          <td>${escapeHtml(row.comment || '-')}</td>
        </tr>`);
      return section('DNS 监控中心', 'dns', 'DNS 状态、上游参数、IPv6 广播与静态规则全部归入 DNS 监控中心', `
        <div class="grid-4">
          ${metricCard('DNS 服务状态', tag(dns.running ? '启用' : '未启用', dns.running ? 'ok' : 'danger'), `上游 DNS ${fmtNumber((dns.servers || []).length)} 个`, dns.dohServer ? 'DoH 已配置' : 'DoH 未配置')}
          ${metricCard('静态规则总数', fmtNumber(totalRuleCount), `当前展示 ${fmtNumber(visibleRuleCount)} 条`, disabledRuleLabel)}
          ${metricCard('IPv6 ND 广播', fmtNumber(enabledNdCount), `配置接口 ${fmtNumber((dns.ipv6Nd || []).length)} 个`, '')}
          ${metricCard('IPv6 Prefix 客户端', fmtNumber(boundPrefixClients), `DHCPv6 Client ${fmtNumber((dns.ipv6DhcpClients || []).length)} 个`, '')}
        </div>
        <div class="grid-2" style="margin-top:12px">
          <div class="card"><div class="card-head"><div class="card-title">DNS 上游与 DoH 参数</div><div class="subtle">仅展示 RouterOS 实际可读参数</div></div><div class="card-body">${infoGrid([
            {k:'上游 DNS', v: listText(dns.servers, '未读取到')},
            {k:'DoH 服务器', v: dns.dohServer ? escapeHtml(dns.dohServer) : '未配置'},
            {k:'DoH 证书校验', v: dns.dohServer ? (dns.verifyDohCert ? tag('开启', 'ok') : tag('关闭', 'warn')) : '-'},
            {k:'缓存占用', v: `${fmtBytes(dns.cacheUsed || 0)} / ${fmtBytes(dns.cacheSize || 0)}`}
          ])}</div></div>
          <div class="card"><div class="card-head"><div class="card-title">IPv6 DNS / RA 概览</div><div class="subtle">来自 ND 与 DHCPv6 Client</div></div><div class="card-body">${infoGrid([
            {k:'ND 广播接口', v: fmtNumber((dns.ipv6Nd || []).length)},
            {k:'已开启广播 DNS', v: fmtNumber(enabledNdCount)},
            {k:'Prefix 已绑定', v: fmtNumber(boundPrefixClients)},
            {k:'Peer DNS 客户端', v: fmtNumber((dns.ipv6DhcpClients || []).filter((row) => row.usePeerDns).length)}
          ])}</div></div>
        </div>
        <div class="grid-2" style="margin-top:12px">
          <div class="card"><div class="card-head"><div class="card-title">IPv6 ND 广播</div><div class="subtle">${fmtNumber((dns.ipv6Nd || []).length)} 个接口</div></div><div class="card-body">${table(['接口', '广播 DNS', '显式 DNS', 'Managed', 'Other Config', 'RA 生命周期'], ndRows, '当前未读取到 IPv6 ND 广播配置')}</div></div>
          <div class="card"><div class="card-head"><div class="card-title">IPv6 DHCP Client / Prefix</div><div class="subtle">${fmtNumber((dns.ipv6DhcpClients || []).length)} 个客户端</div></div><div class="card-body">${table(['接口', '状态', '前缀池', '前缀 / 地址', 'Peer DNS', '默认路由'], dhcpClientRows, '当前未读取到 IPv6 DHCP Client')}</div></div>
        </div>
        <div class="card" style="margin-top:12px"><div class="card-head"><div class="card-title">DNS 静态规则 / 转发规则</div><div class="subtle">当前展示 ${fmtNumber(visibleRuleCount)} / ${fmtNumber(totalRuleCount)} 条</div></div><div class="card-body">${table(['名称 / 正则', '类型', '目标值', 'TTL', '状态', '备注'], ruleRows, ruleEmptyText)}</div></div>`);
    }

          <div class="card"><div class="card-head"><div class="card-title">黑白名单与地址集</div><div class="subtle">仅读取已存在条目</div></div><div class="card-body">${table(['列表名', '类别', '地址', '超时', '备注'], listRows, '暂无地址名单数据')}</div></div>
        </div>`);

    function renderBalance(snapshot) {
      const lb = snapshot.loadBalance || {};
      const wanLines = getLogicalWanLines(snapshot);
      const lineTier = getSnapshotLineLayoutTier(snapshot);
      const wanScenario = getWanScenarioProfile(snapshot);
      const lineByName = Object.fromEntries(wanLines.map((row) => [row.name, row]));
      const distributionRows = sortPppoeNamedRows(
        (lb.distribution || []).length
          ? lb.distribution
          : wanLines.map((row) => ({
            name: row.name,
            share: wanLines.length === 1 ? 100 : 0,
            upRate: row.upRate,
            downRate: row.downRate
          }))
      ).map((row) => {
        const line = lineByName[row.name] || {};
        return {
          ...row,
          line,
          share: Number(row.share || 0),
          upRate: Number(row.upRate ?? line.upRate ?? 0),
          downRate: Number(row.downRate ?? line.downRate ?? 0),
          access: line.access || line.parent || '-',
          running: Boolean(line.running)
        };
      });
      const distribution = !distributionRows.length
        ? emptyBlock('当前未形成线路流量分布')
        : wanScenario.count === 1
          ? `<div class="chart-box">
              <div class="chart-label"><span>${escapeHtml(distributionRows[0].name)}</span><span>${distributionRows[0].running ? '默认出口在线' : '默认出口离线'}</span></div>
              ${infoGrid([
                { k: '部署档位', v: escapeHtml(wanScenario.label) },
                { k: '接入方式', v: escapeHtml(distributionRows[0].access) },
                { k: '实时上行', v: fmtRate(distributionRows[0].upRate) },
                { k: '实时下行', v: fmtRate(distributionRows[0].downRate) },
                { k: '默认路由', v: fmtNumber((lb.defaultRoutes || []).filter((row) => row.active).length) },
                { k: 'PCC 状态', v: lb.pccDetected ? '已检测到' : '未检测到' }
              ])}
            </div>`
          : lineTier === 'dense'
            ? compactTable(
              ['线路', '状态', '接入', '占比', '实时上行', '实时下行'],
              distributionRows.map((row) => `
                <tr>
                  <td>${escapeHtml(row.name)}</td>
                  <td>${row.running ? tag('在线', 'ok') : tag('离线', 'danger')}</td>
                  <td>${escapeHtml(row.access)}</td>
                  <td>${Number(row.share || 0).toFixed(1)}%</td>
                  <td>${fmtRate(row.upRate)}</td>
                  <td>${fmtRate(row.downRate)}</td>
                </tr>`),
              '当前未形成线路流量分布'
            )
            : distributionRows.map((row) => `<div class="line-bar"><div class="line-name">${escapeHtml(row.name)}</div>${progress(row.share)}<div class="line-share">${Number(row.share || 0).toFixed(1)}%</div></div>`).join('');

    function renderLogs(snapshot, config = {}) {
