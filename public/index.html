      setPageSubtitle('');
    }

    const FIXED_PPPOE_LINE_ORDER = ['pppoe-out10', 'pppoe-out20', 'pppoe-out30', 'pppoe-out40', 'pppoe-out50', 'pppoe-out60', 'pppoe-out70', 'pppoe-out80'];
    const FIXED_PPPOE_LINE_ORDER_MAP = new Map(FIXED_PPPOE_LINE_ORDER.map((name, index) => [name, index]));

    function getPppoeDisplayOrder(name) {
      const normalized = String(name || '').trim().toLowerCase();
      if (FIXED_PPPOE_LINE_ORDER_MAP.has(normalized)) {
        return FIXED_PPPOE_LINE_ORDER_MAP.get(normalized);
      }
      const suffixMatch = normalized.match(/pppoe-out(\d+)$/i);
      return suffixMatch ? FIXED_PPPOE_LINE_ORDER.length + Number(suffixMatch[1]) : Number.POSITIVE_INFINITY;
    }

    function sortPppoeNamedRows(rows) {
      return (rows || []).slice().sort((a, b) => {
        const orderA = getPppoeDisplayOrder(a?.name);
        const orderB = getPppoeDisplayOrder(b?.name);
        if (orderA !== orderB) return orderA - orderB;
        return String(a?.name || '').localeCompare(String(b?.name || ''), 'zh-CN', { numeric: true, sensitivity: 'base' });
      });
    }

    function getWanRows(snapshot = {}) {
      const merged = Array.isArray(snapshot.wan) && snapshot.wan.length ? snapshot.wan : (snapshot.pppoe || []);
      return sortPppoeNamedRows(merged);
    }

    function getLineTrendRows(pppoe) {
      return sortPppoeNamedRows(
        (pppoe || []).filter((item) => {
          const upCount = rateSeriesStats(item.history?.up || []).count;
          const downCount = rateSeriesStats(item.history?.down || []).count;
          return upCount >= 2 || downCount >= 2;
        })
      ).slice(0, 8);
    }

    function renderLineTrendGrid(rows, options = {}) {
      const colors = options.colors || ['#165dff', '#16c67a'];
      const emptyText = options.emptyText || '当前未读取到可展示的线路趋势';
      if (!rows.length) return emptyBlock(emptyText);
      return `<div class="line-trend-grid">${rows.map((item) => `
        ${aggregateRateTrendCard(item.name, [item.history.up, item.history.down], {
          colors,
          current: [fmtRate(item.upRate), fmtRate(item.downRate)].join(' / '),
          meta: 'TX / RX'
        })}`).join('')}</div>`;
    }

    function recordItem(label, value) {
      return `<div class="record-item"><div class="record-label">${escapeHtml(label)}</div><div class="record-value">${value || '-'}</div></div>`;
    }

    function table(headers, rows, emptyText) {
      const body = Array.isArray(rows) ? rows.join('') : String(rows || '');
      if (!body.trim()) return emptyBlock(emptyText);
      const parser = new DOMParser();
      const doc = parser.parseFromString(`<table><tbody>${body}</tbody></table>`, 'text/html');
      const trList = Array.from(doc.querySelectorAll('tbody > tr'));
      if (!trList.length) return emptyBlock(emptyText);
      const cards = trList.map((tr, rowIndex) => {
        const cells = Array.from(tr.children).map((cell, cellIndex) => ({
          label: headers[cellIndex] || `字段 ${cellIndex + 1}`,
          value: cell.innerHTML && cell.innerHTML.trim() ? cell.innerHTML.trim() : '-'
        }));
        if (!cells.length) return '';
        const [primary, ...rest] = cells;
        return `
          <article class="record-card">
            <div class="record-head">
              <span class="record-index">${fmtNumber(rowIndex + 1)}</span>
              <div class="record-title">
                <div class="record-label">${escapeHtml(primary.label)}</div>
                <div class="record-value">${primary.value}</div>
              </div>
            </div>
            ${rest.length ? `<div class="record-grid">${rest.map((item) => recordItem(item.label, item.value)).join('')}</div>` : ''}
          </article>`;
      }).join('');
      return cards ? `<div class="record-list">${cards}</div>` : emptyBlock(emptyText);
    }

    function compactTable(headers, rows, emptyText, className = 'ops-compact-table') {
      const body = Array.isArray(rows) ? rows.join('') : String(rows || '');
      if (!body.trim()) return emptyBlock(emptyText);
      const extraClasses = String(className || '')
        .split(/\s+/)
        .filter((name) => /^[a-z0-9_-]+$/i.test(name))
        .join(' ');
      const headerHtml = headers.map((header) => `<th>${escapeHtml(header)}</th>`).join('');
      return `<div class="ops-table-wrap"><table class="ops-table ${extraClasses}"><thead><tr>${headerHtml}</tr></thead><tbody>${body}</tbody></table></div>`;
    }

    function infoGrid(items) {
      return `<div class="info-list">${items.map((item) => `<div class="info-item"><div class="info-k">${escapeHtml(item.k)}</div><div class="info-v">${item.v}</div></div>`).join('')}</div>`;
    }

    function section(title, id, tip, body) {
      return `<section class="section" id="${id}"><div class="section-head"><div class="section-title">${title}</div><div class="section-tip">${tip || ''}</div></div>${body}</section>`;
    }

    function metricCard(label, value, footA, footB) {
      return `<div class="card metric-card"><div class="metric-label">${escapeHtml(label)}</div><div class="metric-value">${value}</div><div class="metric-foot"><span>${footA || ''}</span><span>${footB || ''}</span></div></div>`;
    }

    function findCompactSummaryGrid(sectionEl) {
      if (!sectionEl || !compactTopbarSections.has(currentSection)) return null;
      if (sectionEl.querySelector(':scope > .arp-summary-sticky, :scope > .section-summary-sticky, :scope > .card > .card-body > .section-summary-sticky')) {
        return null;
      }
      const selectors = [
        ':scope > .grid-4',
        ':scope > .card > .card-body > .grid-4'
      ];
      for (const selector of selectors) {
        const candidate = sectionEl.querySelector(selector);
        if (candidate) return candidate;
      }
      return null;
    }

    function prepareCompactSection() {
      if (!appEl) return;
      const sectionEl = appEl.querySelector(`.section#${currentSection}`);
      if (!sectionEl) return;
      const summaryGrid = findCompactSummaryGrid(sectionEl);
      if (!summaryGrid || summaryGrid.closest('.section-summary-sticky')) return;
      const wrapper = document.createElement('div');
      wrapper.className = 'section-summary-sticky';
      summaryGrid.parentNode.insertBefore(wrapper, summaryGrid);
      wrapper.appendChild(summaryGrid);
    }

    function hasCompactStickySummary() {
      return Boolean(
        compactTopbarSections.has(currentSection)
        && appEl
        && appEl.querySelector(`.section#${currentSection} .section-summary-sticky, .section#${currentSection} .arp-summary-sticky`)
      );
    }

    function syncTopMetricsVisibility() {
      if (!topMetricsEl) return;
      const hiddenForOverview = normalizeSection(currentSection) === 'overview';
      topMetricsEl.style.display = hiddenForOverview || hasCompactStickySummary() ? 'none' : '';
    }

    function ensureTopMetricsPinnedHost() {
      if (topMetricsPinnedHost && document.body.contains(topMetricsPinnedHost)) {
        return topMetricsPinnedHost;
      }
      topMetricsPinnedHost = document.createElement('div');
      topMetricsPinnedHost.id = 'topMetricsPinnedHost';
      topMetricsPinnedHost.className = 'status-strip topmetrics-fixed-host';
      topMetricsPinnedHost.setAttribute('aria-hidden', 'true');
      document.body.appendChild(topMetricsPinnedHost);
      return topMetricsPinnedHost;
    }

    function ensureCompactSummaryPinnedHost() {
      if (compactSummaryPinnedHost && document.body.contains(compactSummaryPinnedHost)) {
        return compactSummaryPinnedHost;
      }
      compactSummaryPinnedHost = document.createElement('div');
      compactSummaryPinnedHost.id = 'compactSummaryPinnedHost';
      compactSummaryPinnedHost.className = 'section-summary-fixed-host';
      compactSummaryPinnedHost.setAttribute('aria-hidden', 'true');
      document.body.appendChild(compactSummaryPinnedHost);
      return compactSummaryPinnedHost;
    }

    function setAppTopPadding(pixels) {
      if (!appEl) return;
      const nextPixels = Number(pixels);
      const nextValue = Number.isFinite(nextPixels) && nextPixels > 0 ? `${Math.ceil(nextPixels)}px` : '';
      if (appEl.style.paddingTop !== nextValue) {
        appEl.style.paddingTop = nextValue;
      }
    }

    function restoreCompactSummaryPinnedSourceState() {
      if (!compactSummaryPinnedSourceState?.el) {
        compactSummaryPinnedSourceState = null;
        return;
      }
      compactSummaryPinnedSourceState.el.style.visibility = compactSummaryPinnedSourceState.visibility;
      compactSummaryPinnedSourceState.el.style.pointerEvents = compactSummaryPinnedSourceState.pointerEvents;
      compactSummaryPinnedSourceState.el.style.marginBottom = compactSummaryPinnedSourceState.marginBottom;
      compactSummaryPinnedSourceState = null;
    }

    function clearTopMetricsPinnedState() {
      if (!frameEl) return;
      const hadPinnedTopMetrics = frameEl.classList.contains('topmetrics-fixed');
      frameEl.classList.remove('topmetrics-fixed');
      frameEl.style.removeProperty('--top-metrics-fixed-left');
      frameEl.style.removeProperty('--top-metrics-fixed-width');
      frameEl.style.removeProperty('--top-metrics-height');
      const pinnedHost = ensureTopMetricsPinnedHost();
      pinnedHost.style.display = 'none';
      pinnedHost.style.left = '';
      pinnedHost.style.width = '';
      pinnedHost.style.pointerEvents = '';
      pinnedHost.innerHTML = '';
      if (hadPinnedTopMetrics && !frameEl.classList.contains('section-summary-pinned')) {
        setAppTopPadding(0);
      }
    }

    function clearCompactSummaryPinnedState() {
      if (!frameEl) return;
      restoreCompactSummaryPinnedSourceState();
      frameEl.classList.remove('section-summary-fixed', 'section-summary-pinned');
      frameEl.style.removeProperty('--section-summary-fixed-left');
      frameEl.style.removeProperty('--section-summary-fixed-width');
      frameEl.style.removeProperty('--section-summary-height');
      const pinnedHost = ensureCompactSummaryPinnedHost();
      pinnedHost.style.display = 'none';
      pinnedHost.style.left = '';
      pinnedHost.style.width = '';
      pinnedHost.innerHTML = '';
    }

    function syncTopMetricsPinned() {
      clearTopMetricsPinnedState();
      if (!frameEl || !topMetricsEl || !topbarEl || !appEl) {
        syncTopbarOffset();
        return;
      }
      const isTerminalSection = normalizeSection(currentSection) === 'terminals';
      const hasMetrics = topMetricsEl.children.length > 0 && topMetricsEl.style.display !== 'none';
      frameEl.classList.toggle('topmetrics-pin-ready', isTerminalSection && hasMetrics);
      if (!isTerminalSection || !hasMetrics) {
        syncTopbarOffset();
        return;
      }
      const naturalRect = topMetricsEl.getBoundingClientRect();
      const naturalHeight = Math.ceil(naturalRect.height || topMetricsEl.offsetHeight || 0);
      if (!naturalHeight) {
        syncTopbarOffset();
        return;
      }
      const shouldPin = (window.scrollY || window.pageYOffset || 0) > 0;
      if (shouldPin) {
        const pinnedHost = ensureTopMetricsPinnedHost();
        frameEl.classList.add('topmetrics-fixed');
        frameEl.style.setProperty('--top-metrics-fixed-left', `${Math.round(naturalRect.left)}px`);
        frameEl.style.setProperty('--top-metrics-fixed-width', `${Math.round(naturalRect.width)}px`);
        frameEl.style.setProperty('--top-metrics-height', `${naturalHeight}px`);
        pinnedHost.innerHTML = topMetricsEl.innerHTML;
        pinnedHost.style.left = `${Math.round(naturalRect.left)}px`;
        pinnedHost.style.width = `${Math.round(naturalRect.width)}px`;
        pinnedHost.style.display = 'grid';
        setAppTopPadding(naturalHeight);
      }
      syncTopbarOffset();
    }

    function syncCompactSummaryPinned() {
      const sectionName = normalizeSection(currentSection);
      if (!frameEl || !appEl || sectionName === 'overview') {
        clearCompactSummaryPinnedState();
        syncTopbarOffset();
        return;
      }
      const sectionEl = appEl.querySelector(`.section#${currentSection}`);
      if (!sectionEl) {
        clearCompactSummaryPinnedState();
        syncTopbarOffset();
        return;
      }
      const summaryEl = sectionEl.querySelector(':scope > .section-summary-sticky, :scope > .arp-summary-sticky, :scope > .readonly-diagnostics-root > .section-summary-sticky, :scope > .card > .card-body > .section-summary-sticky');
      if (!summaryEl || !frameEl.classList.contains('scroll-snap-free')) {
        clearCompactSummaryPinnedState();
        syncTopbarOffset();
        return;
      }
      const naturalRect = summaryEl.getBoundingClientRect();
      const naturalHeight = Math.ceil(naturalRect.height || summaryEl.offsetHeight || 0);
      const scrollTop = window.scrollY || window.pageYOffset || 0;
      const summaryDocumentTop = Math.round(scrollTop + naturalRect.top);
      const storedPinStart = compactSummaryPinStartBySection.get(currentSection);
      const pinStart = Number.isFinite(storedPinStart) ? storedPinStart : summaryDocumentTop;
      const shouldPin = naturalHeight > 0 && scrollTop >= Math.max(24, pinStart);
      if (!shouldPin) {
        compactSummaryPinStartBySection.set(currentSection, summaryDocumentTop);
        clearCompactSummaryPinnedState();
        syncTopbarOffset();
        return;
      }
      const pinnedHost = ensureCompactSummaryPinnedHost();
      frameEl.classList.add('section-summary-pinned');
      frameEl.style.setProperty('--section-summary-fixed-left', `${Math.round(naturalRect.left)}px`);
      frameEl.style.setProperty('--section-summary-fixed-width', `${Math.round(naturalRect.width)}px`);
      frameEl.style.setProperty('--section-summary-height', `${naturalHeight}px`);
      pinnedHost.style.left = `${Math.round(naturalRect.left)}px`;
      pinnedHost.style.width = `${Math.round(naturalRect.width)}px`;
      pinnedHost.style.display = 'block';
      const needsCloneRefresh = compactSummaryPinnedSourceState?.el !== summaryEl || pinnedHost.childElementCount === 0;
      if (needsCloneRefresh) {
        restoreCompactSummaryPinnedSourceState();
        const summaryClone = summaryEl.cloneNode(true);
        summaryClone.style.position = 'static';
        summaryClone.style.top = 'auto';
        summaryClone.style.zIndex = 'auto';
        summaryClone.style.margin = '0';
        const readonlyFeatureSticky = summaryEl.classList.contains('readonly-feature-sticky');
        summaryClone.style.pointerEvents = readonlyFeatureSticky ? 'auto' : 'none';
        pinnedHost.style.pointerEvents = readonlyFeatureSticky ? 'auto' : '';
        pinnedHost.innerHTML = '';
        pinnedHost.appendChild(summaryClone);
        compactSummaryPinnedSourceState = {
          el: summaryEl,
          visibility: summaryEl.style.visibility,
          pointerEvents: summaryEl.style.pointerEvents,
          marginBottom: summaryEl.style.marginBottom
        };
      }
      summaryEl.style.visibility = 'hidden';
      summaryEl.style.pointerEvents = 'none';
      summaryEl.style.marginBottom = '0px';
      syncTopbarOffset();
    }

    function syncTopbarOffset() {
      if (!topbarEl) return;
      const compactStickySummary = frameEl
        && (frameEl.classList.contains('page-compact-topbar') || frameEl.classList.contains('arp-compact'))
        && hasCompactStickySummary();
      const topbarHeight = (frameEl?.classList.contains('topmetrics-fixed') || compactStickySummary) ? 0 : topbarEl.offsetHeight;
      document.documentElement.style.setProperty('--topbar-height', `${topbarHeight}px`);
    }

    function applySectionTopbarState() {
      if (!frameEl) return;
      const scrollSnapFree = hasCompactStickySummary();
      frameEl.classList.toggle('scroll-snap-free', scrollSnapFree);
      const compact = false;
      frameEl.classList.toggle('page-compact-topbar', compact);
      frameEl.classList.toggle('arp-compact', compact && currentSection === 'arp');
      syncTopMetricsVisibility();
      syncTopMetricsPinned();
      syncCompactSummaryPinned();
    }

    function syncSectionTopbarState() {
      if (sectionTopbarStateRaf) {
        cancelAnimationFrame(sectionTopbarStateRaf);
        sectionTopbarStateRaf = 0;
      }
      applySectionTopbarState();
    }

    function scheduleSectionTopbarState() {
      if (!frameEl || sectionTopbarStateRaf) return;
      sectionTopbarStateRaf = requestAnimationFrame(() => {
        sectionTopbarStateRaf = 0;
        applySectionTopbarState();
      });
    }

    function buildTopMetrics(snapshot) {
      const o = snapshot.overview || {};
      const interfaces = snapshot.interfaces || [];
      const pppoe = getWanRows(snapshot);
      const terminals = snapshot.terminals || [];
      const arp = snapshot.arp || { items: [] };
      const dhcp = snapshot.dhcp || { leases: [], pools: [] };
      const connections = snapshot.connections || {};
      const dns = snapshot.dns || {};
      const security = snapshot.security || {};
      const lb = snapshot.loadBalance || {};
      const routes = snapshot.routes || {};
      const logs = snapshot.logs || {};
      const activePppoe = pppoe.filter((row) => row.running).length;
      const activeInterfaces = interfaces.filter((row) => row.running).length;
      const busiestLine = pppoe.slice().sort((a, b) => ((b.upRate + b.downRate) - (a.upRate + a.downRate)))[0];

      switch (currentSection) {
        case 'interfaces':
          return [
            ['在线接口', `${fmtNumber(activeInterfaces)} / ${fmtNumber(interfaces.length)}`],
            ['在线线路', `${fmtNumber(activePppoe)} / ${fmtNumber(pppoe.length)}`],
            ['当前主线路', busiestLine ? `${escapeHtml(busiestLine.name)} · ${fmtRate((busiestLine.upRate || 0) + (busiestLine.downRate || 0))}` : '-'],
            ['总上行速率', fmtRate(o.uplinkBps)],
            ['总下行速率', fmtRate(o.downlinkBps)]
          ];
        case 'dhcp':
          return [
            ['DHCP 服务器', fmtNumber((dhcp.servers || []).length)],
            ['地址池', fmtNumber((dhcp.pools || []).length)],
            ['绑定租约', fmtNumber((dhcp.leases || []).filter((row) => row.status === 'bound').length)],
            ['静态分配', fmtNumber((dhcp.leases || []).filter((row) => row.static).length)]
          ];
        case 'terminals':
          return [
            ['在线终端', fmtNumber(terminals.length)],
            ['ARP 条目', fmtNumber((arp.items || []).length)],
            ['DHCP 地址池', fmtNumber((dhcp.pools || []).length)],
            ['DHCP 租约', fmtNumber((dhcp.leases || []).length)]
          ];
        case 'connections':
          {
            const hasProtocolTopMetrics = [connections.tcp, connections.udp].every((value) => Number.isFinite(Number(value)));
            return [
              ['连接总数', fmtCompact(connections.total)],
              ['活跃会话', fmtNumber((connections.active || []).length)],
              ['单 IP 排行', fmtNumber((connections.topIps || []).length)],
              ['明细刷新', connections.detailUpdatedAt ? escapeHtml(connections.detailUpdatedAt) : '等待采集'],
              ['协议拆分', hasProtocolTopMetrics ? `${fmtCompact(connections.tcp)} / ${fmtCompact(connections.udp)}` : '当前未采集']
            ];
          }
        case 'trafficLoad':
          {
            const activeTrafficTerminals = (terminals || []).filter((row) => Number(row.upRate || 0) + Number(row.downRate || 0) > 0).length;
            return [
              ['WAN 线路在线', `${fmtNumber(activePppoe)} / ${fmtNumber(pppoe.length)}`],
              ['总上行速率', fmtRate(o.uplinkBps)],
              ['总下行速率', fmtRate(o.downlinkBps)],
              ['最繁忙线路', busiestLine ? `${escapeHtml(busiestLine.name)} 路 ${fmtRate((busiestLine.upRate || 0) + (busiestLine.downRate || 0))}` : '-'],
              ['有流量终端', fmtNumber(activeTrafficTerminals)]
            ];
          }
        case 'loadAudit':
          return [
            ['CPU 使用率', fmtPercent(o.cpuLoad)],
            ['内存占用率', fmtPercent(o.memoryUsage)],
            ['磁盘占用率', fmtPercent(o.diskUsage)],
            ['系统状态', tag(o.systemLoadLevel === 'danger' ? '高压' : o.systemLoadLevel === 'warning' ? '预警' : '正常', o.systemLoadLevel)],
            ['连接总数', fmtCompact(connections.total)]
          ];
        case 'lineStatus':
          return [
            ['在线线路', `${fmtNumber(activePppoe)} / ${fmtNumber(pppoe.length)}`],
            ['在线接口', `${fmtNumber(activeInterfaces)} / ${fmtNumber(interfaces.length)}`],
            ['异常线路', fmtNumber(pppoe.filter((row) => !row.running || !(row.addresses || []).length).length)],
            ['IPv6 接口', fmtNumber(interfaces.filter((row) => (row.ips || []).some((ip) => String(ip).includes(':'))).length)]
          ];
        case 'dns':
          return [
            ['DNS 状态', dns.running ? '启用' : '未启用'],
            ['上游 DNS', fmtNumber((dns.servers || []).length)],
            ['缓存已用', dns.cacheUsed ? fmtBytes(dns.cacheUsed) : '未提供'],
            ['静态规则', fmtNumber((dns.forwardRules || []).length)]
          ];
        case 'routes':
          return [
            ['静态路由', fmtNumber(routes.staticCount)],
            ['活动静态路由', fmtNumber(routes.activeStaticCount)],
            ['默认路由', fmtNumber(routes.defaultCount)],
            ['路由表', fmtNumber(routes.tableCount)]
          ];
        case 'security':
          return [
            ['Filter 规则', fmtNumber((security.filters || []).length)],
            ['地址名单', fmtNumber((security.addressLists || []).length)],
            ['异常告警', fmtNumber((security.alerts || []).length)],
            ['防火墙规则', (security.filters || []).length ? '已读取' : '未读取']
          ];
        case 'arp':
          return [
            ['ARP 条目', fmtNumber((arp.items || []).length)],
            ['ARP 告警', fmtNumber((arp.alerts || []).length)],
            ['在线终端', fmtNumber(terminals.length)],
            ['实时流量终端', fmtNumber((terminals || []).filter((row) => Number(row.upRate || 0) + Number(row.downRate || 0) > 0).length)]
          ];
        case 'trafficAudit':
          return [
            ['连接总数', fmtCompact(connections.total)],
            ['活跃会话', fmtNumber((connections.active || []).length)],
            ['单 IP 排行', fmtNumber((connections.topIps || []).length)],
            ['明细刷新', connections.detailUpdatedAt ? escapeHtml(connections.detailUpdatedAt) : '等待采集']
          ];
        case 'balance':
          return [
            ['活动线路', fmtNumber(lb.activeLines)],
            ['默认路由', fmtNumber((lb.defaultRoutes || []).length)],
            ['Mangle 规则', fmtNumber((lb.mangleRules || []).length)],
            ['策略路由', fmtNumber((lb.routingRules || []).length)]
          ];
        case 'logs':
        case 'serviceLogs':
          return [
            ['全部日志', fmtNumber((logs.all || []).length)],
            ['系统日志', fmtNumber((logs.system || []).length)],
            ['Firewall', fmtNumber((logs.firewall || []).length)],
            ['DHCP / DNS', `${fmtNumber((logs.dhcp || []).length)} / ${fmtNumber((logs.dns || []).length)}`]
          ];
        case 'overview':
        default:
          return [];
      }
    }

    function updateRefreshMeta() {
      if (!refreshModeTextEl || !nextRefreshTextEl) return;
      if (IS_TEST_MODE) {
        refreshModeTextEl.textContent = '测试快照';
        nextRefreshTextEl.textContent = '浏览器静态验收';
        return;
      }
      if (pendingSnapshot && hasInteractionLock()) {
        refreshModeTextEl.textContent = '新数据已获取';
        nextRefreshTextEl.textContent = '当前正在查看内容，暂缓覆盖页面';
        return;
      }
      refreshModeTextEl.textContent = refreshTriggerText(lastRefreshMode);
      if (!nextRefreshAt) {
        nextRefreshTextEl.textContent = '后台秒级采集';
        return;
      }
      const remainMs = Math.max(0, nextRefreshAt - Date.now());
      nextRefreshTextEl.textContent = remainMs < 1000 ? '即将采集新数据' : `${Math.ceil(remainMs / 1000)} 秒后采集`;
    }

    function renderTopMetrics(snapshot) {
      const failures = failedEndpointSummary(snapshot);
      const freshnessMetrics = [
        ['实时采集', escapeHtml(snapshot.meta?.realtimeUpdatedAt || snapshot.updatedAt || '未采集')],
        ['慢速采集', escapeHtml(snapshot.meta?.slowRestUpdatedAt || '未采集')],
        ['静态配置', escapeHtml(snapshot.meta?.staticUpdatedAt || '未采集')],
        ['失败端点', failures.count ? tag(`${fmtNumber(failures.count)} 项`, 'warn') : tag('无', 'ok')]
      ];
      const metrics = normalizeSection(currentSection) === 'overview'
        ? buildTopMetrics(snapshot)
        : [...freshnessMetrics, ...buildTopMetrics(snapshot)];
      const meta = pageMeta[currentSection];
      topMetricsEl.innerHTML = metrics.length ? metrics.map(([k, v]) => `<div class="status-pill"><div class="status-k">${k}</div><div class="status-v">${v}</div></div>`).join('') : '';
      pageTitleEl.textContent = meta.title;
      setPageSubtitle('');
      updateTextEl.textContent = snapshot.status === 'ok' ? `最后更新 ${snapshot.updatedAt}` : `采集异常 ${snapshot.updatedAt || ''}`;
      healthDotEl.className = `dot ${snapshot.status === 'ok' ? '' : 'danger'}`;
      updateRefreshMeta();
      syncSectionTopbarState();
    }

    let renderOverview;

    function overviewRankPollText(snapshot, freshness = snapshotFreshnessState(snapshot)) {
      if (isHistorySnapshot(freshness)) return '快照排序';
      const seconds = Number(snapshot?.meta?.pollSeconds || REALTIME_REFRESH_SECONDS || 1);
      return `每 ${escapeHtml(String(seconds))}s 自动刷新`;
    }

    const OVERVIEW_TERMINAL_RANK_LIMIT = 5;
    const OVERVIEW_INTERFACE_RANK_LIMIT = 5;

    function buildOverviewRankData(snapshot, freshness = snapshotFreshnessState(snapshot)) {
      const connections = snapshot?.connections || {};
      const terminals = snapshot?.terminals || [];
      const interfaces = snapshot?.interfaces || [];
      const history = isHistorySnapshot(freshness);
      const terminalSource = terminals.length ? terminals : (connections.topIps || []);
      const rankedTerminals = terminalSource
        .slice()
        .filter((row) => totalTrafficRate(row) > 0 || Number(row.connections || 0) > 0)
        .sort((a, b) => {
          const trafficDiff = totalTrafficRate(b) - totalTrafficRate(a);
          if (trafficDiff !== 0) return trafficDiff;
          return Number(b.connections || 0) - Number(a.connections || 0);
        })
        .slice(0, OVERVIEW_TERMINAL_RANK_LIMIT);
      const terminalRows = rankedTerminals.map((row) => {
        const name = displayNameFor(row, row.ip || '-').displayName;
        const statusLabel = row.status === 'failed' || row.status === 'incomplete'
          ? tag('异常', 'danger')
          : row.status === 'stale'
            ? tag(history ? '上次保活' : '保活', history ? 'trust' : 'warn')
            : snapshotOkTag('在线', freshness);
        return `<tr>
          <td><b>${escapeHtml(name)}</b><div class="subtle">${escapeHtml(row.ip || '-')}</div></td>
          <td>${fmtRate(totalTrafficRate(row))}</td>
          <td>${statusLabel}</td>
        </tr>`;
      }).join('');
      const rankedInterfaces = interfaces
        .slice()
        .sort((a, b) => totalTrafficRate(b, 'txRate', 'rxRate') - totalTrafficRate(a, 'txRate', 'rxRate'))
        .slice(0, OVERVIEW_INTERFACE_RANK_LIMIT);
      const interfaceRows = rankedInterfaces.map((row) => `<tr>
        <td><b>${escapeHtml(row.name)}</b><div class="subtle">${escapeHtml(row.type || '-')}</div></td>
        <td>${fmtRate(totalTrafficRate(row, 'txRate', 'rxRate'))}</td>
        <td>${row.disabled ? tag('停用', 'warn') : row.running ? snapshotOkTag('在线', freshness) : tag(history ? '上次离线' : '离线', 'danger')}</td>
      </tr>`).join('');
      return { rankedTerminals, rankedInterfaces, terminalRows, interfaceRows };
    }

    function renderOverviewRankGrid(snapshot, ctx = {}) {
      const { rankedTerminals, rankedInterfaces, terminalRows, interfaceRows } = buildOverviewRankData(snapshot, ctx.freshness);
      const pollText = overviewRankPollText(snapshot, ctx.freshness);
      const historyLabel = isHistorySnapshot(ctx.freshness) ? '上次采样' : '实时';
      return `<div class="ik-home-rank-grid" data-overview-rank-grid>
        <div class="ik-home-rank-card" data-overview-rank-card="terminal">
          <div class="ik-home-rank-card-head"><div class="ik-home-rank-card-title">终端流量排行</div><div class="subtle">${historyLabel} · ${fmtNumber(rankedTerminals.length)} 台 · ${pollText}</div></div>
          ${scaleDisclosure(snapshot, 'overviewTerminalTop', rankedTerminals.length, (snapshot.terminals || []).length, 'snapshot.terminals', '速率倒序，仅展示 Top 5')}
          ${compactTable(['名称 / IP', '速率', '状态'], terminalRows, '当前未采集到终端流量排行', 'ik-home-rank-table')}
        </div>
        <div class="ik-home-rank-card" data-overview-rank-card="interface">
          <div class="ik-home-rank-card-head"><div class="ik-home-rank-card-title">接口吞吐排行</div><div class="subtle">${historyLabel} · ${fmtNumber(rankedInterfaces.length)} 个接口 · ${pollText}</div></div>
          ${scaleDisclosure(snapshot, 'overviewInterfaceTop', rankedInterfaces.length, (snapshot.interfaces || []).length, 'snapshot.interfaces', '速率倒序，仅展示 Top 5')}
          ${compactTable(['名称', '速率', '状态'], interfaceRows, '当前未采集到接口吞吐排行', 'ik-home-rank-table')}
        </div>
      </div>`;
    }

    function refreshOverviewRankGrid(snapshot) {
      if (!appEl || !snapshot) return false;
      const overviewEl = appEl.querySelector('#overview');
      const currentGrid = overviewEl?.querySelector('[data-overview-rank-grid]');
      if (!currentGrid) return false;
      const scrollState = {};
      currentGrid.querySelectorAll('[data-overview-rank-card]').forEach((card) => {
        const key = card.getAttribute('data-overview-rank-card');
        const scroller = card.querySelector('.ops-table-wrap');
        if (key && scroller) scrollState[key] = scroller.scrollTop;
      });
      currentGrid.outerHTML = renderOverviewRankGrid(snapshot, { freshness: snapshotFreshnessState(snapshot) });
      const nextGrid = overviewEl.querySelector('[data-overview-rank-grid]');
      Object.entries(scrollState).forEach(([key, top]) => {
        const scroller = nextGrid?.querySelector(`[data-overview-rank-card="${key}"] .ops-table-wrap`);
        if (scroller) scroller.scrollTop = top;
      });
      return Boolean(nextGrid);
    }

    function resolveOverviewWanSelection(pppoe) {
      const rows = Array.isArray(pppoe) ? pppoe : [];
      const selected = rows.find((row) => row.name === currentOverviewWanLine) || null;
      if (currentOverviewWanLine !== 'aggregate' && !selected) {
        currentOverviewWanLine = 'aggregate';
      }
      return { key: selected ? selected.name : 'aggregate', line: selected };
    }

    function renderOverviewWanLineSwitch(pppoe, selectedKey) {
      const rows = Array.isArray(pppoe) ? pppoe : [];
      const lineOptions = rows.map((row) => {
        const selected = row.name === selectedKey ? ' selected' : '';
        const state = row.running ? '在线' : '离线';
        return `<option value="${escapeHtml(row.name)}"${selected}>${escapeHtml(row.name)} · ${state} · ${fmtRate(totalTrafficRate(row))}</option>`;
      }).join('');
      const disabled = rows.length ? '' : ' disabled';
      return `<div class="ik-wan-switch" data-overview-wan-switch>
        <span class="ik-wan-switch-label">切换线路</span>
        <select class="ik-wan-line-select" data-overview-wan-line aria-label="切换 WAN 线路"${disabled}>
          <option value="aggregate"${selectedKey === 'aggregate' ? ' selected' : ''}>聚合全部线路</option>
          ${lineOptions}
        </select>
      </div>`;
    }

    function wanAccessBuckets(wanRows = []) {
      const labels = ['PPPoE', 'DHCP', 'VLAN', 'Static', 'Unknown'];
      const buckets = Object.fromEntries(labels.map((label) => [label, { total: 0, online: 0 }]));
      (wanRows || []).forEach((row) => {
        const key = labels.includes(row?.access) ? row.access : 'Unknown';
        buckets[key].total += 1;
        if (row?.running) buckets[key].online += 1;
      });
      return buckets;
    }

    function wanAccessSummaryText(wanRows = []) {
      const buckets = wanAccessBuckets(wanRows);
      return ['PPPoE', 'DHCP', 'VLAN', 'Static', 'Unknown']
        .filter((key) => buckets[key].total)
        .map((key) => `${key} ${fmtNumber(buckets[key].online)}/${fmtNumber(buckets[key].total)}`)
        .join(' · ') || '未采集';
    }

    function defaultRouteHealth(snapshot = {}, wanRows = []) {
      const defaults = snapshot.routes?.defaultRoutes || [];
      const rowRouteCount = (wanRows || []).reduce((sum, row) => sum + (row.routes || []).filter((route) => route.active).length, 0);
      const activeDefaults = defaults.filter((row) => row.active && !row.disabled).length || rowRouteCount;
      if (!defaults.length && !rowRouteCount) return { label: '未采集', level: 'warn', text: '默认路由未进入快照', active: 0, total: 0 };
      if (activeDefaults > 0) return { label: '正常', level: 'ok', text: `${fmtNumber(activeDefaults)} 条活动默认路由`, active: activeDefaults, total: defaults.length || rowRouteCount };
      return { label: '异常', level: 'danger', text: '未发现活动默认路由', active: 0, total: defaults.length };
    }

    function wanHealthState(wanRows = [], routeHealth = {}) {
      const total = (wanRows || []).length;
      const online = (wanRows || []).filter((row) => row?.running).length;
      const offline = Math.max(0, total - online);
      if (!total) return { label: '未采集', level: 'warn', online, total, offline, text: '未采集到 WAN 线路' };
      if (routeHealth.level === 'danger') return { label: '默认路由异常', level: 'danger', online, total, offline, text: routeHealth.text || '默认路由异常' };
      if (online === 0) return { label: '全部离线', level: 'danger', online, total, offline, text: `${fmtNumber(total)} 条 WAN 线路全部离线` };
      if (offline > 0) return { label: '部分离线', level: 'warn', online, total, offline, text: `离线 ${fmtNumber(offline)} 条` };
      if (routeHealth.level === 'warn') return { label: '路由待确认', level: 'warn', online, total, offline, text: routeHealth.text || '默认路由待确认' };
      return { label: '全部在线', level: 'ok', online, total, offline, text: `${fmtNumber(total)} 条 WAN 线路在线` };
    }

    function collectionRiskState(snapshot = {}, freshness = snapshotFreshnessState(snapshot), failures = failedEndpointSummary(snapshot)) {
      if (snapshot.status && snapshot.status !== 'ok') return { label: '采集异常', level: 'danger', text: snapshot.error || '采集状态异常' };
      if (freshness?.stale) return { label: freshness.label, level: freshness.level, text: `数据年龄 ${freshness.text}` };
      if (failures.count) return { label: `端点失败 ${fmtNumber(failures.count)}`, level: 'warn', text: failures.text };
      return { label: '采集正常', level: 'ok', text: '当前无采集端点失败' };
    }

    function renderOfflineWanEvidence(ctx) {
      const history = isHistorySnapshot(ctx.freshness);
      const rows = (ctx.offlineWanRows || []).slice(0, 3);
      if (!rows.length) {
        return `<div class="ik-home-evidence-empty" data-overview-anomaly-evidence data-overview-field>WAN 离线清单：${history ? '上次采样未见离线线路' : '当前未见离线线路'}</div>`;
      }
      return `<div class="ik-home-evidence-list" data-overview-anomaly-evidence>
        <div class="ik-home-evidence-row is-head" data-overview-field><span>对象</span><span>状态</span><span>采样</span><span>父接口</span><span>默认路由</span><span>速率</span></div>
        ${rows.map((row) => {
          const activeRoute = (row.routes || []).find((route) => route.active && !route.disabled) || null;
          const routeText = activeRoute
            ? `${activeRoute.gateway || activeRoute.gatewayStatus || '-'} d${activeRoute.distance ?? '-'}`
            : '未承载默认路由';
          const rateText = fmtRate(totalTrafficRate(row));
          return `<div class="ik-home-evidence-row is-offline" data-overview-anomaly-object="${escapeHtml(row.name || '')}" data-overview-field>
          <b>${escapeHtml(row.name || row.interface || 'unknown')}</b>
          <span>${history ? '上次离线' : '离线'}</span>
          <span>${escapeHtml(ctx.freshness.source || '-')}</span>
          <span>${escapeHtml(row.parent || row.interface || '-')}</span>
          <span>${escapeHtml(routeText)}</span>
          <span>${escapeHtml(rateText)}</span>
        </div>`;
        }).join('')}
      </div>`;
    }

    function renderDefaultRouteSnapshot(ctx) {
      const history = isHistorySnapshot(ctx.freshness);
      const routes = (ctx.snapshot.routes?.defaultRoutes || [])
        .slice()
        .sort((a, b) => Number(a.distance || 0) - Number(b.distance || 0))
        .slice(0, 4);
      if (!routes.length) {
        return `<div class="ik-home-evidence-empty" data-overview-default-routes data-overview-field>默认路由：未采集到路由表快照</div>`;
      }
      const rows = routes.map((route) => `<tr data-overview-field>
        <td>${escapeHtml(route.table || route.routingTable || 'main')}</td>
        <td>${escapeHtml(route.gateway || route.gatewayStatus || '-')}</td>
        <td>${escapeHtml(String(route.distance ?? '-'))}</td>
        <td>${route.active && !route.disabled ? snapshotOkTag('活动', ctx.freshness) : tag(history ? '上次未活动' : '未活动', 'warn')}</td>
      </tr>`).join('');
      return `<div class="ik-home-mini-table-wrap" data-overview-default-routes>
        <table class="ik-home-mini-table">
          <thead><tr><th>路由表</th><th>网关</th><th>距</th><th>状态</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
    }

    function renderWanMiniTable(ctx) {
      const history = isHistorySnapshot(ctx.freshness);
      const rows = (ctx.pppoe || [])
        .slice()
        .sort((a, b) => {
          if (Boolean(a.running) !== Boolean(b.running)) return a.running ? 1 : -1;
          return totalTrafficRate(b) - totalTrafficRate(a);
        })
        .slice(0, 5)
        .map((row) => {
          const activeRoute = (row.routes || []).find((route) => route.active && !route.disabled) || null;
          const routeText = activeRoute
            ? `${activeRoute.gateway || activeRoute.gatewayStatus || '-'} / ${activeRoute.distance ?? '-'}`
            : (row.running ? '未关联' : '离线');
          return `<tr data-overview-field>
          <td><span data-overview-anomaly-object="${row.running ? '' : escapeHtml(row.name || row.interface || '')}">${escapeHtml(row.name || row.interface || '-')}</span></td>
          <td>${escapeHtml(row.access || row.kind || 'Unknown')}</td>
          <td>${escapeHtml(row.parent || '-')}</td>
          <td>${row.running ? snapshotOkTag('在线', ctx.freshness) : tag(history ? '上次离线' : '离线', 'danger')}</td>
          <td>${escapeHtml(routeText)}</td>
          <td>${fmtRate(Number(row.upRate || 0))}</td>
          <td>${fmtRate(Number(row.downRate || 0))}</td>
          <td>${escapeHtml(ctx.freshness.source || '-')}</td>
        </tr>`;
        }).join('');
      return `<div class="ik-home-mini-table-wrap" data-overview-wan-mini-table>
        <table class="ik-home-mini-table">
          <thead><tr><th>线路</th><th>接入</th><th>父接口</th><th>状态</th><th>默认路由</th><th>上行</th><th>下行</th><th>最后采样</th></tr></thead>
          <tbody>${rows || `<tr><td colspan="8">未采集到 WAN 线路</td></tr>`}</tbody>
        </table>
      </div>`;
    }

    function renderOverviewFreshnessCompact(ctx) {
      const labels = historyAwareCapabilityLabels(ctx.capabilities, ctx.freshness);
      const trustLabel = isHistorySnapshot(ctx.freshness) ? '快照模式' : ctx.freshness.label;
      const items = [
        ['可信等级', trustLabel],
        ['快照时间', ctx.freshness.source || '未采集'],
        ['数据年龄', ctx.freshness.text || '未采集'],
        ['REST 状态', labels.restLabel],
        ['SSH 状态', labels.sshLabel],
        ['轮询间隔', ctx.pollText],
        ['失败端点', ctx.failures.count ? ctx.failures.text : '无失败端点']
      ];
      return `<div class="freshness-strip">${items.map(([label, value]) => `
        <div class="freshness-item" data-overview-field><span>${escapeHtml(label)}</span><b>${escapeHtml(value)}</b></div>`).join('')}</div>`;
    }

    function renderOverviewSessionSnapshot(ctx) {
      const terminals = ctx.terminals || [];
      const connections = ctx.connections || {};
      const trafficTerminals = terminals.filter((row) => totalTrafficRate(row) > 0);
      const topTerminal = trafficTerminals
        .slice()
        .sort((a, b) => totalTrafficRate(b) - totalTrafficRate(a))[0] || null;
      const terminalOnline = Number(ctx.onlineTerminals || 0) || terminals.filter((row) => !['failed', 'incomplete'].includes(row.status)).length;
      const terminalStandby = terminals.filter((row) => ['stale', 'waiting'].includes(row.status)).length;
      const terminalOffline = terminals.filter((row) => ['failed', 'incomplete'].includes(row.status)).length;
      const activeSessions = Number(ctx.activeSessions || 0);
      const topName = topTerminal ? (topTerminal.displayName || topTerminal.hostname || topTerminal.ip || '-') : '-';
      const prefix = samplePrefix(ctx.freshness);
      const boxes = [
        ['在线终端', fmtNumber(terminalOnline)],
        ['有流量终端', fmtNumber(trafficTerminals.length)],
        ['待机终端', fmtNumber(terminalStandby)],
        ['离线终端', fmtNumber(terminalOffline)],
        ['PPP 活动会话', fmtNumber(activeSessions)],
        ['ConnTrack 连接数', fmtCompact(ctx.connectionTotal)],
        ['最忙终端', escapeHtml(topName)],
        ['终端速率', topTerminal ? fmtRate(totalTrafficRate(topTerminal)) : '-']
      ];
      return `<div class="card ik-home-density-card" data-overview-density-module="session-snapshot">
        <div class="card-head"><div class="card-title">会话 / 终端概览</div><div class="subtle">${escapeHtml(prefix)} · TCP ${fmtNumber(connections.tcp || 0)} / UDP ${fmtNumber(connections.udp || 0)}</div></div>
        <div class="card-body">
          <div class="ik-home-session-grid">
            ${boxes.map(([label, value]) => `<div class="ik-summary-box" data-overview-field><div class="subtle">${escapeHtml(label)}</div><b>${value}</b></div>`).join('')}
          </div>
        </div>
      </div>`;
    }

    function renderOverviewSignalCoverage(ctx) {
      const labels = historyAwareCapabilityLabels(ctx.capabilities, ctx.freshness);
      const interfaceCount = Array.isArray(ctx.snapshot.interfaces) ? ctx.snapshot.interfaces.length : 0;
      const terminalCount = Array.isArray(ctx.terminals) ? ctx.terminals.length : 0;
      const wanTypeCount = ['PPPoE', 'DHCP', 'VLAN', 'Static', 'Unknown']
        .filter((key) => ctx.accessBuckets[key]?.total)
        .length;
      const writeClosed = ctx.capabilities.routerosWrite || ctx.capabilities.localAliasWrite || ctx.capabilities.ipAliasWrite
        ? '开启'
        : '关闭';
      const boxes = [
        ['REST', labels.restLabel],
        ['SSH', labels.sshLabel],
        ['默认路由', ctx.routeHealth.label],
        ['失败端点', ctx.failures.count ? fmtNumber(ctx.failures.count) : '0'],
        ['WAN 类型', wanTypeCount ? fmtNumber(wanTypeCount) : '0'],
        ['接口数', fmtNumber(interfaceCount)],
        ['终端数', fmtNumber(terminalCount)],
        ['写入能力', writeClosed]
      ];
      return `<div class="card ik-home-density-card ik-home-signal-card" data-overview-density-module="signal-coverage">
        <div class="card-head"><div class="card-title">采集 / 信号覆盖</div><div class="subtle">${escapeHtml(samplePrefix(ctx.freshness))} · ${fmtNumber(ctx.sampleCount)} 点 · ${escapeHtml(ctx.pollText)}</div></div>
        <div class="card-body">
          <div class="ik-home-signal-grid">
            ${boxes.map(([label, value]) => `<div class="ik-summary-box" data-overview-field><div class="subtle">${escapeHtml(label)}</div><b>${escapeHtml(String(value))}</b></div>`).join('')}
          </div>
        </div>
      </div>`;
    }

    function renderOverviewStatusBar(ctx) {
      const history = isHistorySnapshot(ctx.freshness);
      const labels = historyAwareCapabilityLabels(ctx.capabilities, ctx.freshness);
      const restLabel = stripChannelPrefix(labels.restLabel, 'REST');
      const sshLabel = stripChannelPrefix(labels.sshLabel, 'SSH');
      const modeLabel = history ? '数据' : '数据';
      const modeDetail = history ? `历史快照 ${ctx.freshness.text || ''} · 仅代表上次采样` : '实时只读';
      const highest = ctx.wanHealth.level !== 'ok'
        ? ctx.wanHealth.label
        : ctx.collectionRisk.level !== 'ok'
          ? ctx.collectionRisk.label
          : ctx.risk.label || (history ? '上次正常' : '正常');
      const items = [
        ['异常', highest],
        ['WAN', `${fmtNumber(ctx.wanHealth.online)} / ${fmtNumber(ctx.wanHealth.total)} · ${ctx.wanHealth.label}`],
        ['资源', `CPU ${fmtPercent(ctx.o.cpuLoad)} · MEM ${fmtPercent(ctx.o.memoryUsage)}`],
        [modeLabel, modeDetail],
        ['采集', `REST ${restLabel} · SSH ${sshLabel}`],
        ['快照时间', ctx.freshness.source || '未采集'],
        ['年龄', ctx.freshness.text || '未采集'],
        ['位置', '首页 / 线路 / 终端 / 流量']
      ];
      return `<div class="ik-home-ops-bar${history ? '' : ' is-live'}" data-overview-trust-notice data-overview-status-bar>
        ${items.map(([label, value]) => `<div class="ik-home-ops-item" data-overview-field><span>${escapeHtml(label)}</span><b>${escapeHtml(value)}</b></div>`).join('')}
      </div>`;
    }

    function renderOverviewIncidentLine(ctx) {
      const labels = historyAwareCapabilityLabels(ctx.capabilities, ctx.freshness);
      const restLabel = stripChannelPrefix(labels.restLabel, 'REST');
      const sshLabel = stripChannelPrefix(labels.sshLabel, 'SSH');
      const offlineNames = (ctx.offlineWanRows || [])
        .slice(0, 3)
        .map((row) => row.name || row.interface || '')
        .filter(Boolean);
      const throughput = fmtRate(Number(ctx.wanRates.up || 0) + Number(ctx.wanRates.down || 0));
      const history = isHistorySnapshot(ctx.freshness);
      const level = ctx.wanHealth.level !== 'ok' ? ctx.wanHealth.level : ctx.collectionRisk.level !== 'ok' ? ctx.collectionRisk.level : 'ok';
      const main = ctx.wanHealth.offline > 0
        ? `WAN 离线 ${fmtNumber(ctx.wanHealth.offline)}/${fmtNumber(ctx.wanHealth.total)}：${offlineNames.join('、') || '未列出'}`
        : ctx.wanHealth.level !== 'ok'
          ? ctx.wanHealth.text
          : history
            ? `仅历史快照：${ctx.freshness.text || '-'} 未刷新`
            : '当前无线路异常';
      return `<div class="ik-home-incident-line is-${escapeHtml(level)}" data-overview-incident-line>
        <div class="ik-home-incident-main" data-overview-field>${escapeHtml(main)}</div>
        <div class="ik-home-incident-item" data-overview-field><span>默认路由</span>${escapeHtml(snapshotStatusText(ctx.routeHealth.label, ctx.freshness))}</div>
        <div class="ik-home-incident-item" data-overview-field><span>总吞吐</span>${escapeHtml(throughput)}</div>
        <div class="ik-home-incident-item" data-overview-field><span>REST</span>${escapeHtml(restLabel)}</div>
        <div class="ik-home-incident-item" data-overview-field><span>SSH</span>${escapeHtml(sshLabel)}</div>
      </div>`;
    }

    function stripChannelPrefix(label, channel) {
      const value = String(label || '-').trim();
      return value.replace(new RegExp(`^${channel}\\s*`, 'i'), '') || '-';
    }

    function overviewRouteSummary(ctx) {
      const defaults = ctx.snapshot.routes?.defaultRoutes || [];
      const active = defaults.filter((row) => row.active && !row.disabled);
      const primary = active.slice().sort((a, b) => Number(a.distance || 0) - Number(b.distance || 0))[0];
      if (primary) {
        const table = primary.table || primary.routingTable || 'main';
        const gateway = primary.gateway || primary.gatewayStatus || '-';
        return `${table} 表 active ${fmtNumber(active.length)} 条，首选 ${gateway} distance ${primary.distance ?? '-'}`;
      }
      if (ctx.routeHealth.active) return `${fmtNumber(ctx.routeHealth.active)} 条 active 默认路由`;
      return ctx.routeHealth.text || ctx.routeHealth.label || '未采集默认路由';
    }

    function overviewOfflineImpact(ctx) {
      const offlineRows = ctx.offlineWanRows || [];
      if (!offlineRows.length) return ctx.routeHealth.level === 'ok' ? '未见线路影响' : ctx.routeHealth.text;
      const activeRouteOffline = offlineRows.some((row) => (row.routes || []).some((route) => route.active && !route.disabled));
      const offlineRate = offlineRows.reduce((sum, row) => sum + totalTrafficRate(row), 0);
      if (activeRouteOffline) return '影响默认路由，需立即查看路由表快照';
      if (offlineRate > 0) return `离线线路仍有 ${fmtRate(offlineRate)} 快照速率，需核对线路状态`;
      return '离线线路当前无流量，未承载默认路由，影响低';
    }

    function overviewWanAccessImpact(ctx) {
      return ['PPPoE', 'DHCP', 'VLAN', 'Static', 'Unknown']
        .filter((key) => ctx.accessBuckets[key]?.total)
        .map((key) => {
          const bucket = ctx.accessBuckets[key];
          const offline = Math.max(0, bucket.total - bucket.online);
          return `${key} ${offline ? `离线 ${fmtNumber(offline)}` : '正常'} / ${fmtNumber(bucket.online)}/${fmtNumber(bucket.total)}`;
        })
        .join(' · ') || 'WAN 类型未采集';
    }

    function overviewCollectionTrust(ctx) {
      const labels = historyAwareCapabilityLabels(ctx.capabilities, ctx.freshness);
      const restLabel = stripChannelPrefix(labels.restLabel, 'REST');
      const sshLabel = stripChannelPrefix(labels.sshLabel, 'SSH');
      const degraded = ctx.failures.count > 0 || /缺依赖|不可用|失败|待确认|未配置/.test(`${restLabel} ${sshLabel}`);
      const level = degraded ? 'warn' : 'ok';
      const text = `数据可信条：${ctx.freshness.stale ? `当前不是实时数据，${ctx.freshness.text || '-'} 未刷新` : '当前数据新鲜'}；REST ${restLabel}；SSH ${sshLabel}`;
      return { level, restLabel, sshLabel, text };
    }

    function buildOverviewVerdict(ctx) {
      const history = isHistorySnapshot(ctx.freshness);
      const collection = overviewCollectionTrust(ctx);
      const offlineNames = (ctx.offlineWanRows || []).slice(0, 3).map((row) => row.name || row.interface || '').filter(Boolean);
      const routerDown = ctx.routerState.level === 'danger' || ctx.snapshot.status === 'error';
      const rules = [
        { key: 'router-down', label: '断网 / 路由不可达', active: routerDown, level: 'danger' },
        { key: 'route-danger', label: '默认路由异常', active: ctx.routeHealth.level === 'danger', level: 'danger' },
        { key: 'wan-offline', label: 'WAN 离线', active: ctx.wanHealth.offline > 0 || ctx.wanHealth.level === 'danger', level: ctx.wanHealth.level === 'danger' ? 'danger' : 'warn' },
        { key: 'data-stale', label: '数据陈旧', active: ctx.freshness.stale || history, level: 'warn' },
        { key: 'collection-degraded', label: '采集降级', active: collection.level !== 'ok', level: 'warn' },
        { key: 'resource-load', label: '资源高负载', active: ctx.resourceLevel !== 'ok', level: ctx.resourceLevel || 'warn' }
      ];
      const top = rules.find((item) => item.active) || { key: 'ok', label: history ? '历史快照' : '当前正常', level: history ? 'trust' : 'ok' };
      const stalePrefix = ctx.freshness.stale || history
        ? `${history ? '历史快照' : ''}数据陈旧 ${ctx.freshness.text || '-'}`
        : '数据新鲜';
      const wanPart = ctx.wanHealth.offline > 0
        ? `WAN ${ctx.wanHealth.label}，需关注 ${fmtNumber(ctx.wanHealth.offline)} 条线路`
        : `WAN ${ctx.wanHealth.label}`;
      const conclusion = top.key === 'ok'
        ? `当前状态：${history ? `历史快照，${ctx.freshness.text || '-'} 未刷新` : '面板未发现核心异常'}`
        : `当前状态：${stalePrefix}；最高业务风险：${wanPart}`;
      const nextAction = top.key === 'route-danger'
        ? '优先查看：路由表快照'
        : top.key === 'wan-offline'
          ? '优先查看：WAN 状态'
          : top.key === 'data-stale' || top.key === 'collection-degraded'
            ? '优先查看：采集状态'
            : top.key === 'resource-load'
              ? '优先查看：资源状态'
              : '优先查看：状态明细';
      return {
        level: top.level,
        topKey: top.key,
        topLabel: top.label,
        priority: rules,
        conclusion,
        offlineText: offlineNames.length ? `WAN 离线 ${fmtNumber(ctx.wanHealth.offline)} 条：${offlineNames.join('、')}` : 'WAN 未见离线对象',
        routeText: overviewRouteSummary(ctx),
        accessText: overviewWanAccessImpact(ctx),
        impactText: overviewOfflineImpact(ctx),
        collection,
        nextAction,
        ageFirstText: stalePrefix
      };
    }

    function renderOverviewVerdictPanel(ctx) {
      const v = ctx.verdict || buildOverviewVerdict(ctx);
      const totalRate = Number(ctx.wanRates.up || 0) + Number(ctx.wanRates.down || 0);
      const priorityItems = v.priority.map((item) => `<div class="ik-home-priority-item${item.active ? ` is-active is-${escapeHtml(item.level)}` : ''}" data-overview-field data-overview-priority="${escapeHtml(item.key)}">${escapeHtml(item.label)}</div>`).join('');
      return `<div class="ik-home-verdict-panel" data-overview-verdict-panel>
        <div class="ik-home-verdict-main is-${escapeHtml(v.level)}" data-overview-main-verdict>
          <div class="ik-home-verdict-title" data-overview-field>${escapeHtml(v.conclusion)}</div>
          <div class="ik-home-verdict-sub" data-overview-field>风险优先级：断网 / 路由不可达 &gt; 默认路由异常 &gt; WAN 离线 &gt; 数据陈旧 &gt; 采集降级 &gt; 资源高负载。当前最高：${escapeHtml(v.topLabel)}</div>
          <div class="ik-home-verdict-row">
            <div data-overview-field>数据可信 <b>${escapeHtml(v.ageFirstText)}</b></div>
            <div data-overview-field>线路证据 <b>${escapeHtml(v.offlineText)}</b></div>
            <div data-overview-field>默认路由 <b>${escapeHtml(v.routeText)}</b></div>
            <div data-overview-field>影响范围 <b>${escapeHtml(v.impactText)}</b></div>
          </div>
          <div class="ik-home-next-row">
            <div data-overview-field>采集可信 <b>${escapeHtml(v.collection.text)}</b></div>
            <div data-overview-field>WAN 分组 <b>${escapeHtml(v.accessText)}</b></div>
            <div data-overview-field>总吞吐 <b>${fmtRate(totalRate)}</b></div>
            <div data-overview-field>优先查看 <b>${escapeHtml(v.nextAction)}</b></div>
          </div>
          <div class="ik-home-action-links" data-overview-next-actions>
            <a class="ik-home-action-link" href="#lineStatus" data-section="lineStatus">查看 WAN 状态</a>
            <a class="ik-home-action-link" href="#readonlyDiagnostics" data-section="readonlyDiagnostics">查看采集状态</a>
            <a class="ik-home-action-link" href="#routes" data-section="routes">查看路由表快照</a>
          </div>
        </div>
        <div class="ik-home-verdict-side is-${escapeHtml(v.level)}" data-overview-priority-panel>
          <div class="ik-home-verdict-title" data-overview-field>最大风险优先级</div>
          <div class="ik-home-priority-list">${priorityItems}</div>
        </div>
      </div>`;
    }

    function operatorKpis(items) {
      return `<div class="ik-home-operator-kpis">${items.map(([label, value]) => `
        <div data-overview-field><span>${escapeHtml(label)}</span><b>${value}</b></div>`).join('')}</div>`;
    }

    function operatorCard(title, main, level, sub, kpis, stateLabel = '') {
      return `<div class="ik-home-operator-card">
        <div class="ik-home-operator-head">
          <div class="ik-home-operator-title" data-overview-field>${escapeHtml(title)}</div>
          ${tag(stateLabel || (level === 'danger' ? '异常' : level === 'warn' ? '关注' : '正常'), level)}
        </div>
        <div class="ik-home-operator-main" data-overview-field>${main}</div>
        <div class="ik-home-operator-sub" data-overview-field>${sub}</div>
        ${operatorKpis(kpis)}
      </div>`;
    }

    function renderOverviewMobileAlert(ctx) {
      const v = ctx.verdict || buildOverviewVerdict(ctx);
      const sshLabel = v.collection.sshLabel;
      const alertLabel = v.topKey === 'wan-offline' && ctx.wanHealth.offline > 0
        ? `WAN 离线 ${fmtNumber(ctx.wanHealth.offline)} 条`
        : v.topLabel;
      return `<div class="ik-mobile-alert-strip ik-mobile-alarm-head is-${escapeHtml(v.level)}${v.level === 'ok' ? ' is-empty' : ''}" data-overview-mobile-alert data-overview-mobile-alarm>
        <div class="ik-mobile-head-item" data-overview-field>${escapeHtml(alertLabel)}</div>
        <div class="ik-mobile-head-item" data-overview-field>${escapeHtml(v.ageFirstText)}</div>
        <div class="ik-mobile-head-item" data-overview-field>WAN ${fmtNumber(ctx.wanHealth.online)}/${fmtNumber(ctx.wanHealth.total)}</div>
        <div class="ik-mobile-head-item" data-overview-field>SSH ${escapeHtml(sshLabel)}</div>
      </div>`;
    }

    function mobileDecisionLevel(ctx) {
      return (ctx.verdict || buildOverviewVerdict(ctx)).level;
    }

    function mobileRouteSummary(ctx) {
      return overviewRouteSummary(ctx);
    }

    function mobileOfflineImpact(ctx) {
      return overviewOfflineImpact(ctx);
    }

    function mobileWanEvidenceRows(ctx) {
      const history = isHistorySnapshot(ctx.freshness);
      return (ctx.pppoe || [])
        .slice()
        .sort((a, b) => {
          if (Boolean(a.running) !== Boolean(b.running)) return a.running ? 1 : -1;
          return totalTrafficRate(b) - totalTrafficRate(a);
        })
        .slice(0, 5)
        .map((row) => {
          const activeRoute = (row.routes || []).find((route) => route.active && !route.disabled) || null;
          const routeText = activeRoute
            ? `${activeRoute.gateway || activeRoute.gatewayStatus || '-'} d${activeRoute.distance ?? '-'}`
            : (row.running ? '未承载' : '未承载');
          const state = row.running ? snapshotStatusText('在线', ctx.freshness) : (history ? '上次离线' : '离线');
          const anomalyAttr = row.running ? '' : ` data-overview-anomaly-object="${escapeHtml(row.name || row.interface || '')}"`;
          return `<div class="ik-mobile-wan-row${row.running ? '' : ' is-offline'}" data-overview-mobile-wan-row data-overview-field>
            <b${anomalyAttr}>${escapeHtml(row.name || row.interface || '-')}</b>
            <span class="ik-mobile-wan-state">${escapeHtml(state)}</span>
            <span>${escapeHtml(row.parent || row.interface || '-')}</span>
            <span>${escapeHtml(routeText)}</span>
            <span>${fmtRate(totalTrafficRate(row))}</span>
            <span>${escapeHtml(ctx.freshness.source || '-')}</span>
          </div>`;
        }).join('') || `<div class="ik-mobile-wan-row" data-overview-field><span>未采集 WAN</span><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span></div>`;
    }

    function renderOverviewMobileConsole(ctx) {
      const history = isHistorySnapshot(ctx.freshness);
      const v = ctx.verdict || buildOverviewVerdict(ctx);
      const level = v.level;
      const routeText = v.routeText;
      const impactText = v.impactText;
      const prefix = history ? '快照' : '当前';
      const totalRate = Number(ctx.wanRates.up || 0) + Number(ctx.wanRates.down || 0);
      const metric = (title, main, sub, extra) => `<div class="ik-mobile-metric" data-overview-field>
        <div class="ik-mobile-metric-title">${escapeHtml(title)}</div>
        <div class="ik-mobile-metric-main">${main}</div>
        <div class="ik-mobile-metric-sub">${sub}</div>
        <div class="ik-mobile-metric-sub">${extra}</div>
      </div>`;
      const deviceLine = `${ctx.o.identity || ctx.snapshot.meta?.routerHost || ctx.snapshot.meta?.target || '未采集'} | ${ctx.o.version || 'RouterOS 未采集'} | 运行 ${ctx.o.uptime || '-'} | ${history ? '快照' : '数据'} ${ctx.freshness.text || '-'}`;
      return `<div class="ik-mobile-console" data-overview-mobile-console>
        ${renderOverviewMobileAlert(ctx)}
        <div class="ik-mobile-incident-card is-${escapeHtml(level)}" data-overview-mobile-incident>
          <div class="ik-mobile-incident-title" data-overview-field>${escapeHtml(v.conclusion)}</div>
          <div class="ik-mobile-incident-evidence">
            <div data-overview-field>${escapeHtml(v.offlineText)}</div>
            <div data-overview-field>数据可信 <b>${escapeHtml(v.ageFirstText)}</b></div>
            <div data-overview-field>采集可信 <b>REST ${escapeHtml(v.collection.restLabel)} / SSH ${escapeHtml(v.collection.sshLabel)}</b></div>
            <div data-overview-field>默认路由 <b>${escapeHtml(routeText)}</b></div>
            <div data-overview-field>总吞吐 <b>${fmtRate(totalRate)}</b></div>
            <div data-overview-field>影响 <b>${escapeHtml(impactText)}</b></div>
          </div>
        </div>
        <div class="ik-mobile-metric-grid" data-overview-mobile-metrics>
          ${metric('可信', v.ageFirstText, `REST ${v.collection.restLabel}`, `SSH ${v.collection.sshLabel}`)}
          ${metric('WAN', `${fmtNumber(ctx.wanHealth.online)}/${fmtNumber(ctx.wanHealth.total)}`, `离线 ${fmtNumber(ctx.wanHealth.offline)}`, ctx.routeHealth.level === 'ok' ? '默认路由 active' : ctx.routeHealth.label)}
          ${metric('采集', v.collection.level === 'ok' ? '可用' : '降级', ctx.failures.count ? `失败 ${fmtNumber(ctx.failures.count)}` : '无失败端点', v.nextAction)}
          ${metric('资源', `CPU ${fmtPercent(ctx.o.cpuLoad)}`, `内存 ${fmtPercent(ctx.o.memoryUsage)}`, `磁盘 ${fmtPercent(ctx.o.diskUsage)} / 连接 ${fmtCompact(ctx.connectionTotal)}`)}
        </div>
        <div class="ik-mobile-compact-section" data-overview-mobile-wan-table>
          <div class="ik-mobile-section-head" data-overview-field>WAN 证据链 <span>${escapeHtml(prefix)} · 离线置顶 · 对象 / 状态 / 父接口 / 默认路由 / 速率 / 采样</span></div>
          <div class="ik-mobile-wan-row is-head" data-overview-field><span>对象</span><span>状态</span><span>父接口</span><span>默认路由</span><span>速率</span><span>采样</span></div>
          ${mobileWanEvidenceRows(ctx)}
        </div>
        <div class="ik-mobile-device-line" data-overview-mobile-device-line data-overview-field>${escapeHtml(deviceLine)}</div>
      </div>`;
    }

    function renderOverviewSummary(ctx) {
      const history = isHistorySnapshot(ctx.freshness);
      const channelLabels = historyAwareCapabilityLabels(ctx.capabilities, ctx.freshness);
      const deviceLevel = history ? 'trust' : ctx.freshness.stale ? ctx.freshness.level : worseLevel(ctx.routerState.level, ctx.panelState.level);
      const resourceCardLevel = ctx.resourceLevel === 'ok' && history ? 'trust' : ctx.resourceLevel === 'ok' && ctx.freshness.stale ? 'warn' : ctx.resourceLevel;
      const offlineRows = (ctx.offlineWanRows || []).slice(0, 3);
      const resourcePeakCpu = Math.max(Number(ctx.o.cpuLoad || 0), ...(ctx.history.cpu || []).map((value) => Number(value || 0)));
      const resourcePeakMemory = Math.max(Number(ctx.o.memoryUsage || 0), ...(ctx.history.memory || []).map((value) => Number(value || 0)));
      const resourcePeakDisk = Math.max(Number(ctx.o.diskUsage || 0), ...(ctx.history.disk || []).map((value) => Number(value || 0)));
      const riskLevelBase = worseLevel(ctx.wanHealth.level, ctx.collectionRisk.level);
      const riskLevel = history ? (ctx.wanHealth.level !== 'ok' ? ctx.wanHealth.level : 'trust') : riskLevelBase;
      const lineRiskTag = ctx.wanHealth.level === 'ok' ? snapshotOkTag('正常', ctx.freshness) : tag(ctx.wanHealth.label, ctx.wanHealth.level);
      const riskMain = ctx.wanHealth.level !== 'ok'
        ? snapshotStatusText(ctx.wanHealth.label || '异常', ctx.freshness)
        : ctx.collectionRisk.level !== 'ok'
          ? snapshotStatusText(ctx.collectionRisk.label || '采集异常', ctx.freshness)
          : history ? '上次采样正常' : (ctx.risk.label || '未发现异常');
      const riskSub = history
        ? `${snapshotStatusText(ctx.wanHealth.text || ctx.wanHealth.label, ctx.freshness)} · ${ctx.freshness.text} 未刷新`
        : `线路 ${ctx.wanHealth.label} · 采集 ${ctx.collectionRisk.label}`;
      const collectionTagLevel = history ? 'trust' : ctx.collectionRisk.level;
      const offlineKpiValue = (row) => {
        const name = row ? String(row.name || row.interface || '-') : '';
        return name ? `<span data-overview-anomaly-object="${escapeHtml(name)}">${escapeHtml(name)}</span>` : '无';
      };
      const deviceMain = escapeHtml(ctx.o.identity || ctx.snapshot.meta?.routerHost || ctx.snapshot.meta?.target || '未采集');
      const deviceSub = `${escapeHtml(ctx.o.version || 'RouterOS 未采集')} · ${escapeHtml(ctx.o.boardName || '-')} · ${escapeHtml(ctx.freshness.source || '未采集')}`;
      const deviceKpis = [
        ['型号', escapeHtml(ctx.o.boardName || '-')],
        ['架构', escapeHtml(ctx.o.architecture || '-')],
        ['版本', escapeHtml(ctx.o.version || 'RouterOS 未采集')],
        ['运行时长', escapeHtml(ctx.o.uptime || '-')],
        ['采集时间', escapeHtml(ctx.freshness.source || '未采集')],
        ['数据年龄', ctx.freshness.html],
        ['REST 状态', escapeHtml(channelLabels.restLabel)],
        ['SSH 状态', escapeHtml(channelLabels.sshLabel)]
      ];
      const wanKpis = [
        ['PPPoE', `${fmtNumber(ctx.accessBuckets.PPPoE.online)}/${fmtNumber(ctx.accessBuckets.PPPoE.total)}`],
        ['DHCP', `${fmtNumber(ctx.accessBuckets.DHCP.online)}/${fmtNumber(ctx.accessBuckets.DHCP.total)}`],
        ['VLAN', `${fmtNumber(ctx.accessBuckets.VLAN.online)}/${fmtNumber(ctx.accessBuckets.VLAN.total)}`],
        ['Static', `${fmtNumber(ctx.accessBuckets.Static.online)}/${fmtNumber(ctx.accessBuckets.Static.total)}`],
        ['默认路由', ctx.routeHealth.level === 'ok' ? snapshotOkTag('正常', ctx.freshness) : tag(ctx.routeHealth.label, ctx.routeHealth.level)],
        ['离线线路', fmtNumber(ctx.wanHealth.offline)],
        ['活动会话', fmtNumber(ctx.activeSessions)]
      ];
      const resourceKpis = [
        ['CPU', fmtPercent(ctx.o.cpuLoad)],
        ['峰值 CPU', fmtPercent(resourcePeakCpu)],
        ['内存', fmtPercent(ctx.o.memoryUsage)],
        ['峰值内存', fmtPercent(resourcePeakMemory)],
        ['磁盘', fmtPercent(ctx.o.diskUsage)],
        ['峰值磁盘', fmtPercent(resourcePeakDisk)],
        ['采样点', fmtNumber(ctx.sampleCount)],
        ['连接数', fmtCompact(ctx.connectionTotal)]
      ];
      const riskKpis = [
        ['线路风险', lineRiskTag],
        ['数据状态', tag(history ? '仅历史快照' : ctx.collectionRisk.label, collectionTagLevel)],
        ['最高异常', trustAwareTag(ctx.risk.level || 'ok', ctx.freshness, { ok: ctx.risk.label || '正常' })],
        ['PPP会话', fmtNumber(ctx.activeSessions)],
        ['离线 1', offlineKpiValue(offlineRows[0])],
        ['离线 2', offlineKpiValue(offlineRows[1])],
        ['离线 3', offlineKpiValue(offlineRows[2])]
      ];
      return `<div class="ik-home-operator-grid" data-overview-summary>
        ${operatorCard(
          '风险',
          escapeHtml(riskMain),
          riskLevel,
          escapeHtml(riskSub),
          riskKpis,
          history ? (ctx.wanHealth.level !== 'ok' ? ctx.wanHealth.label : '仅历史快照') : (riskLevel === 'ok' && ctx.freshness.stale ? '上次采样正常' : '')
        )}
        ${operatorCard(
          'WAN 线路',
          `${fmtNumber(ctx.wanHealth.online)} / ${fmtNumber(ctx.wanHealth.total)}`,
          ctx.freshness.stale && ctx.wanHealth.level === 'ok' ? 'warn' : ctx.wanHealth.level,
          `${escapeHtml(history ? '上次采样' : '当前')} · ${escapeHtml(wanAccessSummaryText(ctx.pppoe))} · ${escapeHtml(snapshotStatusText(ctx.routeHealth.text, ctx.freshness))}`,
          wanKpis,
          history ? snapshotStatusText(ctx.wanHealth.label, ctx.freshness) : (ctx.wanHealth.level === 'ok' && ctx.freshness.stale ? '上次采样正常' : ctx.wanHealth.label)
        )}
        ${operatorCard(
          '资源',
          `${fmtPercent(ctx.o.cpuLoad)} / ${fmtPercent(ctx.o.memoryUsage)}`,
          resourceCardLevel,
          `${escapeHtml(history ? '上次采样' : '当前')} · 磁盘 ${fmtPercent(ctx.o.diskUsage)} · ${fmtNumber(ctx.sampleCount)} 点`,
          resourceKpis,
          ctx.resourceLevel === 'ok' && ctx.freshness.stale ? '上次采样正常' : ''
        )}
        ${operatorCard(
          '设备',
          deviceMain,
          deviceLevel,
          deviceSub,
          deviceKpis,
          history ? '上次采样' : (ctx.freshness.stale ? ctx.freshness.label : '')
        )}
      </div>`;
    }

    function renderOverviewTrendCard(ctx) {
      const upChart = rateAxisLineChart(ctx.history.uplink || [], '#165dff', { current: ctx.wanRates.up });
      const downChart = rateAxisLineChart(ctx.history.downlink || [], '#16c67a', { current: ctx.wanRates.down });
      const enough = upChart.count >= 2 && downChart.count >= 2;
      const prefix = samplePrefix(ctx.freshness);
      if (!enough) {
        const labels = historyAwareCapabilityLabels(ctx.capabilities, ctx.freshness);
        return `<div class="card ik-home-density-card is-trend-strip" data-overview-density-module="wan-trend" data-overview-trend-compact>
          <div class="card-head"><div class="card-title">WAN 速率 / 采样</div><div class="subtle">${escapeHtml(prefix)} · 采样不足 · ${escapeHtml(ctx.freshness.source || '未采集')}</div></div>
          <div class="card-body">
            <div class="ik-home-trend-compact is-bar">
              <div class="ik-summary-box"><div class="subtle">${escapeHtml(prefix)}上行</div><b>${fmtRate(ctx.wanRates.up)}</b></div>
              <div class="ik-summary-box"><div class="subtle">${escapeHtml(prefix)}下行</div><b>${fmtRate(ctx.wanRates.down)}</b></div>
              <div class="ik-summary-box"><div class="subtle">采样点</div><b>${fmtNumber(Math.max(upChart.count, downChart.count))}</b></div>
              <div class="ik-summary-box"><div class="subtle">默认路由</div><b>${escapeHtml(ctx.routeHealth.label)}</b></div>
              <div class="ik-summary-box"><div class="subtle">采集能力</div><b>${escapeHtml(labels.sshLabel)}</b></div>
            </div>
          </div>
        </div>`;
      }
      return `<div class="card ik-home-density-card" data-overview-density-module="wan-trend">
        <div class="card-head"><div class="card-title">WAN 线路速率趋势</div><div class="subtle">${escapeHtml(prefix)} · ${fmtRate(ctx.wanRates.up)} / ${fmtRate(ctx.wanRates.down)}</div></div>
        <div class="card-body">
          <div class="ik-wan-rate-split is-main">

    function renderInterfaces(snapshot) {

      const detectedHealthy = pppoe.filter((row) => row.running && row.addresses.length && row.routes.some((route) => route.active)).length;
      const abnormalLines = pppoe.filter((row) => {
        const parent = interfaceByName[row.parent] || {};
        return !row.running || !row.addresses.length || ((parent.rxDrop || 0) + (parent.txDrop || 0) + (parent.rxError || 0) + (parent.txError || 0)) > 0;
      }).length;
      const ipv6Interfaces = interfaces.filter((row) => row.ips.some((ip) => String(ip).includes(':')));
      const virtualInterfaceTypes = new Set(['wg', 'loopback', 'l2tp-out', 'vlan', 'macvlan']);
      const physicalLanInterfaces = interfaces.filter((row) => row.role === 'LAN' && !virtualInterfaceTypes.has(String(row.type || '').toLowerCase()));
      const virtualInterfaces = interfaces.filter((row) => virtualInterfaceTypes.has(String(row.type || '').toLowerCase()));
      const topologyLevel = (warnCount, dangerCount, onlineCount, totalCount) => {
        if (dangerCount > 0) return 'danger';
        if (warnCount > 0) return 'warn';
        if (onlineCount > 0) return 'ok';
        return totalCount > 0 ? 'warn' : 'muted';
      };
      const wanTopologyItems = pppoe.map((row) => {
        const parent = interfaceByName[row.parent] || {};
        const dropTotal = Number(parent.txDrop || 0) + Number(parent.rxDrop || 0);
        const errorTotal = Number(parent.txError || 0) + Number(parent.rxError || 0);
        const hasActiveRoute = (row.routes || []).some((route) => route.active);
        const hasIp = (row.addresses || []).length > 0;
        const isOnline = Boolean(row.running);
        const isWarn = isOnline && (!hasIp || !hasActiveRoute || dropTotal > 0 || errorTotal > 0);
        const level = !isOnline ? 'danger' : isWarn ? 'warn' : 'ok';
        const issueParts = [];
        if (!hasIp) issueParts.push('未分配地址');
        if (!hasActiveRoute) issueParts.push('无活动默认路由');
        if (dropTotal > 0) issueParts.push(`丢包 ${fmtNumber(dropTotal)}`);
        if (errorTotal > 0) issueParts.push(`错误 ${fmtNumber(errorTotal)}`);
        return {
          name: row.name,
          type: row.access || row.kind || 'WAN',
          level,
          running: isOnline,
          upRate: Number(row.upRate || 0),
          downRate: Number(row.downRate || 0),
          txBytes: Number(row.txBytes || 0),
          rxBytes: Number(row.rxBytes || 0),
          addresses: row.addresses || [],
          mac: parent.mac || '-',
          extra: row.parent || '-',
          issue: issueParts.join(' / ') || '状态正常'
        };
      });
      const interfaceTopologyItems = (rows, label) => rows.map((row) => {
        const dropTotal = Number(row.txDrop || 0) + Number(row.rxDrop || 0);
        const errorTotal = Number(row.txError || 0) + Number(row.rxError || 0);
        const hasIp = (row.ips || []).length > 0;
        const isOnline = Boolean(row.running);
        const isWarn = isOnline && (dropTotal > 0 || errorTotal > 0 || (!hasIp && label !== 'VNET'));
        const level = !isOnline ? 'danger' : isWarn ? 'warn' : 'ok';
        const issueParts = [];
        if (!hasIp && label !== 'VNET') issueParts.push('无地址');
        if (dropTotal > 0) issueParts.push(`丢包 ${fmtNumber(dropTotal)}`);
        if (errorTotal > 0) issueParts.push(`错误 ${fmtNumber(errorTotal)}`);
        return {
          name: row.name,
          type: row.type || label,
          level,
          running: isOnline,
          upRate: Number(row.txRate || 0),
          downRate: Number(row.rxRate || 0),
          txBytes: Number(row.txBytes || 0),
          rxBytes: Number(row.rxBytes || 0),
          addresses: row.ips || [],
          gateways: row.gateways || [],

          extra: row.gateways?.length ? row.gateways.join(' / ') : '-',
          issue: issueParts.join(' / ') || '状态正常'

      const buildTopologyGroup = (key, label, items, description) => {

        const danger = items.filter((item) => item.level === 'danger').length;
        return {

          description,

          total: items.length,
          online,
          warn,

          txBytes: items.reduce((sum, item) => sum + item.txBytes, 0),

        <tr>
          <td>${renderEditableNameCell(row, row.ip, '未知设备')}</td>
          <td>${escapeHtml(row.ip)}</td>
          <td>${tag(row.status)}</td>
          <td>${escapeHtml(row.lastSeen || '-')}</td>
          <td>${fmtRate(row.upRate)}</td>
          <td>${fmtRate(row.downRate)}</td>
          <td>${escapeHtml(row.mac || '-')}</td>
          <td>${fmtNumber(row.connections)}</td>
          <td>${fmtBytes(row.sessionBytes)}</td>
        </tr>`).join('');
      const arpRows = snapshot.arp.items.map((row) => `
        <tr>
          <td>${escapeHtml(row.ip)}</td>
          <td>${renderEditableNameCell(row, row.ip, row.ip || '-')}</td>
          <td>${escapeHtml(row.mac)}</td>

          <td>${tag(row.status)}</td>
          <td>${escapeHtml(toDisplayText(row.lastSeen || '-'))}</td>
        </tr>`).join('');
      const leaseRows = snapshot.dhcp.leases.map((row) => `
        <tr>
          <td>${escapeHtml(row.address)}</td>

          <td>${escapeHtml(row.mac)}</td>
          <td>${escapeHtml(row.server)}</td>
          <td>${tag(row.status, row.status === 'bound' ? 'ok' : 'warn')}</td>
          <td>${escapeHtml(toDisplayText(row.lastSeen || '-'))}</td>
          <td>${row.static ? tag('静态', 'info') : tag('动态', 'ok')}</td>

      const ipv6ActiveRows = (snapshot.connections.active || [])
        .filter((row) => String(row.localIp || '').includes(':'))

            <td>${escapeHtml(row.localIp)}</td>
            <td>${escapeHtml(row.remoteIp)}</td>
            <td>${tag(row.protocol, 'info')}</td>
            <td>${fmtRate(row.upRate)}</td>

            <td>${escapeHtml(row.timeout)}</td>
            <td>${escapeHtml(row.mark || '-')}</td>

            <span class="ik-ghost-pill">当前页监控</span>

        body = `

            <div class="card-body">${scaleDisclosure(snapshot, 'terminalIpv6ActiveConnections', (connections.active || []).filter((row) => String(row.localIp || '').includes(':')).length, (connections.active || []).length, 'snapshot.connections.active', 'IPv6 本地地址过滤')}${table(['本地 IPv6', '远端地址', '协议', '实时上行速率', '实时下行速率', '超时', '连接标记'], ipv6ActiveRows, '当前未读取到 IPv6 活跃会话')}</div>
          </div>`;

        body = `

    function renderDns(snapshot) {

        ? `示例中停用 ${fmtNumber(dns.disabledForwardRuleCount || 0)} 条`
        : `停用 ${fmtNumber(dns.disabledForwardRuleCount || 0)} 条`;
      const ruleEmptyText = totalRuleCount
        ? `已检测到 ${fmtNumber(totalRuleCount)} 条规则，当前未读取到可展示的规则明细`
        : '暂无 DNS 静态规则';
      const enabledNdCount = (dns.ipv6Nd || []).filter((row) => row.advertiseDns).length;
      const boundPrefixClients = (dns.ipv6DhcpClients || []).filter((row) => row.status === 'bound').length;
      const listText = (values, fallback = '-') => (values && values.length ? values.map(escapeHtml).join('<br>') : fallback);
      const ndRows = (dns.ipv6Nd || []).map((row) => `

          <td>${escapeHtml(row.interface)}</td>
          <td>${row.advertiseDns ? tag('开启', 'ok') : tag('关闭', 'warn')}</td>
          <td>${listText(row.dnsServers, '未单独指定')}</td>
          <td>${row.managed ? tag('开启', 'info') : tag('关闭', 'ok')}</td>
          <td>${row.otherConfig ? tag('开启', 'info') : tag('关闭', 'ok')}</td>
          <td>${escapeHtml(row.raLifetime || '-')}</td>

      const dhcpClientRows = (dns.ipv6DhcpClients || []).map((row) => `

          <td>${escapeHtml(row.comment || '-')}</td>

        <div class="grid-4">
          ${metricCard('DNS 服务状态', tag(dns.running ? '启用' : '未启用', dns.running ? 'ok' : 'danger'), `上游 DNS ${fmtNumber((dns.servers || []).length)} 个`, dns.dohServer ? 'DoH 已配置' : 'DoH 未配置')}
          ${metricCard('静态规则总数', fmtNumber(totalRuleCount), `当前展示 ${fmtNumber(visibleRuleCount)} 条`, disabledRuleLabel)}
          ${metricCard('IPv6 ND 广播', fmtNumber(enabledNdCount), `配置接口 ${fmtNumber((dns.ipv6Nd || []).length)} 个`, '')}
          ${metricCard('IPv6 Prefix 客户端', fmtNumber(boundPrefixClients), `DHCPv6 Client ${fmtNumber((dns.ipv6DhcpClients || []).length)} 个`, '')}

            {k:'缓存占用', v: `${fmtBytes(dns.cacheUsed || 0)} / ${fmtBytes(dns.cacheSize || 0)}`}

          <div class="card"><div class="card-head"><div class="card-title">IPv6 DNS / RA 概览</div><div class="subtle">来自 ND 与 DHCPv6 Client</div></div><div class="card-body">${infoGrid([
            {k:'ND 广播接口', v: fmtNumber((dns.ipv6Nd || []).length)},
            {k:'已开启广播 DNS', v: fmtNumber(enabledNdCount)},
            {k:'Prefix 已绑定', v: fmtNumber(boundPrefixClients)},

    }
