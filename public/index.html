        ? `状态更新时间 ${noSnapshotUpdateAgeText(ctx.snapshot, ctx.freshness)}`
        : dataStale
          ? `业务快照年龄 ${ctx.freshness.text || '-'}`
          : `数据层最后成功采集 ${shortTimestamp(latestCollectionSuccessTime(ctx))}`;
      const dataText = noSnapshot
        ? '数据可信度不可判定'
        : history
          ? historyCurrentUnknownTitle()
          : freshnessText;
      const summaryText = noSnapshot
        ? noSnapshotAgeLine(ctx.snapshot, ctx.freshness)
        : history
          ? historyCurrentUnknownTitle()
          : channelDegraded
            ? `${channelText} · ${dataText}`
            : dataText;
      const level = noSnapshot || interfacesDown || snapshotError ? 'danger' : channelDegraded || dataStale ? 'warn' : 'ok';
      const label = noSnapshot
        ? '快照缺失'
        : history
          ? historyCurrentUnknownTitle()
          : interfacesDown
            ? '接口转发面异常'
            : snapshotError || channelDegraded
              ? '通道降级'
              : dataStale
                ? '数据陈旧'
                : '采集可用';
      return {
        level,
        label,
        restLabel,
        sshLabel,
        text: summaryText,
        summaryText,
        channelStateText: channelText,
        dataStateText: dataText,
        dataText: freshnessText,
        channelDegraded,
        dataStale,
        channelText,
        failedEndpointText: ctx.failures.count ? ctx.failures.text : '未记录端点失败'
      };
    }

    function buildOverviewVerdict(ctx) {
      const history = isHistorySnapshot(ctx.freshness);
      const snapshotError = String(ctx.snapshot.error || '');
      const noSnapshot = snapshotIsUnavailable(ctx.snapshot) ||
        (ctx.snapshot.status === 'error' && !ctx.freshness?.source && ctx.wanHealth.total === 0 && !ctx.pppoe.length);
      const allWanOffline = !noSnapshot && ctx.wanHealth.total > 0 && ctx.wanHealth.online === 0;
      const interfacesDownActive = !noSnapshot && /接口全 Down|全部接口离线|转发面不可用|接口不可达/.test(snapshotError);
      const staleActive = !noSnapshot && (ctx.freshness.stale || history);
      const collection = collectionDisplayState(ctx, overviewCollectionTrust(ctx));
      const offlineNames = (ctx.offlineWanRows || []).slice(0, 3).map((row) => row.name || row.interface || '').filter(Boolean);
      const routeRiskActive = !noSnapshot && !allWanOffline && !interfacesDownActive && ctx.routeHealth.level === 'danger';
      const wanRiskActive = !noSnapshot && !allWanOffline && (ctx.wanHealth.offline > 0 || ctx.wanHealth.level === 'danger');
      const resourceRiskActive = !noSnapshot && ctx.resourceLevel !== 'ok';
      const collectionRiskActive = !noSnapshot && !history && !interfacesDownActive && collection.level !== 'ok';
      const staleRiskActive = staleActive;
      const wanLabel = 'WAN 部分离线';
      const resourceLabel = ctx.resourceLevel === 'danger' ? '资源满载' : '资源高负载';
      const staleLabel = noSnapshot
        ? '业务快照缺失'
        : history
          ? historyCurrentUnknownTitle()
          : (ctx.freshness.level === 'danger' ? '采样陈旧' : '采样偏旧');
      const historyLabel = history ? historyCurrentUnknownTitle() : '';
      const rules = [
        { key: 'no-snapshot', label: '快照缺失', topLabel: '快照缺失', active: noSnapshot, level: 'danger' },
        { key: 'interfaces-down', label: '接口转发面异常', topLabel: history ? historySnapshotTitle('接口', '异常') : '接口转发面异常', active: interfacesDownActive, level: 'danger' },
        { key: 'wan-offline-all', label: 'WAN 全离线', topLabel: history ? historySnapshotTitle('WAN', '全离线') : 'WAN 全离线', active: allWanOffline, level: 'danger' },
        { key: 'route-danger', label: '默认路由异常', topLabel: history ? historySnapshotTitle('默认路由', '异常') : '默认路由异常', active: routeRiskActive, level: 'danger' },
        { key: ctx.resourceLevel === 'danger' ? 'resource-full' : 'resource-load', label: resourceLabel, topLabel: history ? historySnapshotTitle('资源', ctx.resourceLevel === 'danger' ? '满载' : '高负载') : resourceLabel, active: resourceRiskActive, level: ctx.resourceLevel || 'warn' },
        { key: 'wan-offline', label: wanLabel, topLabel: history ? historySnapshotTitle('WAN', '离线') : wanLabel, active: wanRiskActive, level: ctx.wanHealth.level === 'danger' ? 'danger' : 'warn' },
        { key: 'collection-degraded', label: history ? '采集留存' : '通道状态降级', topLabel: history ? historyCurrentUnknownTitle() : '通道状态降级', active: collectionRiskActive, level: 'warn' },
        { key: 'data-stale', label: staleLabel, topLabel: history ? historyCurrentUnknownTitle() : staleLabel, active: staleRiskActive, level: history ? 'warn' : (ctx.freshness.level === 'danger' ? 'danger' : 'warn') }
      ];
      const top = rules.find((rule) => rule.active) || { key: 'ok', label: '正常', level: 'ok' };
      const topLabel = top.topLabel || top.label;
      const eventAgeText = noSnapshot
        ? `状态更新时间 ${noSnapshotUpdateAgeText(ctx.snapshot, ctx.freshness)}`
        : `事件更新时间 ${snapshotEventAgeText(ctx.snapshot, ctx.freshness)}`;
      const businessAgeText = noSnapshot
        ? '数据可信度不可判定'
        : staleActive
          ? `业务快照年龄 ${ctx.freshness.text || '-'}`
          : `业务快照年龄 ${ctx.freshness.text || '0s'}`;
      const businessTimeText = noSnapshot
        ? '快照缺失'
        : `业务快照时间 ${shortTimestampText(snapshotBusinessTimeText(ctx.snapshot, ctx.freshness))}`;
      const sampleStateText = noSnapshot
        ? noSnapshotStatusLine(ctx.snapshot, ctx.freshness)
        : staleActive
          ? businessAgeText
          : eventAgeText;
      const routeSummary = overviewRouteSummary(ctx);
      const resourceEvidence = ctx.resourceEvidence || resourceEvidenceState(ctx.o || {}, ctx.history || {}, Number(ctx.pollSeconds || 1));
      const resourceText = `CPU ${fmtPercent(ctx.o.cpuLoad)} / 内存 ${fmtPercent(ctx.o.memoryUsage)} / 磁盘 ${fmtPercent(ctx.o.diskUsage)} · ${resourceEvidence.summary || ''}`;
      const wanText = allWanOffline
        ? `WAN ${fmtNumber(ctx.wanHealth.online)}/${fmtNumber(ctx.wanHealth.total)} 全离线`
        : offlineNames.length
          ? `WAN 离线 ${offlineNames.join(' / ')}`
          : `WAN 离线 ${fmtNumber(ctx.wanHealth.offline)} 条`;
      const summary = top.key === 'no-snapshot'
        ? '快照缺失'
        : overviewIsWanIncidentKey(top.key)
          ? topLabel
        : top.key === 'route-danger'
            ? topLabel
            : top.key === 'interfaces-down'
              ? topLabel
            : top.key === 'resource-full'
              ? topLabel
              : top.key === 'resource-load'
                ? topLabel
                : top.key === 'collection-degraded'
                ? (history ? historyCurrentUnknownTitle() : '通道状态降级')
                : top.key === 'data-stale'
                    ? topLabel
                    : topLabel;
      const firstEvidenceText = top.key === 'no-snapshot'
        ? noSnapshotStatusLine(ctx.snapshot, ctx.freshness)
        : overviewIsWanIncidentKey(top.key)
          ? wanText
          : top.key === 'interfaces-down'
            ? snapshotError || '接口转发面异常'
          : top.key === 'route-danger'
            ? (ctx.routeHealth.text || '未发现活动默认路由')
            : top.key === 'resource-full' || top.key === 'resource-load'
              ? resourceText
              : top.key === 'collection-degraded'
                ? collection.text
                : sampleStateText;
      const evidenceTitle = top.key === 'no-snapshot'
        ? '证据：快照缺失'
        : top.key === 'collection-degraded'
          ? '证据：通道状态'
        : top.key === 'resource-full' || top.key === 'resource-load'
          ? '证据：资源'
          : overviewIsWanIncidentKey(top.key)
            ? '证据：WAN 离线'
            : top.key === 'interfaces-down'
              ? '证据：接口状态'
            : top.key === 'ok' ? '证据：采样状态' : `证据：${summary}`;
      const conclusion = top.key === 'no-snapshot'
        ? noSnapshotAgeLine(ctx.snapshot, ctx.freshness)
        : (history && (top.key === 'collection-degraded' || top.key === 'data-stale')
          ? historyCurrentUnknownTitle()
          : summary);
      const conclusionLines = top.key === 'no-snapshot'
        ? [noSnapshotAgeLine(ctx.snapshot, ctx.freshness), '采集通道待确认']
        : [summary, firstEvidenceText];
      const nextAction = top.key === 'no-snapshot'
        ? overviewActionLabels.readonlyDiagnostics
        : overviewIsWanIncidentKey(top.key)
          ? overviewActionLabels.lineStatus
        : top.key === 'route-danger' || top.key === 'interfaces-down'
            ? overviewActionLabels.routes
            : top.key === 'resource-full' || top.key === 'resource-load'
              ? overviewActionLabels.loadAudit
              : top.key === 'collection-degraded'
                ? overviewActionLabels.readonlyDiagnostics
                : top.key === 'data-stale'
                  ? overviewActionLabels.readonlyDiagnostics
                  : overviewActionLabels.routes;
      return {
        level: top.level,
        topKey: top.key,
        topLabel,
        priority: rules,
        conclusion,
        conclusionLines,
        evidenceTitle,
        suggestionText: nextAction,
        supportLine: top.key === 'no-snapshot' ? '采集通道待确认' : firstEvidenceText,
        offlineText: firstEvidenceText,
        routeText: routeSummary,
        accessText: overviewWanAccessImpact(ctx),
        impactText: overviewOfflineImpact(ctx),
        collection,
        nextAction,
        eventAgeText,
        businessTimeText,
        businessAgeText,
        ageFirstText: sampleStateText,
        resourceEvidence,
        historyLabel
      };
    }

    function renderOverviewVerdictPanel(ctx) {
      const v = ctx.verdict || buildOverviewVerdict(ctx);
      const history = isHistorySnapshot(ctx.freshness);
      const priorityItems = v.priority.map((item) => `<div class="ik-home-priority-item${item.active ? ` is-active is-${escapeHtml(item.level)}` : ''}" data-overview-field data-overview-priority="${escapeHtml(item.key)}">${escapeHtml(item.label)}</div>`).join('');
      const conclusionLines = (v.conclusionLines || [v.conclusion]).slice(0, 2);
      const primaryLine = conclusionLines[0] || v.conclusion || v.topLabel;
      const secondaryLine = conclusionLines[1] || v.supportLine || v.ageFirstText;
      const eventAgeText = v.eventAgeText || (v.topKey === 'no-snapshot'
        ? noSnapshotUpdateAgeText(ctx.snapshot, ctx.freshness)
        : snapshotEventAgeText(ctx.snapshot, ctx.freshness));
      const businessTimeText = v.businessTimeText || (v.topKey === 'no-snapshot'
        ? '无'
        : snapshotBusinessTimeText(ctx.snapshot, ctx.freshness));
      const businessAgeText = v.businessAgeText || (v.topKey === 'no-snapshot'
        ? '不可判定'
        : snapshotBusinessAgeText(ctx.snapshot, ctx.freshness));
      const collectionStatusText = v.collection.summaryText || v.collection.text || (history
        ? historyCurrentUnknownTitle()
        : v.collection.level === 'ok'
          ? '可用'
        : v.collection.channelDegraded
          ? (v.collection.label || '通道降级')
          : (v.collection.label || '降级'));
      return `<div class="ik-home-verdict-panel" data-overview-verdict-panel>
        <div class="ik-home-verdict-main is-${escapeHtml(v.level)}" data-overview-main-verdict>
          <div class="ik-home-verdict-title" data-overview-field data-overview-primary-conclusion><div>${escapeHtml(primaryLine)}</div><div>${escapeHtml(secondaryLine)}</div></div>
          <div class="ik-home-verdict-status-bus" data-overview-verdict-status-bus>
            <div class="ik-home-verdict-status-cell" data-overview-field data-overview-status-cell>风险 <b>${escapeHtml(v.topLabel)}</b></div>
            <div class="ik-home-verdict-status-cell" data-overview-field data-overview-status-cell>事件更新时间 <b>${escapeHtml(eventAgeText)}</b><div style="margin-top:2px;">业务快照时间 <b>${escapeHtml(businessTimeText)}</b></div><div style="margin-top:2px;">业务快照年龄 <b>${escapeHtml(businessAgeText)}</b></div></div>
            <div class="ik-home-verdict-status-cell" data-overview-field data-overview-status-cell>采集 <b>${escapeHtml(collectionStatusText)}</b>
              <div style="margin-top:2px;">通道状态 <b>${escapeHtml(v.collection.channelStateText || `REST ${v.collection.restLabel} / SSH ${v.collection.sshLabel}`)}</b></div>
              <div style="margin-top:2px;">数据层状态 <b>${escapeHtml(shortTimestampText(v.collection.dataStateText || v.collection.dataText || '不可判定'))}</b></div>
              <div class="ik-home-action-links" data-overview-next-actions style="display:flex;flex-wrap:wrap;gap:4px;padding:2px 0 0;align-items:center;">
                ${overviewCompactActionLink('#lineStatus', overviewActionLabels.lineStatus, 'lineStatus')}
                ${overviewCompactActionLink('#readonlyDiagnostics', overviewActionLabels.readonlyDiagnostics, 'readonlyDiagnostics')}
                ${overviewCompactActionLink('#routes', overviewActionLabels.routes, 'routes')}
                ${overviewCompactActionLink('#loadAudit', overviewActionLabels.loadAudit, 'loadAudit')}
              </div>
            </div>
          </div>
          <div class="ik-home-verdict-row">
            <div data-overview-field>${escapeHtml(v.evidenceTitle)} <b>${escapeHtml(v.offlineText)}</b></div>
            <div data-overview-field>默认路由 <b>${escapeHtml(v.routeText)}</b></div>
            <div data-overview-field>影响范围 <b>${escapeHtml(v.impactText)}</b></div>
            <div data-overview-field>WAN 分组 <b>${escapeHtml(v.accessText)}</b></div>
          </div>
        </div>
        <div class="ik-home-verdict-side is-${escapeHtml(v.level)}" data-overview-priority-panel>
          <div class="ik-home-verdict-title" data-overview-field>状态排序</div>
          <div class="ik-home-priority-list">${priorityItems}</div>
        </div>
      </div>`;
    }

    function operatorKpis(items) {
      return `<div class="ik-home-operator-kpis">${items.map(([label, value]) => `
        <div data-overview-field><span>${escapeHtml(label)}</span><b>${value}</b></div>`).join('')}</div>`;
    }

    function operatorCard(title, main, level, sub, kpis, stateLabel = '') {
      return `<div class="ik-home-operator-card is-${escapeHtml(level)}">
        <div class="ik-home-operator-head">
          <div class="ik-home-operator-title" data-overview-field>${escapeHtml(title)}</div>
          ${tag(stateLabel || (level === 'danger' ? '异常' : level === 'warn' ? '降级' : '正常'), level)}
        </div>
        <div class="ik-home-operator-main" data-overview-field>${main}</div>
        <div class="ik-home-operator-sub" data-overview-field>${sub}</div>
        ${operatorKpis(kpis)}
      </div>`;
    }

    const mobileOverviewActionLabels = {
      lineStatus: 'WAN明细',
      readonlyDiagnostics: '采集状态',
      loadAudit: '资源阈值',
      routes: '路由快照'
    };

    function mobileOverviewActionLabel(section) {
      const raw = mobileOverviewActionLabels[section] || overviewActionLabels[section] || section;
      return String(raw)
        .replace(new RegExp('^\\s*(?:\\u5efa\\u8bae\\s*[:\\uff1a]?\\s*|\\u67e5\\u770b\\s*)+', 'u'), '')
        .replace(/\s{2,}/g, ' ')
        .trim();
    }

    function overviewMobileLeadSectionKey(ctx, v = ctx.verdict || buildOverviewVerdict(ctx)) {
      const noSnapshot = v.topKey === 'no-snapshot' || snapshotIsUnavailable(ctx.snapshot);
      const allWanOffline = ctx.wanHealth.total > 0 && ctx.wanHealth.online === 0;
      if (noSnapshot) return 'collection';
      if (allWanOffline) return 'wan';
      if (v.topKey === 'interfaces-down') return 'wan';
      if (v.topKey === 'resource-full' || v.topKey === 'resource-load') return 'resource';
      if (v.topKey === 'collection-degraded' || v.topKey === 'collection-down') return 'collection';
      if (v.topKey === 'data-stale') return 'route';
      if (overviewIsRouteIncidentKey(v.topKey)) return 'wan';
      return 'wan';
    }

    function renderOverviewMobileDenseStatus(ctx) {
      const v = ctx.verdict || buildOverviewVerdict(ctx);
      const freshness = mobileFreshnessCopy(ctx.freshness, ctx);
      const history = isHistorySnapshot(ctx.freshness);
      const routeDisplay = overviewRouteDisplay(ctx);
      const collection = v.collection || overviewCollectionTrust(ctx);
      const noSnapshot = v.topKey === 'no-snapshot' || snapshotIsUnavailable(ctx.snapshot);
      const allOffline = v.topKey === 'wan-offline-all' || (overviewIsWanIncidentKey(v.topKey) && ctx.wanHealth.total > 0 && ctx.wanHealth.online === 0);
      const resourceIncident = v.topKey === 'resource-full' || v.topKey === 'resource-load';
      const collectionIncident = v.topKey === 'collection-degraded' || v.topKey === 'collection-down';
      const routeIncident = overviewIsRouteIncidentKey(v.topKey);
      const restLabel = stripChannelPrefix(collection.restLabel, 'REST');
      const sshLabel = stripChannelPrefix(collection.sshLabel, 'SSH');
      const latestSuccessValue = latestCollectionSuccessTime(ctx);
      const latestSuccessShort = shortTimestamp(latestSuccessValue);
      const offlineNames = (ctx.offlineWanRows || [])
        .slice(0, 3)
        .map((row) => row.name || row.interface || '')
        .filter(Boolean);
      const routeHit = overviewRouteHitSummary(ctx.offlineWanRows || []);
      const offlineCountText = noSnapshot
        ? '不可判定'
        : `${fmtNumber(ctx.wanHealth.offline)}/${fmtNumber(ctx.wanHealth.total)}`;
      const offlineObjectText = offlineNames.length
        ? compactListText(offlineNames, 2)
        : (noSnapshot ? '不可判定' : '无');
      const statusShort = overviewIncidentName(ctx, v);
      const wanCell = noSnapshot
        ? '不可判定'
        : `${fmtNumber(ctx.wanHealth.online)}/${fmtNumber(ctx.wanHealth.total)}`;
      const routeCell = noSnapshot ? '不可判定' : overviewRouteMainText(routeDisplay);
      const collectionCell = overviewChannelPair(restLabel, sshLabel);
      const collectionDataCell = collectionIncident
        ? (collection.dataStale ? '陈旧' : '可参考')
        : (snapshotBusinessAgeText(ctx.snapshot, ctx.freshness) || freshness.detail || '-');
      const dataCell = noSnapshot
        ? '不可判定'
        : history
          ? '缓存快照'
          : collectionIncident
            ? '缓存快照'
            : collectionDataCell;
      const statusTone = noSnapshot ? 'warn' : history ? '' : v.level;
      const statusPrefix = noSnapshot || v.level === 'danger'
        ? '异常'
        : history
          ? '历史'
          : v.level === 'warn'
            ? '降级'
            : '正常';
      const resourceWorst = ctx.resourceEvidence?.worst?.stats || null;
      const resourceWorstItem = ctx.resourceEvidence?.worst || null;
      const resourceDurationValue = String(resourceWorst?.durationText || '持续待确认');
      const resourceWorstName = resourceWorstItem?.key || 'DISK';
      const resourceWorstValue = resourceWorstItem ? fmtPercent(resourceWorstItem.value) : fmtPercent(ctx.o.diskUsage);
      const resourceThresholdValue = String(resourceWorst?.thresholdText || '阈待确认').replace(/^阈(?:值)?\s*/, '') || '待确认';
      const resourceMeanValue = resourceWorst?.averageWindowText || '均值-';
      const resourcePeakValue = resourceWorst?.peak === null || resourceWorst?.peak === undefined ? '-' : fmtPercent(resourceWorst.peak);
      const interfaceIncident = v.topKey === 'interfaces-down';
      const hitDefaultValue = resourceIncident
        ? fmtPercent(ctx.o.memoryUsage)
        : noSnapshot
          ? '不可判定'
          : (routeHit.hitText || '0/3');
      const drillLink = (section) => `<a class="ik-mobile-flat-link" href="#${escapeHtml(section)}" data-section="${escapeHtml(section)}" data-overview-action-label>${escapeHtml(mobileOverviewActionLabel(section))}</a>`;
      const deviceName = noSnapshot
        ? 'RouterOS'
        : (ctx.o.identity || ctx.snapshot.meta?.routerHost || ctx.snapshot.meta?.target || '未采集');
      const deviceVersion = noSnapshot
        ? 'RouterOS 当前不可达'
        : (ctx.o.version || 'RouterOS 未采集');
      const deviceUptime = noSnapshot
        ? '运行时长不可判定'
        : (ctx.o.uptime || '-');
      const deviceUpdateText = noSnapshot
        ? noSnapshotUpdateAgeText(ctx.snapshot, ctx.freshness)
        : shortTimestamp(snapshotBusinessTimeText(ctx.snapshot, ctx.freshness) || latestSuccessValue);
      const statusValue = statusShort;
      const statusSide = noSnapshot
        ? '无业务快照 / 默认路由不可判定'
        : collectionIncident
          ? `缓存快照 / 默认路由 ${routeCell}`
          : history
            ? '历史快照 / 当前影响未知'
            : `业务快照年龄 ${snapshotBusinessAgeText(ctx.snapshot, ctx.freshness) || '-'}`;
      const objectMain = noSnapshot
        ? '无业务快照，业务数据不展示'
        : resourceIncident
          ? `CPU ${fmtPercent(ctx.o.cpuLoad)} / MEM ${fmtPercent(ctx.o.memoryUsage)} / DISK ${fmtPercent(ctx.o.diskUsage)}`
        : interfaceIncident
            ? `接口转发面 down ${fmtNumber(ctx.wanHealth.offline || 0)}`
            : allOffline
              ? `WAN ${wanCell} · 全部离线`
              : routeIncident
                ? '默认路由异常'
                : collectionIncident
                  ? '采集通道异常'
                  : offlineNames.length
                    ? `WAN ${wanCell} · ${fmtNumber(ctx.wanHealth.offline)} 条离线`
                    : `WAN ${wanCell}`;
      const objectSide = noSnapshot
        ? '默认路由待判定 · 采集证据优先'
        : resourceIncident
          ? '资源明细下沉'
        : interfaceIncident
            ? `转发面优先 · WAN 0/${fmtNumber(ctx.wanHealth.total)}`
          : (allOffline || routeIncident || offlineNames.length)
              ? '离线对象见下方 · 默认路由异常'
              : collectionIncident
                ? '当前影响未知'
                : `默认路由 ${routeCell}`;
      const evidenceMain = resourceIncident
        ? `CPU${fmtPercent(ctx.o.cpuLoad)} / MEM${fmtPercent(ctx.o.memoryUsage)} / DISK${fmtPercent(ctx.o.diskUsage)}`
        : noSnapshot
          ? `RouterOS 当前不可达 / 默认路由待判定`
          : interfaceIncident
            ? `转发面证据 / 默认路由 ${routeCell}`
            : (collectionIncident || collection.channelDegraded)
              ? collectionCell
              : (allOffline || routeIncident || offlineNames.length)
                ? `默认路由 ${hitDefaultValue} / 离线对象`
                : `采集 ${collectionCell}`;
      const evidenceSide = resourceIncident
        ? `持续${mobileCompactDurationText(resourceDurationValue)} / 峰${resourcePeakValue} / ${collectionCell}`
        : noSnapshot
          ? `${collectionCell} / 最近成功 ${latestSuccessShort}`
          : collectionIncident
            ? `缓存快照 / 最近成功 ${latestSuccessShort}`
        : interfaceIncident
              ? `${collectionCell} / 不替代转发面判断 / WAN 0/${fmtNumber(ctx.wanHealth.total)}`
              : `${collectionCell} / 最近成功 ${latestSuccessShort}`;
      const statusRow = [
        `<div><span>结论</span> <b>状态</b></div>`,
        `<div><span>结论</span> <b data-overview-primary-conclusion>${escapeHtml(statusValue)}</b></div>`,
        `<div><span>采集/路由</span> <b>${escapeHtml(statusSide)}</b></div>`
      ];
      const deviceRow = [
        `<div><span>设备</span> <b>${escapeHtml(deviceName)}</b></div>`,
        `<div><span>版本</span> <b>${escapeHtml(deviceVersion)}</b></div>`,
        `<div><span>运行时长</span> <b>${escapeHtml(deviceUptime)}</b></div>`,
        `<div><span>更新时间</span> <b>${escapeHtml(deviceUpdateText)}</b></div>`
      ];
      const objectRow = [
        `<div><span>对象</span> <b>对象</b></div>`,
        `<div><span>对象</span> <b>${escapeHtml(objectMain)}</b></div>`,
        `<div><span>下沉</span> <b>${escapeHtml(objectSide)}</b></div>`
      ];
      const evidenceRow = [
        `<div><span>证据</span> <b>证据</b></div>`,
        `<div><span>证据</span> <b>${escapeHtml(evidenceMain)}</b></div>`,
        `<div><span>依据</span> <b title="${escapeHtml(latestSuccessValue)}">${escapeHtml(evidenceSide)}</b></div>`
      ];
      const drillLinks = ['lineStatus', 'readonlyDiagnostics', 'routes', 'loadAudit'].map(drillLink).join(' | ');
      const drillRow = [
        `<div class="is-wide"><span>入口：</span> <b>${drillLinks}</b></div>`
      ];
      return `<div class="ik-mobile-flat-table is-${escapeHtml(v.level)}${history ? ' is-history' : ''}" data-overview-mobile-flat-status data-overview-mobile-alert data-overview-mobile-alarm data-overview-mobile-status-table>
        <div class="ik-mobile-flat-table-row is-status" data-overview-mobile-flat-row="status" data-overview-field>${statusRow.join('')}</div>
        <div class="ik-mobile-flat-table-row is-device" data-overview-mobile-flat-row="device" data-overview-field>${deviceRow.join('')}</div>
        <div class="ik-mobile-flat-table-row is-object" data-overview-mobile-flat-row="object" data-overview-field>${objectRow.join('')}</div>
        <div class="ik-mobile-flat-table-row is-evidence" data-overview-mobile-flat-row="evidence" data-overview-field>${evidenceRow.join('')}</div>
        <div class="ik-mobile-flat-table-row is-drill" data-overview-mobile-flat-row="drill" data-overview-field>${drillRow.join('')}</div>
      </div>`;
    }

    function mobileFreshnessCopy(freshness = {}, ctx = null) {
      if (ctx?.verdict?.topKey === 'no-snapshot' || snapshotIsUnavailable(ctx?.snapshot || {})) {
        const snapshot = ctx?.snapshot || {};
        return {
          label: '快照缺失',
          detail: noSnapshotBusinessStateText()
        };
      }
      const history = isHistorySnapshot(freshness);
      if (!freshness?.source) {
        return { label: '未采集', detail: '尚无采样时间' };
      }
      if (history) {
        return {
          label: historyCurrentUnknownTitle(),
          detail: ''
        };
      }
      if (freshness?.stale) {
        return {
          label: '数据陈旧',
          detail: freshness.text ? `距今 ${freshness.text}` : '当前不是实时采样'
        };
      }
      return {
        label: '业务快照',
        detail: freshness.text ? `年龄 ${freshness.text}` : '年龄不可判定'
      };
    }

    function mobileRouteSummary(ctx) {
      const routeHealth = ctx.routeHealth || {};
      const history = isHistorySnapshot(ctx.freshness);
      if (history) {
        return historyCurrentUnknownTitle();
      }
      if (routeHealth.state === 'unavailable' || ctx.snapshot.status === 'error') {
        return routeHealth.text || '默认路由不可判定';
      }
      if (routeHealth.state === 'inactive') {
        return routeHealth.text || '未发现活动默认路由';
      }
      const defaults = ctx.snapshot.routes?.defaultRoutes || [];
      const activeRows = defaults.filter((row) => row.active && !row.disabled);
      const primary = defaults
        .slice()
        .filter((row) => row.active && !row.disabled)
        .sort((a, b) => Number(a.distance || 0) - Number(b.distance || 0))[0];
      if (primary) {
        const gateway = primary.gateway || primary.gatewayStatus || '-';
        const distance = primary.distance ?? '-';
        return `默认路由：active ${fmtNumber(activeRows.length)}，首选 ${gateway}${distance !== '-' ? ` d${distance}` : ''}`;
      }
      if (routeHealth.active) return `默认路由：active ${fmtNumber(routeHealth.active)}`;
      return routeHealth.text || routeHealth.label || '默认路由不可判定';
    }

    function mobileWanEvidenceRows(ctx, limit = 5) {
      const history = isHistorySnapshot(ctx.freshness);
      return (ctx.pppoe || [])
        .slice()
        .sort((a, b) => {
          if (Boolean(a.running) !== Boolean(b.running)) return a.running ? 1 : -1;
          return totalTrafficRate(b) - totalTrafficRate(a);
        })
        .slice(0, limit)
        .map((row) => {
          const activeRoute = (row.routes || []).find((route) => route.active && !route.disabled) || null;
          const routeText = activeRoute
            ? `${history ? '留存 ' : ''}${activeRoute.gateway || activeRoute.gatewayStatus || '-'} d${activeRoute.distance ?? '-'}`
            : '未承载';
          const state = row.running ? (history ? '上次在线' : '在线') : (history ? '曾离线' : '离线');
          const anomalyAttr = row.running ? '' : ` data-overview-anomaly-object="${escapeHtml(row.name || row.interface || '')}"`;
          return `<div class="ik-mobile-wan-row is-flat-wan-row${row.running ? '' : ' is-offline'}" data-overview-mobile-wan-row data-overview-wan-detail-row data-overview-field>
            <b${anomalyAttr}>${escapeHtml(row.name || row.interface || '-')}<small>${escapeHtml(row.parent || row.interface || '-')}</small></b>
            <span class="ik-mobile-wan-state">${escapeHtml(state)}</span>
            <span>${escapeHtml(routeText)} · ${fmtRate(totalTrafficRate(row))}</span>
          </div>`;
        }).join('') || `<div class="ik-mobile-wan-row is-flat-wan-row" data-overview-wan-detail-row data-overview-field><b>未采集 WAN</b><span>-</span><span>-</span></div>`;
    }

    function renderOverviewMobileMiniTable(title, subtitle, headers, rows, rowClass = '', sectionClass = '') {
      const cls = `ik-mobile-detail-row${rowClass ? ` ${rowClass}` : ''}`;
      const visibleTitle = title || '明细';
      const routeRowAttr = /默认路由/.test(String(title || '')) ? ' data-overview-default-route-row' : '';
      const actionLabel = (() => {
        if (/WAN/.test(title)) return '线路';
        if (/采集/.test(title)) return '通道';
        if (/路由|默认/.test(title)) return '快照';
        if (/资源/.test(title)) return '阈值';
        if (/终端/.test(title)) return '排行';
        return '';
      })();
      const ledgerHeaders = (() => {
        const source = Array.isArray(headers) ? headers.slice(0, 3).map((item) => String(item || '')) : [];
        while (source.length < 3) {
          source.push(['对象', '当前', '依据'][source.length]);
        }
        return source.slice(0, 3);
      })();
      const normalizeCells = (row = []) => {
        const cells = Array.isArray(row) ? row : [row];
        const normalized = cells.length <= 3
          ? [...cells]
          : [cells[0], cells[1], cells.slice(2).join(' / ')];
        while (normalized.length < 3) normalized.push('-');
        return normalized.slice(0, 3);
      };
      const body = rows.length
        ? rows.map((row) => `<div class="${cls}" data-overview-field${routeRowAttr}>${normalizeCells(row).map((cell) => `<span>${cell}</span>`).join('')}</div>`).join('')
        : `<div class="${cls}" data-overview-field${routeRowAttr}><span>未采集</span><span>-</span><span>-</span></div>`;
      return `<div class="ik-mobile-compact-section${sectionClass ? ` ${sectionClass}` : ''}" data-overview-mobile-detail-section>
        <div class="ik-mobile-section-head" data-overview-field title="${escapeHtml(title)}">${escapeHtml(visibleTitle)}<span title="${escapeHtml(subtitle || '')}">${escapeHtml(actionLabel)}</span></div>
        <div class="${cls} is-head" data-overview-field>${ledgerHeaders.map((item) => `<span>${escapeHtml(item)}</span>`).join('')}</div>
        ${body}
      </div>`;
    }

    function renderOverviewMobileUnavailableLine(title, reason) {
      return renderOverviewMobileMiniTable(title, reason, ['对象', '当前', '依据'], [[title, '不可用', reason]], '', 'is-unavailable');
    }

    function mobilePeak(values = [], current = 0) {
      const numeric = (values || []).map((value) => Number(value || 0)).filter(Number.isFinite);
      return Math.max(Number(current || 0), ...(numeric.length ? numeric : [0]));
    }

    function mobileCompactDurationText(value = '') {
      return String(value || '0/0')
        .replace(/^持续\s*/, '')
        .replace(/\s+/g, '')
        .replace(/点\/?(\d+)s/i, '/$1')
        .replace(/点/g, '')
        .replace(/s$/i, '');
    }

    function renderOverviewMobileResourceDetail(ctx, limit = null) {
      const noSnapshot = ctx.verdict?.topKey === 'no-snapshot' || snapshotIsUnavailable(ctx.snapshot);
      const visibleRows = (rows) => (limit === null || limit === undefined)
        ? rows
        : rows.slice(0, Math.max(1, Number(limit) || 1));
      if (noSnapshot) {
        return renderOverviewMobileUnavailableLine('资源阈值', '缺少业务快照，资源阈值不可用');
      }
      const resource = ctx.resourceEvidence || {};
      const cpu = resource.cpu || {};
      const memory = resource.memory || {};
      const disk = resource.disk || {};
      return renderOverviewMobileMiniTable('资源阈值', ctx.resourceMeta, ['项目', '当前', '阈值'], visibleRows([
        [`CPU ${escapeHtml(fmtPercent(ctx.o.cpuLoad))}`, escapeHtml((cpu.thresholdText || '阈85').replace('阈值 ', '阈')), escapeHtml(`持续${mobileCompactDurationText(cpu.durationText || '0/0')} 峰${fmtPercent(mobilePeak(ctx.history.cpu, ctx.o.cpuLoad))}`)],
        [`MEM ${escapeHtml(fmtPercent(ctx.o.memoryUsage))}`, escapeHtml((memory.thresholdText || '阈85').replace('阈值 ', '阈')), escapeHtml(`持续${mobileCompactDurationText(memory.durationText || '0/0')} 峰${fmtPercent(mobilePeak(ctx.history.memory, ctx.o.memoryUsage))}`)],
        [`DISK ${escapeHtml(fmtPercent(ctx.o.diskUsage))}`, escapeHtml((disk.thresholdText || '阈90').replace('阈值 ', '阈')), escapeHtml(`持续${mobileCompactDurationText(disk.durationText || '0/0')} 峰${fmtPercent(mobilePeak(ctx.history.disk, ctx.o.diskUsage))}`)],
        ['Conn', escapeHtml(fmtCompact(ctx.connectionTotal)), escapeHtml(`活动${fmtNumber(ctx.activeSessions)} / ${fmtNumber(ctx.sampleCount)}点`)]
      ]), 'is-resource-row', 'is-resource-table');
    }

    function renderOverviewMobileResourcePressureDetail(ctx, limit = null) {
      const interfaces = Array.isArray(ctx.snapshot.interfaces) ? ctx.snapshot.interfaces : [];
      const terminals = Array.isArray(ctx.terminals) ? ctx.terminals : [];
      const topInterface = interfaces
        .slice()
        .sort((a, b) => totalTrafficRate(b, 'txRate', 'rxRate') - totalTrafficRate(a, 'txRate', 'rxRate'))[0] || null;
      const topTerminal = terminals
        .slice()
        .sort((a, b) => totalTrafficRate(b) - totalTrafficRate(a))[0] || null;
      const topTerminalName = topTerminal ? (displayNameFor(topTerminal, topTerminal.ip || '-').displayName || '-') : '-';
      const visibleRows = (rows) => (limit === null || limit === undefined)
        ? rows
        : rows.slice(0, Math.max(1, Number(limit) || 1));
      return renderOverviewMobileMiniTable('资源压力', '连接 / 服务 / 接口吞吐', ['对象', '当前', '依据'], visibleRows([
        ['连接压力', escapeHtml(fmtCompact(ctx.connectionTotal)), escapeHtml(`active ${fmtNumber(ctx.activeSessions)} / 在线 ${fmtNumber(ctx.onlineTerminals || 0)}`)],
        ['服务压力', '未采集', '进程或服务压力未采集'],
        ['接口吞吐', escapeHtml(`${fmtRate(ctx.wanRates.up)} / ${fmtRate(ctx.wanRates.down)}`), escapeHtml(topInterface ? `${topInterface.name || '-'} ${fmtRate(totalTrafficRate(topInterface, 'txRate', 'rxRate'))}` : '未采集接口峰值')],
        ['DNS缓存', '未采集', '当前快照未包含 DNS cache'],
        ['忙终端', escapeHtml(topTerminalName), escapeHtml(topTerminal ? fmtRate(totalTrafficRate(topTerminal)) : '暂无终端流量')],
        ['采样', escapeHtml(fmtNumber(ctx.sampleCount)), escapeHtml(ctx.pollText || '未采集')]
      ]), 'is-resource-row', 'is-resource-pressure-table');
    }

    function renderOverviewMobileCollectionDetail(ctx, limit = null) {
      const meta = ctx.snapshot.meta || {};
      const freshness = mobileFreshnessCopy(ctx.freshness, ctx);
      const history = isHistorySnapshot(ctx.freshness);
      const stale = ctx.freshness?.stale || history;
      const noSnapshot = ctx.verdict?.topKey === 'no-snapshot' || snapshotIsUnavailable(ctx.snapshot);
      const collection = collectionDisplayState(ctx, ctx.verdict?.collection || overviewCollectionTrust(ctx));
      const channelPair = collection.channelText || overviewChannelPair(collection.restLabel, collection.sshLabel);
      const routeDisplay = overviewRouteDisplay(ctx);
      const routeCell = overviewRouteMainText(routeDisplay);
      const tableStateText = noSnapshot ? '采集待确认' : (history ? historyCurrentUnknownTitle() : (collection.channelDegraded ? '通道降级' : freshness.label));
      const visibleRows = (rows) => (limit === null || limit === undefined)
        ? rows
        : rows.slice(0, Math.max(1, Number(limit) || 1));
      if (noSnapshot) {
        return renderOverviewMobileMiniTable('采集通道', `${tableStateText} · 默认路由待判定`, ['事实', '当前', '依据'], visibleRows([
          ['状态更新时间', escapeHtml(noSnapshotUpdateAgeText(ctx.snapshot, ctx.freshness)), escapeHtml(`最近成功 ${shortTimestamp(latestCollectionSuccessTime(ctx))}`)],
          ['RouterOS', ctx.routerState?.label === '等待登录' ? '等待登录' : '当前不可达', tag('不可达', 'warn')],
          ['REST', escapeHtml(collection.restLabel), tag('待确认', 'warn')],
          ['SSH', escapeHtml(collection.sshLabel), tag(/不可达/.test(collection.sshLabel || '') ? '不可达' : '缺依赖', 'warn')],
          ['默认路由', routeDisplay.label || '不可判定', routeDisplay.text || '默认路由待判定'],
          ['失败端点', ctx.failures.count ? fmtNumber(ctx.failures.count) : '未记录', ctx.failures.count ? ctx.failures.text : '未记录'],
          ['业务快照', '无', '无业务快照，业务数据不展示'],
          ['业务边界', '只读展示', 'WAN / 路由 / 资源 / 终端不展示业务数值']
        ]), '', 'is-collection-table');
      }
      const channelState = noSnapshot
        ? tag('待确认', 'warn')
        : history
          ? '留存'
          : (collection.channelDegraded ? tag('降级', 'warn') : '可用');
      const dataState = noSnapshot ? tag('业务不可判定', 'warn') : (history ? '留存' : (stale ? tag('陈旧', 'warn') : (collection.channelDegraded ? '最近成功' : '可用')));
      const failureState = ctx.failures.count
        ? tag('异常', 'warn')
        : collection.channelDegraded
          ? tag('通道异常', 'warn')
        : history
          ? '留存'
          : '未记录';
      return renderOverviewMobileMiniTable('采集通道', `${tableStateText} · ${channelPair}`, ['通道', '当前', '失败端点'], visibleRows([
        ['采集', escapeHtml(collection.channelDegraded ? `缓存快照 / ${channelPair}` : channelPair), channelState],
        ['数据层', escapeHtml(shortTimestampText(collection.dataStateText || collection.dataText || shortTimestamp(latestCollectionSuccessTime(ctx)) || '未采集')), dataState],
        ['失败端点', escapeHtml(ctx.failures.count ? fmtNumber(ctx.failures.count) : (collection.channelDegraded ? `未记录 · 默认路由 ${routeCell}` : '未记录')), failureState]
      ]));
    }

    function renderOverviewMobileNoSnapshotBoundaryDetail(ctx, limit = null) {
      const visibleRows = (rows) => (limit === null || limit === undefined)
        ? rows
        : rows.slice(0, Math.max(1, Number(limit) || 1));
      return renderOverviewMobileMiniTable('业务展示边界', '无业务快照，业务数据不展示', ['对象', '当前', '依据'], visibleRows([
        ['禁用模块', 'WAN / 资源 / 终端 / 速率 / 连接', '业务数据不展示'],
        ['默认路由', '待判定', '缺少当前路由快照'],
        ['可信等级', '链路可参考', '业务状态不可参考'],
        ['只读策略', '不写配置', '不推断业务数值']
      ]), '', 'is-nosnapshot-boundary-table');
    }

    function renderOverviewMobileRouteSummary(ctx, limit = null) {
      const noSnapshot = ctx.verdict?.topKey === 'no-snapshot' || snapshotIsUnavailable(ctx.snapshot);
      const visibleRows = (rows) => (limit === null || limit === undefined)
        ? rows
        : rows.slice(0, Math.max(1, Number(limit) || 1));
      if (noSnapshot) {
        return renderOverviewMobileUnavailableLine('默认路由', '默认路由不可判定');
      }
      const defaults = ctx.snapshot.routes?.defaultRoutes || [];
      const history = isHistorySnapshot(ctx.freshness);
      const stale = ctx.freshness?.stale || history;
      const freshness = mobileFreshnessCopy(ctx.freshness, ctx);
      const routeSummary = mobileRouteSummary(ctx);
      const routeSummaryBody = routeSummary.replace(/^默认路由[:：]\s*/, '');
      const routeState = history
        ? historyCurrentUnknownTitle()
        : (stale ? '默认路由陈旧' : '默认路由正常');
      const rows = defaults
        .slice()
        .sort((a, b) => Number(a.distance || 0) - Number(b.distance || 0))
        .slice(0, 3)
        .map((route) => [
          escapeHtml(route.table || route.routingTable || 'main'),
          escapeHtml(route.gateway || route.gatewayStatus || '-'),
          route.active && !route.disabled ? (history ? '留存' : (stale ? tag('陈旧', 'warn') : 'active')) : tag(route.disabled ? 'disabled' : 'inactive', 'warn')
        ]);
      const routeDisplay = overviewRouteDisplay(ctx);
      const finalRows = rows.length ? rows : [['默认', escapeHtml(routeDisplay.text || '-'), tag(routeDisplay.label, routeDisplay.level)]];
      if (finalRows.length < 2) {
        finalRows.push(['快照', escapeHtml(snapshotBusinessAgeText(ctx.snapshot, ctx.freshness)), history ? '留存' : '采样']);
      }
      return renderOverviewMobileMiniTable('默认路由', history ? `${routeState} · ${routeSummaryBody}` : `${routeState} · ${routeSummaryBody}`, ['表', '网关', '状态'], visibleRows(finalRows));
    }

    function renderOverviewMobileTerminalTop3(ctx, limit = null) {
      if (ctx.verdict?.topKey === 'no-snapshot' || snapshotIsUnavailable(ctx.snapshot)) {
        return renderOverviewMobileUnavailableLine('终端排行', '缺少业务快照，终端排行不可用');
      }
      const { rankedTerminals } = buildOverviewRankData(ctx.snapshot, ctx.freshness);
      const rows = rankedTerminals.slice(0, limit === null || limit === undefined ? 3 : Math.max(1, Number(limit) || 1)).map((row) => {
        const name = displayNameFor(row, row.ip || '-').displayName;
        return [`<b>${escapeHtml(name)}</b><small>${escapeHtml(row.ip || '-')}</small>`, escapeHtml(fmtRate(totalTrafficRate(row))), escapeHtml(fmtNumber(row.connections || 0))];
      });
      return renderOverviewMobileMiniTable('终端排行', overviewRankPollText(ctx.snapshot, ctx.freshness), ['终端', '速率', '连接'], rows, 'is-terminal');
    }

    function renderOverviewMobileWanDetailSection(ctx, limit = 5) {
      const freshness = mobileFreshnessCopy(ctx.freshness, ctx);
      const history = isHistorySnapshot(ctx.freshness);
      const routeSummary = mobileRouteSummary(ctx);
      return `<div class="ik-mobile-compact-section" data-overview-mobile-detail-section data-overview-mobile-wan-table>
        <div class="ik-mobile-section-head" data-overview-field title="${escapeHtml(history ? routeSummary : `${freshness.label} · ${routeSummary}`)}">WAN线路<span>线路</span></div>

        ${mobileWanEvidenceRows(ctx, limit)}
      </div>`;
    }

    function renderOverviewMobileDetailByKey(ctx, key = '', limit = 5) {
      if (key === 'resource') return renderOverviewMobileResourceDetail(ctx, limit);
      if (key === 'resource-pressure') return renderOverviewMobileResourcePressureDetail(ctx, limit);
      if (key === 'no-snapshot-boundary') return renderOverviewMobileNoSnapshotBoundaryDetail(ctx, limit);
      if (key === 'collection') return renderOverviewMobileCollectionDetail(ctx, limit);
      if (key === 'route') return renderOverviewMobileRouteSummary(ctx, limit);
      if (key === 'wan') return renderOverviewMobileWanDetailSection(ctx, limit);
      if (key === 'terminal') return renderOverviewMobileTerminalTop3(ctx, limit);
      return '';
    }

    function renderOverviewMobileDetail(ctx, deviceLine = '', skipFirstSection = '') {
      const v = ctx.verdict || buildOverviewVerdict(ctx);
      const sections = [];
      const pushSection = (key, html) => {
        if (key !== skipFirstSection) sections.push(html);
      };
      if (v.topKey === 'resource-full' || v.topKey === 'resource-load') {
        pushSection('resource', renderOverviewMobileResourceDetail(ctx));
        pushSection('resource-pressure', renderOverviewMobileResourcePressureDetail(ctx));
        pushSection('collection', renderOverviewMobileCollectionDetail(ctx, 3));
        pushSection('route', renderOverviewMobileRouteSummary(ctx, 2));
      } else if (v.topKey === 'collection-degraded' || v.topKey === 'collection-down') {
        pushSection('collection', renderOverviewMobileCollectionDetail(ctx));
        pushSection('resource', renderOverviewMobileResourceDetail(ctx));
        pushSection('route', renderOverviewMobileRouteSummary(ctx));
      } else if (v.topKey === 'data-stale') {
        pushSection('route', renderOverviewMobileRouteSummary(ctx));
        pushSection('resource', renderOverviewMobileResourceDetail(ctx));
        pushSection('collection', renderOverviewMobileCollectionDetail(ctx));
      } else if (v.topKey === 'no-snapshot') {
        pushSection('collection', renderOverviewMobileCollectionDetail(ctx));
        pushSection('no-snapshot-boundary', renderOverviewMobileNoSnapshotBoundaryDetail(ctx));
      } else if (overviewIsRouteIncidentKey(v.topKey)) {
        pushSection('wan', renderOverviewMobileWanDetailSection(ctx));
        pushSection('route', renderOverviewMobileRouteSummary(ctx));
        pushSection('resource', renderOverviewMobileResourceDetail(ctx));
        pushSection('collection', renderOverviewMobileCollectionDetail(ctx));
      } else {
        pushSection('wan', renderOverviewMobileWanDetailSection(ctx));
        pushSection('route', renderOverviewMobileRouteSummary(ctx));
        pushSection('resource', renderOverviewMobileResourceDetail(ctx));
        pushSection('collection', renderOverviewMobileCollectionDetail(ctx));
      }
      if (v.topKey !== 'no-snapshot') {
        sections.push(renderOverviewMobileTerminalTop3(ctx));
      }
      return `<div class="ik-mobile-detail-grid" data-overview-mobile-detail>
        ${sections.join('')}
        ${deviceLine ? `<div class="ik-mobile-device-line" data-overview-mobile-device-line data-overview-field><b>设备</b><span>${escapeHtml(deviceLine)}</span></div>` : ''}
      </div>`;
    }
    function renderOverviewMobileConsole(ctx) {
      const v = ctx.verdict || buildOverviewVerdict(ctx);
      const mobileFreshness = mobileFreshnessCopy(ctx.freshness, ctx);
      const mobileFreshnessText = mobileFreshness.detail ? `${mobileFreshness.label} · ${mobileFreshness.detail}` : mobileFreshness.label;
      const deviceLine = `${ctx.o.identity || ctx.snapshot.meta?.routerHost || ctx.snapshot.meta?.target || '未采集'} | ${ctx.o.version || 'RouterOS 未采集'} | 运行 ${ctx.o.uptime || '-'} | ${mobileFreshnessText}`;
      const firstDetailKey = overviewMobileLeadSectionKey(ctx, v);
      const noSnapshotLedgerOnly = v.topKey === 'no-snapshot' || snapshotIsUnavailable(ctx.snapshot);
      const firstDetail = noSnapshotLedgerOnly ? '' : renderOverviewMobileDetailByKey(ctx, firstDetailKey, firstDetailKey === 'wan' ? 3 : 6);
      const mobileSceneClass = ` is-${String(v.topKey || 'normal').replace(/[^a-z0-9-]/gi, '-')}`;
      return `<div class="ik-mobile-console${mobileSceneClass}" data-overview-mobile-console data-overview-mobile-mode="flat">
        <div class="ik-mobile-first-screen" data-overview-mobile-first-screen>
          ${renderOverviewMobileDenseStatus(ctx)}
          ${firstDetail}
        </div>
        ${renderOverviewMobileDetail(ctx, deviceLine, firstDetail ? firstDetailKey : '')}
      </div>`;
    }

    function overviewSummaryHeadline(ctx, v, focus) {
      const history = isHistorySnapshot(ctx.freshness);
      const narrow = isNarrowViewport();
      if (v.topKey === 'no-snapshot') {
        return (v.conclusionLines || [noSnapshotAgeLine(ctx.snapshot, ctx.freshness)])[0] || noSnapshotAgeLine(ctx.snapshot, ctx.freshness);
      }
      if (overviewIsWanIncidentKey(focus.key)) {
        if (history && narrow) {
          return historySnapshotTitle('WAN', ctx.wanHealth.total > 0 && ctx.wanHealth.online === 0 ? '全离线' : '离线');
        }
        return history
          ? (v.topLabel || historySnapshotTitle('WAN', ctx.wanHealth.total > 0 && ctx.wanHealth.online === 0 ? '全离线' : '离线'))
          : `${v.topLabel} ${fmtNumber(ctx.wanHealth.online)}/${fmtNumber(ctx.wanHealth.total)}`;
      }
      if (history && narrow) {
        if (v.topKey === 'collection-degraded' || v.topKey === 'data-stale') return historyCurrentUnknownTitle();
      }
      return (v.conclusionLines || [v.conclusion]).slice(0, 1)[0] || focus.headline;
    }

    function overviewSummarySubline(ctx, v, focus) {
      const history = isHistorySnapshot(ctx.freshness);
      const narrow = isNarrowViewport();
      const collection = ctx.verdict?.collection || overviewCollectionTrust(ctx);
      const stale = Boolean(ctx.freshness?.stale || history);
      const staleNote = stale
        ? (history
          ? historyCurrentUnknownTitle()
          : `数据陈旧 ${ctx.freshness.text || ''}，影响待判定`)
        : '';
      if (v.topKey === 'no-snapshot') return (v.conclusionLines || []).slice(1, 2)[0] || v.supportLine || '采集通道待确认';
      if (overviewIsWanIncidentKey(focus.key)) {
        const offlineNames = (ctx.offlineWanRows || [])
          .slice(0, 3)
          .map((row) => row.name || row.interface || '')
          .filter(Boolean);
        const offlineText = ctx.wanHealth.total > 0 && ctx.wanHealth.online === 0
          ? `${fmtNumber(ctx.wanHealth.total)} 条 WAN 线路全部离线`
          : `WAN 离线 ${fmtNumber(ctx.wanHealth.offline)}/${fmtNumber(ctx.wanHealth.total)}`;
        const routeText = overviewRouteDisplay(ctx).text || '默认路由待确认';
        const historyPrefix = history
          ? (narrow
            ? `${historySnapshotTitle('WAN', ctx.wanHealth.total > 0 && ctx.wanHealth.online === 0 ? '全离线' : '离线')} · `
            : `${historyCurrentUnknownTitle()} · `)
          : '';
        return `${historyPrefix}${offlineText} · ${offlineNames.length ? `离线对象 ${offlineNames.join(' / ')}` : routeText}`;
      }
      if (focus.key === 'resource-full') return focus.subline;
      if (focus.key === 'collection-down') return narrow ? (history ? historyCurrentUnknownTitle() : (collection.summaryText || '通道状态降级')) : (staleNote ? `${staleNote} / ${focus.subline}` : focus.subline);
      if (focus.key === 'stale-yellow') return history
        ? `${historyCurrentUnknownTitle()} / ${focus.summaryNote || focus.summaryEvidence}`
        : `数据偏旧 / ${focus.summaryEvidence}`;
      const candidate = narrow
        ? (v.supportLine || focus.subline)
        : ((v.conclusionLines || []).slice(1, 2)[0] || v.supportLine || focus.subline);
      return candidate === (v.conclusionLines || [])[0] ? focus.subline : candidate;
    }

    function renderOverviewSummary(ctx) {
      const verdict = ctx.verdict || buildOverviewVerdict(ctx);
      const focus = overviewDesktopFocus(ctx);
      const noSnapshot = verdict.topKey === 'no-snapshot';

      const summaryItems = noSnapshot
        ? noSnapshotItems

          ? overviewInterfaceForwardingEvidenceItems(ctx, focus)
          : overviewIsRouteIncidentKey(focus.key)

      return `<div class="ik-home-summary-shell ik-home-desktop" data-overview-summary data-overview-summary-main data-overview-desktop-top data-overview-summary-focus="${escapeHtml(focus.key)}">
        ${renderOverviewStatusBar(ctx)}
        ${noSnapshot
          ? overviewFlatModule(
            'no-snapshot-summary',
            '状态摘要',
            '采集链路 / 业务展示 / 下次尝试',
            overviewEvidenceGrid(noSnapshotItems, 2, 'is-no-snapshot-grid'),
            'data-overview-no-snapshot-summary',
            'ik-home-key-evidence'
          )
          : overviewStateSummaryTable(ctx, focus)}
        ${noSnapshot ? '' : overviewKeyEvidenceTable(ctx, summaryItems, focus)}
      </div>`;
    }

    function renderOverviewTrendCard(ctx) {
      const noSnapshot = ctx.verdict?.topKey === 'no-snapshot' || snapshotIsUnavailable(ctx.snapshot);
      const prefix = samplePrefix(ctx.freshness);
      const collection = ctx.verdict?.collection || overviewCollectionTrust(ctx);
      const labels = overviewCollectionChannelLabels(ctx, collection);
      const channelText = collection.channelText || overviewChannelPair(labels.restLabel, labels.sshLabel);
      if (noSnapshot) {
        const latestSuccess = latestCollectionSuccessTime(ctx);
        const routeDisplay = overviewRouteDisplay(ctx);
        const failureValue = ctx.failures.count ? fmtNumber(ctx.failures.count) : '未记录';
        const rows = [
          ['采集通道', channelText, collection.summaryText || collection.label || '通道状态'],
          ['默认路由', routeDisplay.label || '不可判定', routeDisplay.text || '默认路由待判定'],
          ['失败端点', failureValue, ctx.failures.count ? ctx.failures.text : '未记录'],
          ['业务边界', '只读展示', 'WAN / 路由 / 资源 / 终端不展示业务数值'],

          ['下次尝试', ctx.pollText || '未采集', '轮询中，不承诺可达']
        ];
        return overviewFlatModule(
          'no-snapshot-trend',
          '采集链路',
          `默认路由待判定 · ${prefix} · ${ctx.freshness.source || '未采集'}`,
          compactTable(['项', '当前', '说明'], rows.map(([a, b, c]) => `<tr data-overview-field><td>${escapeHtml(a)}</td><td><b>${escapeHtml(String(b))}</b></td><td>${escapeHtml(String(c))}</td></tr>`), '无采集链路账本'),
          'data-overview-trend-compact',
          'is-trend-strip'
        );
      }
      const upChart = rateAxisLineChart(ctx.history.uplink || [], '#165dff', { current: ctx.wanRates.up });
      const downChart = rateAxisLineChart(ctx.history.downlink || [], '#16c67a', { current: ctx.wanRates.down });
      const enough = upChart.count >= 2 && downChart.count >= 2;
      if (!enough) {
        const routeDisplay = overviewRouteDisplay(ctx);
        const rows = [
          ['上行', fmtRate(ctx.wanRates.up), `样本 ${fmtNumber(upChart.count)}/6，趋势暂不可用`],
          ['下行', fmtRate(ctx.wanRates.down), `样本 ${fmtNumber(downChart.count)}/6，趋势暂不可用`],
          ['默认路由', routeDisplay.label || '不可判定', routeDisplay.text || '不可判定'],
          ['采集通道', channelText, collection.summaryText || collection.label || '通道状态'],
          ['采样点', fmtNumber(Math.max(upChart.count, downChart.count)), ctx.freshness.source || '未采集']
        ];
        return overviewFlatModule(
          'wan-trend',
          'WAN速率',
          `WAN 速率 · ${prefix} · ${ctx.freshness.source || '未采集'}`,
        compactTable(['项', '当前', '说明'], rows.map(([a, b, c]) => `<tr data-overview-field><td>${escapeHtml(a)}</td><td><b>${escapeHtml(String(b))}</b></td><td>${escapeHtml(String(c))}</td></tr>`), '样本 0/6，趋势暂不可用'),
          'data-overview-trend-compact',
          'is-trend-strip'
        );
      }
      return overviewFlatModule(
        'wan-trend',
        'WAN速率',
        `WAN 速率 · ${prefix} · ${fmtRate(ctx.wanRates.up)} / ${fmtRate(ctx.wanRates.down)}`,
        compactTable(['项', '当前', '说明'], [
          `<tr data-overview-field><td>上行</td><td><b>${fmtRate(ctx.wanRates.up)}</b></td><td>峰 ${fmtRate(upChart.peak || ctx.wanRates.up)}</td></tr>`,
          `<tr data-overview-field><td>下行</td><td><b>${fmtRate(ctx.wanRates.down)}</b></td><td>峰 ${fmtRate(downChart.peak || ctx.wanRates.down)}</td></tr>`,
          `<tr data-overview-field><td>采样点</td><td><b>${fmtNumber(Math.max(upChart.count, downChart.count))}</b></td><td>${escapeHtml(ctx.pollText || '未采集')}</td></tr>`
        ], '暂无 WAN 速率'),
        'data-overview-trend-compact'
      );
    }

      const wanUpChartLabel = selectedWanLine ? `${selectedWanLine.name} 上行速率` : 'WAN 上行速率';
      const wanDownChartLabel = selectedWanLine ? `${selectedWanLine.name} 下行速率` : 'WAN 下行速率';
      const syncState = o.ntpStatus === 'synchronized'
        ? tag('已同步', 'ok')
        : o.ntpStatus

          : '未采集';
      const accessSummary = [...new Set(pppoe.map((row) => row.access || row.kind).filter(Boolean))].join(' / ') || '未采集';
      const accessBuckets = wanAccessBuckets(pppoe);
      const routeHealth = defaultRouteHealth(snapshot, pppoe);
      const panelState = panelHealthState(snapshot);
      const routerState = routerosConnectionState(snapshot);
      const risk = highestRiskMetric(snapshot);
      const failures = failedEndpointSummary(snapshot);
      const resourceLevel = Number(o.cpuLoad || 0) >= 85 || Number(o.memoryUsage || 0) >= 85 || Number(o.diskUsage || 0) >= 90
        ? 'danger'
        : Number(o.cpuLoad || 0) >= 70 || Number(o.memoryUsage || 0) >= 70 || Number(o.diskUsage || 0) >= 80
          ? 'warn'
          : 'ok';
      const freshness = snapshotFreshnessState(snapshot);
      const wanHealth = wanHealthState(pppoe, routeHealth);
      const collectionRisk = collectionRiskState(snapshot, freshness, failures);
      const capabilities = snapshot.meta?.capabilities || {};
      const offlineWanRows = pppoe.filter((row) => !row?.running);
      const ctx = {
        snapshot,
        o,
        pppoe,
        history,
        wanRates,
        accessBuckets,
        routeHealth,
        panelState,
        routerState,
        risk,
        failures,
        freshness,
        wanHealth,
        collectionRisk,
        capabilities,
        offlineWanRows,
        resourceLevel,
        sampleCount,
        pollText,
        resourceMeta,
        resourceEvidence,
        connectionTotal,
        activeSessions,
        onlineTerminals,
        terminalGroups,
        terminals,
        connections
      };
      ctx.verdict = buildOverviewVerdict(ctx);
      const overviewSceneClass = ` is-overview-${String(ctx.verdict.topKey || 'normal').replace(/[^a-z0-9-]/gi, '-')}`;
      const trustModeClass = `${isHistorySnapshot(freshness) ? ' is-history-snapshot' : ''}${overviewSceneClass}`;
      return section('只读状态首页', 'overview', '', `
        <div class="ik-home-trust-mode${trustModeClass}" data-overview-trust-mode="${isHistorySnapshot(freshness) ? 'history' : 'live'}">

          <div class="ik-home-layout ik-home-desktop" data-overview-desktop-workspace>
            <div class="stack">
              ${renderOverviewSummary(ctx)}
              ${ctx.verdict.topKey === 'no-snapshot' || ctx.verdict.topKey === 'resource-full' || ctx.verdict.topKey === 'resource-load' ? renderOverviewDesktopDetail(snapshot, ctx) : renderOverviewTrendCard(ctx)}

            <div class="stack ik-home-side-stack">

    function renderInterfaces(snapshot) {
      currentInterfaceView = normalizeInterfaceView(currentInterfaceView);
      currentInterfaceTopology = normalizeInterfaceTopology(currentInterfaceTopology);
      const interfaces = snapshot.interfaces || [];
      const pppoe = getWanRows(snapshot);
      const interfaceByName = Object.fromEntries(interfaces.map((row) => [row.name, row]));
      const runningWan = pppoe.filter((row) => row.running).length;
      const runningLan = interfaces.filter((row) => row.role === 'LAN' && row.running).length;
      const virtualCount = interfaces.filter((row) => ['wg', 'loopback', 'l2tp-out'].includes(row.type)).length;
      const detectedHealthy = pppoe.filter((row) => row.running && row.addresses.length && row.routes.some((route) => route.active)).length;
      const abnormalLines = pppoe.filter((row) => {
        const parent = interfaceByName[row.parent] || {};
        return !row.running || !row.addresses.length || ((parent.rxDrop || 0) + (parent.txDrop || 0) + (parent.rxError || 0) + (parent.txError || 0)) > 0;
      }).length;
      const ipv6Interfaces = interfaces.filter((row) => row.ips.some((ip) => String(ip).includes(':')));
      const virtualInterfaceTypes = new Set(['wg', 'loopback', 'l2tp-out', 'vlan', 'macvlan']);
      const physicalLanInterfaces = interfaces.filter((row) => row.role === 'LAN' && !virtualInterfaceTypes.has(String(row.type || '').toLowerCase()));
      const virtualInterfaces = interfaces.filter((row) => virtualInterfaceTypes.has(String(row.type || '').toLowerCase()));
      const topologyLevel = (warnCount, dangerCount, onlineCount, totalCount) => {
        if (dangerCount > 0) return 'danger';
        if (warnCount > 0) return 'warn';
        if (onlineCount > 0) return 'ok';
        return totalCount > 0 ? 'warn' : 'muted';
      };
      const wanTopologyItems = pppoe.map((row) => {
        const parent = interfaceByName[row.parent] || {};
        const dropTotal = Number(parent.txDrop || 0) + Number(parent.rxDrop || 0);
        const errorTotal = Number(parent.txError || 0) + Number(parent.rxError || 0);
        const hasActiveRoute = (row.routes || []).some((route) => route.active);
        const hasIp = (row.addresses || []).length > 0;
        const isOnline = Boolean(row.running);
        const isWarn = isOnline && (!hasIp || !hasActiveRoute || dropTotal > 0 || errorTotal > 0);
        const level = !isOnline ? 'danger' : isWarn ? 'warn' : 'ok';
        const issueParts = [];
        if (!hasIp) issueParts.push('未分配地址');
        if (!hasActiveRoute) issueParts.push('无活动默认路由');
        if (dropTotal > 0) issueParts.push(`丢包 ${fmtNumber(dropTotal)}`);
        if (errorTotal > 0) issueParts.push(`错误 ${fmtNumber(errorTotal)}`);
        return {
          name: row.name,
          type: row.access || row.kind || 'WAN',
          level,
          running: isOnline,
          upRate: Number(row.upRate || 0),
          downRate: Number(row.downRate || 0),
          txBytes: Number(row.txBytes || 0),
          rxBytes: Number(row.rxBytes || 0),
          addresses: row.addresses || [],
          mac: parent.mac || '-',
          extra: row.parent || '-',
          issue: issueParts.join(' / ') || '状态正常'
        };
      });
      const interfaceTopologyItems = (rows, label) => rows.map((row) => {
        const dropTotal = Number(row.txDrop || 0) + Number(row.rxDrop || 0);
        const errorTotal = Number(row.txError || 0) + Number(row.rxError || 0);
        const hasIp = (row.ips || []).length > 0;
        const isOnline = Boolean(row.running);
        const isWarn = isOnline && (dropTotal > 0 || errorTotal > 0 || (!hasIp && label !== 'VNET'));
        const level = !isOnline ? 'danger' : isWarn ? 'warn' : 'ok';
        const issueParts = [];
        if (!hasIp && label !== 'VNET') issueParts.push('无地址');
        if (dropTotal > 0) issueParts.push(`丢包 ${fmtNumber(dropTotal)}`);
        if (errorTotal > 0) issueParts.push(`错误 ${fmtNumber(errorTotal)}`);
        return {
          name: row.name,
          type: row.type || label,
          level,
          running: isOnline,
          upRate: Number(row.txRate || 0),
          downRate: Number(row.rxRate || 0),
          txBytes: Number(row.txBytes || 0),
          rxBytes: Number(row.rxBytes || 0),
          addresses: row.ips || [],
          gateways: row.gateways || [],
          mac: row.mac || '-',
          extra: row.gateways?.length ? row.gateways.join(' / ') : '-',
          issue: issueParts.join(' / ') || '状态正常'
        };
      });
      const buildTopologyGroup = (key, label, items, description) => {
        const online = items.filter((item) => item.running).length;
        const warn = items.filter((item) => item.level === 'warn').length;
        const danger = items.filter((item) => item.level === 'danger').length;
        return {
          key,
          label,
          description,
          items,
          total: items.length,
          online,
          warn,
          danger,
          upRate: items.reduce((sum, item) => sum + item.upRate, 0),
          downRate: items.reduce((sum, item) => sum + item.downRate, 0),
          txBytes: items.reduce((sum, item) => sum + item.txBytes, 0),
          rxBytes: items.reduce((sum, item) => sum + item.rxBytes, 0),
          level: topologyLevel(warn, danger, online, items.length)

      };
      const topologyGroups = {
        wan: buildTopologyGroup('wan', 'WAN', wanTopologyItems, '按 WAN 线路聚合显示接入方式、活动路由与实时上下行'),

      if (!topologyGroups[currentInterfaceTopology]?.items.length) {

      const topologyDetailItems = selectedTopology.key === 'wan'

          .slice()
          .sort((a, b) => ((b.upRate + b.downRate) - (a.upRate + a.downRate)));
      const topologyDetailRows = topologyDetailItems.map((item) => {
          if (selectedTopology.key === 'wan') {

            const gradient = item.level === 'danger'

                : 'linear-gradient(90deg,#7da8ff 0%,#165dff 100%)';
            return `<div class="line-bar"><div class="line-name">${escapeHtml(item.name)}</div>${progress(percent, gradient)}<div class="line-share">${fmtRate(totalRate)}</div></div>`;
          }).join('')
        : emptyBlock(`暂无 ${selectedTopology.label} 状态对象`);
      const lineTrendRows = getLineTrendRows(pppoe);
      const lineTrendBlock = renderLineTrendGrid(lineTrendRows, {
        colors: ['#4a95ef', '#30c36b'],
        emptyText: '未采集到 WAN 线路历史数据'
      });
      const tabs = `
        <div class="ik-subtabs">
          <button class="ik-subtab ${currentInterfaceView === 'monitor' ? 'is-active' : ''}" type="button" data-interface-view="monitor">线路状态</button>
          <button class="ik-subtab ${currentInterfaceView === 'detect' ? 'is-active' : ''}" type="button" data-interface-view="detect">线路状态明细</button>
          <button class="ik-subtab ${currentInterfaceView === 'ipv6' ? 'is-active' : ''}" type="button" data-interface-view="ipv6">IPv6 线路详情</button>
        </div>`;
      const toolbar = `
        <div class="ik-data-toolbar">
          <div class="ik-ghost-group">
            <span class="ik-ghost-pill is-active">${escapeHtml(interfaceViews[currentInterfaceView].title)}</span>
            <button class="ik-ghost-pill" type="button" data-interface-refresh="current">刷新当前页数据</button>
          </div>
          <div class="ik-ghost-group">
            <button class="ik-ghost-pill ${interfaceReadonlyOpen ? 'is-active' : ''}" type="button" data-interface-readonly-toggle="true">只读状态</button>
          </div>
        </div>`;
      let body = '';
      if (currentInterfaceView === 'detect') {
        body = `
          ${readonlyNotice}
          ${toolbar}
          <div class="grid-4">
            ${metricCard('在线线路', fmtNumber(runningWan), `总线路 ${fmtNumber(pppoe.length)} 条`, '')}
            ${metricCard('健康线路', fmtNumber(detectedHealthy), '同时满足在线 / 已分配 / 活动默认路由', '')}
            ${metricCard('异常线路', fmtNumber(abnormalLines), '离线、未分配或接口异常', '')}
            ${metricCard('IPv6 接口', fmtNumber(ipv6Interfaces.length), '仅统计真实读取到 IPv6 的接口', '')}
          </div>
          <div class="card" style="margin-top:12px">
            <div class="card-head"><div class="card-title">线路状态明细</div><div class="subtle">按当前实时状态展示</div></div>
            <div class="card-body">${scaleDisclosure(snapshot, 'interfaceLineStatus', pppoe.length, pppoe.length, 'snapshot.wan + snapshot.interfaces', '当前线路顺序')}${table(['线路', '拨号状态', 'IP 状态', '父接口', '默认路由', '实时上行速率', '实时下行速率', '丢包/错误'], detectRows, '暂无线路状态明细数据')}</div>

      } else if (currentInterfaceView === 'ipv6') {

          ${toolbar}
          <div class="grid-4">

            ${metricCard('在线 IPv6 接口', fmtNumber(ipv6Interfaces.filter((row) => row.running).length), '当前运行中', '')}
            ${metricCard('在线 WAN', fmtNumber(runningWan), '实时拨号状态', '')}

          <div class="card" style="margin-top:12px">
