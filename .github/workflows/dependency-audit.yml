name: Dependency audit

on:
  push:
    branches: [main]
    paths: ["requirements.txt", "package.json", "package-lock.json", ".github/workflows/dependency-audit.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (Python dependencies)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and pip-audit
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pip-audit

      - name: Audit installed packages
        run: python -m pip_audit --desc --format markdown

  npm-audit:
    name: npm audit (frontend build tooling)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: npm audit (production deps)
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit --omit=dev || true
