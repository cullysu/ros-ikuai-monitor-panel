name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linux-validation:
    name: Linux validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Python syntax and collector regressions
        run: |
          python -m py_compile app.py tools/check-collector-regressions.py tools/convert-oci-to-routeros-docker-archive.py
          python tools/check-collector-regressions.py

      - name: Core unit tests (boundary parsing/building)
        run: python -m unittest discover -s tests -t . -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Chromium and CJK fonts for browser evidence
        run: |
          npx -y playwright@1.61.1 install --with-deps chromium
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          CHROME="$(find "$HOME/.cache/ms-playwright" -type f -path '*chrome-linux/chrome' | head -1)"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"

      - name: LAN/default documentation checks
        run: |
          node tools/check-lan-access-defaults.js
          node tools/check-public-release-readiness.js

      - name: Frontend and tool JavaScript syntax
        run: |
          shopt -s nullglob
          # 默认 index 只引用 /assets/framework/ 下的 hash 产物（由 vite/esbuild 在
          # 构建时把关，framework-asset-identity.js 校验 manifest 摘要），不再对
          # public/ 产物跑 node --check；这里只检查仓库自有的 tools JS。
          for file in tools/*.js tools/**/*.js; do
            node --check "$file"
          done
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('public/index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)]
            .map((match) => match[1])
            .filter((source) => source.trim());
          scripts.forEach((source, index) => {
            new vm.Script(source, { filename: `public/index.html#inline-${index + 1}.js` });
          });
          // React 壳契约：默认 index 必须引用 manifest 记录的 surface loader。
          const manifest = JSON.parse(fs.readFileSync('public/assets/framework/manifest.json', 'utf8'));
          const loaderSrc = `/assets/framework/${manifest.assets.loader.file}`;
          if (!html.includes(loaderSrc)) {
            throw new Error(`public/index.html does not reference the manifest surface loader: ${loaderSrc}`);
          }
          NODE

      - name: Docker Compose config
        run: docker compose --env-file .env.docker.example config --quiet

      - name: Public browser predeploy smoke
        run: |
          node tools/local-predeploy-check.js \
            --profile public \
            --viewports desktop=1366x900,narrow=390x844 \
            --sections overview,interfaces,trafficLoad,terminals,connections \
            --scale-scenarios single,fleet \
            --strict-responsive \
            --out _acceptance/ci-public-predeploy

      - name: Upload public browser predeploy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-public-predeploy
          path: _acceptance/ci-public-predeploy
          if-no-files-found: ignore

      - name: Installer shell checks
        run: |
          bash -n install.sh
          bash -n tools/build-routeros-container-archive.sh
          bash -n deploy_linux.sh
          bash tools/validate-public-install.sh

      - name: Docker image and RouterOS archive build
        run: |
          bash tools/build-routeros-container-archive.sh \
            --platform linux/amd64 \
            --tag routeros-triage-panel:routeros-ci \
            --output /tmp/routeros-triage-panel-routeros-ci.tar
          tar -tf /tmp/routeros-triage-panel-routeros-ci.tar | grep -Fx manifest.json
          tar -tf /tmp/routeros-triage-panel-routeros-ci.tar | grep -Fx repositories
          tar -tf /tmp/routeros-triage-panel-routeros-ci.tar | grep -E '/layer\.tar$'

  cross-platform-tests:
    name: Cross-platform unit tests (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Core unit tests
        run: python -m unittest discover -s tests -t . -v

  windows-packaging:
    name: Windows packaging
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: "Core unit tests (Windows: DPAPI secret round-trip)"
        run: python -m unittest discover -s tests -t . -v

      - name: Packaging preflight
        shell: pwsh
        run: .\tools\check-packaging-preflight.ps1 -StrictInstall -SkipDocker

      - name: Build Windows EXE directory
        shell: pwsh
        run: .\tools\build-windows-exe.ps1 -NoZip

      - name: Verify bundled public assets and env defaults
        shell: pwsh
        run: |
          $index = Get-ChildItem -Recurse .\dist\routeros-triage-panel -Filter index.html | Select-Object -First 1
          if (-not $index) { throw "Bundled public/index.html was not found." }
          $bundleRoot = Split-Path -Parent $index.FullName
          # 默认 index 是 React 壳：钉子从 vanilla 字符串改为 framework 产物存在性——
          # index 引用的 surface loader 必须在 dist 里，且 framework 至少有一个 >100KB 的
          # 桌面/移动 bundle（React 前端本体）与 manifest.json。
          $indexHtml = Get-Content -Raw -LiteralPath $index.FullName
          $loaderRef = [regex]::Match($indexHtml, '/assets/framework/(panel-surface-loader\.[0-9a-f]{12}\.js)').Groups[1].Value
          if (-not $loaderRef) { throw "Bundled public/index.html does not reference a framework surface loader." }
          $loaderPath = Join-Path $bundleRoot "assets/framework/$loaderRef"
          if (-not (Test-Path -LiteralPath $loaderPath)) { throw "Bundled surface loader is missing: $loaderRef" }
          $manifestPath = Join-Path $bundleRoot "assets/framework/manifest.json"
          if (-not (Test-Path -LiteralPath $manifestPath)) { throw "Bundled framework manifest.json is missing." }
          $bigBundle = Get-ChildItem -LiteralPath (Join-Path $bundleRoot "assets/framework") -Filter "panel-*.js" -File |
            Where-Object { $_.Name -ne $loaderRef -and $_.Length -gt 100KB }
          if (-not $bigBundle) { throw "Bundled framework desktop/mobile bundle (>100KB) is missing." }
          $envFile = ".\dist\routeros-triage-panel\routeros-panel.env"
          Select-String -Path $envFile -Pattern "ROS_PANEL_BIND=127.0.0.1" -Quiet | ForEach-Object {
            if (-not $_) { throw "Windows env is missing loopback bind default." }
          }
          Select-String -Path $envFile -Pattern "ROS_PANEL_TRUST_PROXY_HEADERS=0" -Quiet | ForEach-Object {
            if (-not $_) { throw "Windows env is missing proxy header default." }
          }
          Select-String -Path $envFile -Pattern "ROS_PANEL_ALLOW_LOCALHOST_HOST_FORWARD=0" -Quiet | ForEach-Object {
            if (-not $_) { throw "Windows env is missing localhost host-forward default." }
          }
          Select-String -Path $envFile -Pattern "ROS_PANEL_LOCALHOST_FORWARD_TOKEN=" -Quiet | ForEach-Object {
            if (-not $_) { throw "Windows env is missing localhost forward token default." }
          }
          Select-String -Path $envFile -Pattern "ROS_PANEL_PROFILE=routeros_only" -Quiet | ForEach-Object {
            if (-not $_) { throw "Windows env is missing RouterOS-only profile default." }
          }
          Select-String -Path $envFile -Pattern "ROS_PANEL_NETWORK_WRITE_ENABLED=1" -Quiet | ForEach-Object {
            if (-not $_) { throw "Windows env is missing panel address write default." }
          }
