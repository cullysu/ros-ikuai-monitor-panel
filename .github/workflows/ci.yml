name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linux-validation:
    name: Linux validation
    runs-on: ubuntu-latest
    env:
      CODEX_MEMORY_LIMIT_MB: "2048"
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Python syntax and collector regressions
        run: |
          python -m py_compile app.py panel_backend/api_schema.py panel_backend/collector_evidence.py panel_backend/collector_service.py panel_backend/collector_transport.py panel_backend/config_store.py panel_backend/http_dispatcher.py panel_backend/router_transport.py panel_backend/session_security.py panel_backend/snapshot_builder.py panel_backend/static_assets.py panel_backend/time_contract.py tools/check-backend-security.py tools/check-backend-release-blockers.py tools/check-collector-regressions.py tools/check-static-assets.py tools/convert-oci-to-routeros-docker-archive.py
          python tools/check-backend-security.py
          python tools/check-backend-release-blockers.py
          python tools/check-collector-regressions.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript contract check
        run: npm run check:types

      - name: Build and verify committed frontend assets
        run: |
          npm run build
          python tools/check-static-assets.py
          git diff --exit-code -- public/index.html public/assets/framework

      - name: Runtime schema and section evidence contracts
        run: |
          npm run check:runtime-schema
          npm run check:sections

      - name: Overview architecture and release-blocker contracts
        run: |
          npm run check:overview
          node tools/check-release-blockers.js

      - name: LAN/default documentation checks
        run: |
          node tools/check-lan-access-defaults.js
          node tools/check-public-release-readiness.js --static-only

      - name: Frontend and tool JavaScript syntax
        run: |
          for file in public/*.js tools/*.js; do
            node --check "$file"
          done
          node --check public/assets/framework/panel-framework.js
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('public/index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)]
            .map((match) => match[1])
            .filter((source) => source.trim());
          scripts.forEach((source, index) => {
            new vm.Script(source, { filename: `public/index.html#inline-${index + 1}.js` });
          });
          NODE

      - name: Docker Compose config
        run: docker compose --env-file .env.docker.example config --quiet

      - name: Native mobile interaction matrix
        run: npm run check:mobile-native

      - name: Connection and browser runtime contract
        run: npm run check:runtime-browser

      - name: Desktop overview contracts
        run: |
          npm run check:desktop-v1030
          npm run check:desktop-no-snapshot
          npm run check:desktop-incident-hierarchy

      - name: Public full-route navigation matrix
        run: |
          node tools/local-predeploy-check.js \
            --profile public \
            --viewports desktop=1600x1000,laptop=1366x900,tablet=1024x900,narrow=390x844 \
            --sections public-release \
            --scale-scenarios single \
            --strict-responsive \
            --out _acceptance/route-matrix-${{ github.sha }}

      - name: Public overview complete release matrix
        run: |
          node tools/local-predeploy-check.js \
            --profile public \
            --viewports desktop=1366x768,desktop1440=1440x900,wide=844x390,narrow=390x844 \
            --sections overview \
            --scale-scenarios single,fleet,all-offline,no-snapshot,collection-down,resource-full,interfaces-down \
            --strict-responsive \
            --out _acceptance/release-matrix-${{ github.sha }}

      - name: Public 19-route state release matrix
        run: |
          node tools/local-predeploy-check.js \
            --profile public \
            --viewports desktop=1366x768,narrow=390x844 \
            --sections public-release \
            --scale-scenarios single,fleet,all-offline,no-snapshot,collection-down,resource-full,interfaces-down \
            --strict-responsive \
            --out _acceptance/route-state-matrix-${{ github.sha }}

      - name: Public release readiness
        run: node tools/check-public-release-readiness.js

      - name: Upload public browser predeploy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-public-predeploy
          path: |
            _acceptance/release-matrix-${{ github.sha }}
            _acceptance/route-matrix-${{ github.sha }}
          if-no-files-found: ignore

      - name: Upload public route-state matrix
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-public-route-state-${{ github.sha }}
          path: _acceptance/route-state-matrix-${{ github.sha }}
          if-no-files-found: ignore

      - name: Installer shell checks
        run: |
          bash -n install.sh
          bash -n tools/build-routeros-container-archive.sh
          bash -n deploy_linux.sh
          bash tools/validate-public-install.sh

      - name: Docker image and RouterOS archive build
        run: |
          bash tools/build-routeros-container-archive.sh \
            --platform linux/amd64 \
            --tag routeros-triage-panel:routeros-ci \
            --output /tmp/routeros-triage-panel-routeros-ci.tar
          tar -tf /tmp/routeros-triage-panel-routeros-ci.tar | grep -Fx manifest.json
          tar -tf /tmp/routeros-triage-panel-routeros-ci.tar | grep -Fx repositories
          tar -tf /tmp/routeros-triage-panel-routeros-ci.tar | grep -E '/layer\.tar$'

  windows-packaging:
    name: Windows packaging
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Packaging preflight
        shell: pwsh
        run: .\tools\check-packaging-preflight.ps1 -StrictInstall -SkipDocker

      - name: Build Windows EXE directory
        shell: pwsh
        run: .\tools\build-windows-exe.ps1 -NoZip

      - name: Verify bundled public assets and env defaults
        shell: pwsh
        run: |
          $bundleRoot = ".\dist\routeros-triage-panel"
          $index = Get-ChildItem -Recurse $bundleRoot -Filter index.html | Select-Object -First 1
          if (-not $index) { throw "Bundled public/index.html was not found." }
          $indexText = Get-Content -Raw -LiteralPath $index.FullName
          if ($indexText -notmatch '<main\s+id="app"(?:\s|>)') { throw "Bundled frontend is missing the React application root." }
          if ($indexText -match 'data-app-shell="ikuai"' -or $indexText -match '<div\s+class="app ik-shell"(?:\s|>)') { throw "Bundled frontend still contains retired legacy shell markers." }
          if ($indexText -notmatch 'data-overview-framework-asset="style"') { throw "Bundled frontend is missing the framework style asset marker." }
          if ($indexText -notmatch 'data-overview-framework-asset="script"') { throw "Bundled frontend is missing the framework script asset marker." }
          $publicRoot = Split-Path -Parent $index.FullName
          if (-not (Test-Path -LiteralPath (Join-Path $publicRoot "assets\framework\style.css"))) { throw "Bundled framework style asset was not found." }
          if (-not (Test-Path -LiteralPath (Join-Path $publicRoot "assets\framework\panel-framework.js"))) { throw "Bundled framework script asset was not found." }
          $styleAsset = [regex]::Match($indexText, '/assets/framework/(style\.[0-9a-f]{12}\.css)').Groups[1].Value
          $scriptAsset = [regex]::Match($indexText, '/assets/framework/(panel-framework\.[0-9a-f]{12}\.js)').Groups[1].Value
          if (-not $styleAsset -or -not (Test-Path -LiteralPath (Join-Path $publicRoot "assets\framework\$styleAsset"))) { throw "Bundled content-addressed framework style was not found." }
          if (-not $scriptAsset -or -not (Test-Path -LiteralPath (Join-Path $publicRoot "assets\framework\$scriptAsset"))) { throw "Bundled content-addressed framework script was not found." }
          if (-not (Test-Path -LiteralPath (Join-Path $publicRoot "assets\framework\manifest.json"))) { throw "Bundled framework asset manifest was not found." }
          $envFile = ".\dist\routeros-triage-panel\routeros-panel.env"
          Select-String -Path $envFile -Pattern "ROS_PANEL_BIND=127.0.0.1" -Quiet | ForEach-Object {
            if (-not $_) { throw "Windows env is missing loopback bind default." }
          }
          Select-String -Path $envFile -Pattern "ROS_PANEL_TRUST_PROXY_HEADERS=0" -Quiet | ForEach-Object {
            if (-not $_) { throw "Windows env is missing proxy header default." }
          }
          Select-String -Path $envFile -Pattern "ROS_PANEL_ALLOW_LOCALHOST_HOST_FORWARD=0" -Quiet | ForEach-Object {
            if (-not $_) { throw "Windows env is missing localhost host-forward default." }
          }
          Select-String -Path $envFile -Pattern "ROS_PANEL_LOCALHOST_FORWARD_TOKEN=" -Quiet | ForEach-Object {
            if (-not $_) { throw "Windows env is missing localhost forward token default." }
          }
          Select-String -Path $envFile -Pattern "ROS_PANEL_PROFILE=routeros_only" -Quiet | ForEach-Object {
            if (-not $_) { throw "Windows env is missing RouterOS-only profile default." }
          }
          Select-String -Path $envFile -Pattern "ROS_PANEL_LOCAL_SETTINGS_WRITE_ENABLED=1" -Quiet | ForEach-Object {
            if (-not $_) { throw "Windows env is missing panel address write default." }
          }
